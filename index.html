<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="assets/logomark.png">
<title>Integrity Compounders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --brand:#af6452; --brand-deep:#633238; --brand-soft:rgba(175,100,82,.14);
  --bg:#0a0d12; --bg2:#0f131a; --panel:rgba(22,27,36,.72); --panel-solid:#161b24; --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12); --text:#e6e9ef; --muted:#8b93a3; --dim:#5d6575;
  --accent:#6aa6f8; --accent2:#8fbcff; --gold:#d4b25c; --green:#3fcf8e; --red:#ef6464; --amber:#f0a94a; --violet:#a78bfa;
  --q1:#6aa6f8; --q2:#3fcf8e; --q3:#ef6464; --q4:#f0a94a;
  --r:14px; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(106,166,248,.08),transparent 60%),linear-gradient(to bottom,transparent 0,var(--bg) 85%);pointer-events:none;z-index:0}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.caps{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:var(--red)} .amber{color:var(--amber)}
[hidden]{display:none!important}

/* gate */
#gate{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:340px}
.gate-hero{background:linear-gradient(180deg,rgba(99,50,56,.30),rgba(18,22,30,.90));border:1px solid var(--line2);border-radius:18px;padding:44px 24px 58px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.logo{width:48px;height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,13,18,.6);display:grid;place-items:center;margin:0 auto 18px}
.gate-hero h1{margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.field{margin-top:34px}
.input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:12px 13px;font:inherit;outline:none;transition:border .15s}
.input:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:9px;margin:14px 0 16px;color:var(--muted);font-size:13px}
.check input{accent-color:var(--accent);width:15px;height:15px}
.btn{width:100%;background:var(--brand);color:#0a1120;border:0;border-radius:10px;padding:12px;font:600 14px Inter,sans-serif;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.6;cursor:wait}
.gate-foot{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;text-align:center;color:var(--dim);font-size:12px}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px;text-align:center}

/* app shell */
#app{position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,13,18,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:34px;height:34px;margin:0;border-radius:9px}
.brand b{font-weight:700;font-size:15px;white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap;transition:all .15s}
nav.tabs a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.navgrp{align-self:center;margin:0 2px 0 10px;padding-left:10px;border-left:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;user-select:none}
nav.tabs a.on{color:var(--text);background:var(--brand-soft);box-shadow:inset 0 0 0 1px rgba(175,100,82,.4)}
/* The tab strip scrolls horizontally with a hidden scrollbar, so on a narrow window the tabs
   past the fold were unreachable with no affordance that they existed. The menu lists every
   tab and is always available; below 1150px it replaces the strip entirely. */
.menuwrap{position:relative;flex:0 0 auto}
.menubtn{display:inline-flex;align-items:center;gap:6px}
.menupanel{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:200px;padding:6px;
  /* --panel is rgba(...,.72) on purpose, for cards sitting over the page. A floating dropdown
     has to be opaque or the background grid reads straight through the labels. */
  background:#161b24;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:10px;
  box-shadow:0 10px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:1px}
.menupanel a{display:block;padding:8px 11px;border-radius:7px;color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:500;white-space:nowrap}
.menupanel a:hover{color:var(--text);background:rgba(255,255,255,.055)}
.mgrp{padding:9px 11px 3px;color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase}
.menupanel a.on{color:var(--text);background:rgba(106,166,248,.15);box-shadow:inset 0 0 0 1px rgba(106,166,248,.28)}
@media(max-width:1150px){nav.tabs{display:none}}
@media(min-width:1151px){.menubtn .mlabel{display:none}}
/* The brand title is white-space:nowrap and its wrapper had no min-width:0, so on a narrow
   window it could not shrink and ran straight through the menu button. Let it truncate, and
   drop the as-of line, which is repeated at the foot of every view anyway. */
@media(max-width:760px){
  .top-in{gap:10px;padding:12px 14px}
  .brand{flex:1 1 auto;min-width:0}
  .brand>div{min-width:0}
  .brand b{display:block;overflow:hidden;text-overflow:ellipsis}
  .brand #asof{display:none}
  .buildstamp{display:none}      /* a build timestamp is not worth header space on a phone */
}
.lock{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
main{max-width:1320px;margin:0 auto;padding:26px 24px 80px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 22px;flex-wrap:wrap}
.pagehead h2{margin:6px 0 0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:980px){.g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.card h3{margin:0;font-size:13.5px;font-weight:600;color:var(--text)}
.card .sub{color:var(--dim);font-size:12px;margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.chart{width:100%;height:280px} .chart.tall{height:360px} .chart.sm{height:220px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}} @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--dim);font-size:11.5px;margin-top:3px}

table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel-solid)}
.t th:hover{color:var(--muted)}
.todayrow{text-decoration:none;color:inherit;gap:12px}
.todayrow:hover{background:rgba(255,255,255,.035)}
.todaybreach{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
/* .tbl / .table-wrap / .pill are emitted by every view build_live.py injects — the Grid, Signals,
   Risk, Proposal, Analytics and the drawers — and had NO rules at all, so six tabs including the
   decision grid rendered as browser-default tables. Match .t, which the template's own tables use,
   so the two table systems look like one product. */
.table-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  position:sticky;top:0;background:var(--panel-solid);z-index:1}
.tbl th.sorted{color:var(--text)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.028)}
.tbl .srank{font-size:8.5px;opacity:.75;margin-left:1px}
/* Size + factor block (Grid and Universe tables): the first column carries a rule so the seven read as
   one group, and the cells sit tighter than the text columns around them. */
.tbl th.fac,.tbl td.fac{padding-left:7px;padding-right:7px;white-space:nowrap}
.tbl th.fb0,.tbl td.fb0{border-left:1px solid var(--line2);padding-left:12px}
/* On a phone the size/factor block is a swipe to the right of the ticker, and a row you cannot name is no use, so
   the first column stays put while the rest scrolls under it. Opt-in per table. */
.tbl.stickfirst th:first-child,.tbl.stickfirst td:first-child{position:sticky;left:0;z-index:2;background:var(--panel-solid);box-shadow:1px 0 0 var(--line)}
.tbl.stickfirst th:first-child{z-index:3}
@media(max-width:700px){.tbl.stickfirst td:first-child .nm{max-width:96px}}   /* a pinned column must leave room to scroll past it */
.pill{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  padding:2px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);vertical-align:1px}
.t td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tr.row{cursor:pointer;transition:background .12s} .t tr.row:hover{background:rgba(106,166,248,.06)}
.t .r{text-align:right}
.scroll{overflow-x:auto}
.tk{font-weight:700;letter-spacing:.01em}
.nm{color:var(--dim);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.chip.q1{color:var(--q1);border-color:rgba(106,166,248,.3)} .chip.q2{color:var(--q2);border-color:rgba(63,207,142,.3)}
.chip.q3{color:var(--q3);border-color:rgba(239,100,100,.3)} .chip.q4{color:var(--q4);border-color:rgba(240,169,74,.3)}
.chip.up{color:var(--green)} .chip.down{color:var(--red)} .chip.flat{color:var(--muted)}
.chip.bad{color:var(--red);border-color:rgba(239,100,100,.35)} .chip.warn{color:var(--amber);border-color:rgba(240,169,74,.35)} .chip.ok{color:var(--green);border-color:rgba(63,207,142,.3)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);width:84px;position:relative;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.spark{width:96px;height:26px;display:inline-block;vertical-align:middle}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:6px 10px;font:500 12px Inter;cursor:pointer}
.fbtn.on{color:var(--text);border-color:rgba(106,166,248,.45);background:rgba(106,166,248,.12)}
.search{background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;outline:none;width:180px}
.list{display:flex;flex-direction:column}
/* filter rows on the Grid and Holdings tabs */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fsel{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
.fsel select{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:5px 8px;font:500 12px var(--sans,inherit);text-transform:none;letter-spacing:0;
  max-width:190px}
.fsel select:hover{border-color:var(--brand)}
.fsel select:focus{outline:none;border-color:var(--brand)}
.fnum{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:7px;
  padding:5px 7px;font:500 12px var(--mono);width:74px;text-transform:none;letter-spacing:0}
.fnum.wide{width:124px}
.fnum:focus{outline:none;border-color:var(--brand)}
.colfilters{padding:11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);
  margin-bottom:12px;gap:11px 14px}
.colfilters[hidden]{display:none}
th.sorted{color:var(--text)}
sup.srank{font:600 9px var(--mono);color:var(--brand);margin-left:1px}
@media(max-width:700px){.fsel{width:100%}.fsel select{flex:1;max-width:none}}
/* period segmented control (Overview) */
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03);margin-left:12px}
.seg button{background:none;border:0;color:var(--muted);cursor:pointer;font:600 11.5px var(--mono);letter-spacing:.06em;
  padding:4px 10px;border-radius:6px}
.seg button:hover:not([disabled]):not(.on){color:var(--text)}
.seg button.on{background:var(--brand);color:#fff}
.seg button[disabled]{opacity:.32;cursor:default}
/* daily note on the Holdings tab */
.brief{border-color:rgba(175,100,82,.28);background:linear-gradient(180deg,rgba(175,100,82,.07),rgba(255,255,255,.012))}
.brief h3{margin:3px 0 0;font-size:19px;line-height:1.25;font-weight:650}
.brief.universe{border-color:rgba(63,207,142,.28);background:linear-gradient(180deg,rgba(63,207,142,.06),rgba(255,255,255,.012));margin-bottom:16px}
.brief.morning{border-color:rgba(106,166,248,.3);background:linear-gradient(180deg,rgba(106,166,248,.07),rgba(255,255,255,.012));margin-bottom:16px}
.memotag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid;border-radius:3px;padding:1px 5px;margin-right:7px;vertical-align:1px}
.memolt>li{margin-bottom:11px}
.brief h4{margin:0 0 7px;font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bnav{display:flex;align-items:center;gap:8px;flex:none}
.bbtn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;
  font:600 12px var(--mono);padding:3px 8px}
.bbtn:hover:not([disabled]){color:var(--text);border-color:var(--brand)}
.bbtn[disabled]{opacity:.3;cursor:default}
.blede{margin:11px 0 0;font-size:14.5px;line-height:1.6;color:var(--text)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 26px;margin-top:18px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.5}
.blist>li{padding-left:11px;border-left:2px solid var(--line)}
.blist .muted{font-size:12.5px;margin-top:2px}
.bahead{margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}
.bahead p{margin:5px 0 0;font-size:13.5px;line-height:1.6}
@media(max-width:700px){.bgrid{grid-template-columns:1fr}.brief h3{font-size:17px}}
/* plain-English thesis layer: the readable version, with the full record behind a toggle */
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.kv span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.kv b{font-size:13.5px}
.thesis-full{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.thesis-full>summary{cursor:pointer;font:500 12px var(--mono);color:var(--muted);list-style:none}
.thesis-full>summary::marker,.thesis-full>summary::-webkit-details-marker{display:none}
.thesis-full>summary::before{content:"▸ ";color:var(--dim)}
.thesis-full[open]>summary::before{content:"▾ "}
.thesis-full>summary:hover{color:var(--fg)}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{color:var(--dim);font-size:12px;line-height:1.55}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.55);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:#0d1118;border-left:1px solid var(--line2);z-index:41;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto}
.drawer.on{transform:none}
.dr-in{padding:22px 26px 60px}
.dr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-top h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.02em}
.x{background:none;border:1px solid var(--line2);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.mini div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini b{display:block;font-size:17px;margin-top:4px;font-variant-numeric:tabular-nums}
.sec{margin-top:22px}
.sec h4{margin:0 0 9px;font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sec p{margin:0;color:#cdd3de;line-height:1.6}
.sec ul{margin:0;padding-left:18px;color:#cdd3de} .sec li{margin:5px 0;line-height:1.5}
.mtab{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mtab div{background:#11161e;padding:9px 11px} .mtab small{display:block;color:var(--dim);font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase} .mtab b{font-size:13.5px;font-variant-numeric:tabular-nums}
.news{display:flex;flex-direction:column;gap:10px}
.news div{border-left:2px solid var(--line2);padding:2px 0 2px 12px}
.news .d{font:500 11px var(--mono);color:var(--dim)}
.news .h{font-weight:600;margin:2px 0;font-size:13.5px}
.news .w{color:var(--muted);font-size:12.5px}
.news div.major{border-left-color:var(--accent)}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;color:var(--muted)}
</style>
</head>
<body>

<!-- ─── gate ─────────────────────────────────────────────────────────────── -->
<section id="gate">
  <div class="gate-card">
    <div class="gate-hero">

<script>

/* ═══ auth + live data ═════════════════════════════════════════════════ */

  {auth:{persistSession:true, autoRefreshToken:true}});
let D = null, LIVE = {v2:{}, theses:{}, quotes:{}, jobs:[], matrix:null, risk:null, proposal:null, builtAt:null, briefs:[], vdur:{}, vdurHist:{}, vdurStats:null, vskips:{}, vskipsOk:false, rbeta:{}, rbetaOk:false, rgaps:{}, rgapsOk:false, rbetaHist:{}, suniv:{}, sunivOk:false, cards:{}, ranges:{}, funda:{}, fundaHist:{}}, QUOTE_TIMER = null;
async function q(view, build){ let r = SB.from(view).select("*"); if(build) r = build(r); const {data, error} = await r; if(error) throw error; return data; }
async function qAll(view, build, page = 1000){   // PostgREST caps a response at 1000 rows; page past it
  const out = [];
  for(let from = 0; ; from += page){
    let r = SB.from(view).select("*"); if(build) r = build(r);
    const {data, error} = await r.range(from, from + page - 1);
    if(error) throw error;
    out.push(...data);
    if(data.length < page) return out;
  }
}
async function loadPayload(){
  const rows = await q("site_payload");
  if(!rows.length) throw new Error("no-access");

}
async function loadQuotes(){

}
// One glance at whether the run that produced these numbers passed its own assertions. Until now
// nothing on the page answered that: only price_refresh wrote ic_job_runs and its status was
// fetched and never shown, so a chain that died at step 13 looked identical to one that finished.
function renderPipeline(){
  const el = document.getElementById("pipestate");
  const h = (LIVE.pipeline || {}).health;
  if(!el || !h) return;
  let v; try{ v = typeof h.value === "string" ? JSON.parse(h.value) : h.value; }catch(e){ return; }
  if(!v) return;
  const age = Math.round((Date.now() - new Date(h.updated_at)) / 36e5);
  const bad = v.failed > 0, stale = age > 30;
  const col = bad ? C.red : stale ? C.amber : C.green;
  const txt = bad ? `${v.failed} check${v.failed > 1 ? "s" : ""} failing`
            : stale ? `checks ${age}h old` : `${v.checks} checks ok${v.warnings ? ` · ${v.warnings} warn` : ""}`;
  const detail = [...(v.failing || []), ...(v.warning || [])].join(", ");
  el.innerHTML = `<span class="caps" style="font-size:9px;color:${col}" title="${esc(detail || "all checks passed")}">● ${esc(txt)}</span>`;
}
function applyQuotes(){
  if(!D) return;
  let total = 0;
  D.holdings.forEach(h => {
    const qt = LIVE.quotes[h.tk];
    if(qt && qt.price != null){ h.price = +qt.price; h.day = qt.day_change != null ? +qt.day_change : null; h.quote_date = qt.price_date; }
    h.value = (h.shares||0) * (h.price||0); h.pl = h.avg_cost && h.price ? h.price/h.avg_cost - 1 : null; total += h.value;
  });
  D.holdings.forEach(h => h.weight = total ? h.value/total : null);
  D.book_value = total;
  const pr = LIVE.jobs.find(j => j.job === "price_refresh");
  const t = pr ? new Date(pr.ran_at) : null;
  const dayPl = D.holdings.reduce((a,h) => a + (h.day!=null ? h.value - h.value/(1+h.day) : 0), 0);
  document.getElementById("asof").textContent =
    (t ? "Prices " + t.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "Prices —") +
    " · analytics " + new Date(LIVE.builtAt).toLocaleDateString([], {month:"short", day:"numeric"}) +
    " · today " + (dayPl>=0?"+":"−") + "$" + Math.abs(Math.round(dayPl)).toLocaleString();
}
async function enter(){

  try{ await loadPayload(); await loadQuotes(); LIVE.theses = Object.fromEntries((await qAll("site_theses")).map(t => [t.ticker, t]));

    // WHY a name is absent from the DCF set, as recorded by valuation_duration.py for the current run

    try{

    // Measured rate sensitivity (ic_rate_beta). Its own view and its own coverage (411 core companies

    // The regime dashboard (db/032). Two sources, deliberately NOT blended: the market index asks what

    }catch(e){ LIVE.bridge = null; LIVE.bridgeOk = false; }
    // CASH AND TRADES COME FROM LIVE VIEWS, NOT THE NIGHTLY PAYLOAD. Both change the moment a trade
    // is logged, and the payload is a snapshot: on 2026-10-22 four exits at 17:30 left the site
    // showing 29 holdings, 33 trades and $29,318 against a book of 25, 37 and $212,243 until the

    }catch(e){}
    // The model of models. Until this existed the site showed only the EQUITY sleeve, so the thing
    // a client actually holds — 60/40 or 80/20 — appeared nowhere and the book's 26.7% volatility
    // read as though it were the portfolio's.
    try{
      LIVE.models = await qAll("site_model_portfolios", r => r.order("as_of"));
      LIVE.mstats = Object.fromEntries((await qAll("site_model_stats")).map(m => [m.model, m]));

    }catch(e){ LIVE.models = []; LIVE.mstats = {}; LIVE.modelsOk = false; }
    try{
      LIVE.mrisk = Object.fromEntries((await qAll("site_model_risk")).map(m => [m.model, m]));
    }catch(e){ LIVE.mrisk = {}; }
    // What applying the regime's multiplier would have cost and bought. Both proxies, because the

    try{
      LIVE.brake = Object.fromEntries((await qAll("site_brake_comparison")).map(b => [b.proxy, b]));

    }catch(e){ LIVE.brake = {}; LIVE.brakeOk = false; }
    // Market cap and the six factor percentiles for the active names (site_universe, 412 rows — one page).
    // Its own try: the Grid and Universe size/factor columns degrade to dashes with a stated reason, and
    // the rest of the page boots regardless. sunivNorm blanks a stored cap that cannot be a company.
    try{
      LIVE.suniv = Object.fromEntries((await qAll("site_universe")).map(u => [u.ticker, sunivNorm(u)]));
      LIVE.sunivOk = true;
    }catch(e){ LIVE.suniv = {}; LIVE.sunivOk = false; }
    LIVE.ranges = {};
    for(const r of await qAll("site_range_dynamics")) (LIVE.ranges[r.ticker] ||= {})[r.horizon] = r;
    // One row per name — small. The 24-vintage HISTORY is ~11,000 rows and is fetched per ticker

    try{

    }catch(e){ LIVE.funda = {}; }
    LIVE.fundaHist = {};
    try{
      LIVE.pipeline = Object.fromEntries((await q("site_pipeline_state")).map(r => [r.key, r]));

    }catch(e){ LIVE.pipeline = {}; }
    LIVE.cards = Object.fromEntries((await qAll("site_company_card")).map(v => [v.ticker, v])); }
  catch(x){
    err.textContent = x.message === "no-access" ? "This account doesn't have access." : "Couldn't load data: " + (x.message||x);

  }

  boot();
  clearInterval(QUOTE_TIMER);
  QUOTE_TIMER = setInterval(async () => {
    if(document.hidden) return;
    // The drawer's open class is "on" (index.html:196), not "open" — so this guard was always
    // false and the 60-second tick re-routed underneath an open drawer, which closes it and

      const drawerOpen = !!document.querySelector(".drawer.on");
      const filtering = document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName);
      if(["overview","holdings"].includes(v) && !drawerOpen && !filtering && !document.hidden) route();

/* ═══ formatting ═════════════════════════════════════════════════════════ */
const C = {accent:"#6aa6f8", accent2:"#8fbcff", gold:"#d4b25c", green:"#3fcf8e", red:"#ef6464", amber:"#f0a94a",
           violet:"#a78bfa", muted:"#8b93a3", dim:"#5d6575", line:"rgba(255,255,255,.07)", text:"#e6e9ef",
           q:{Q1:"#6aa6f8",Q2:"#3fcf8e",Q3:"#ef6464",Q4:"#f0a94a"}};
const pct = (v, d=1, sign=true) => v==null||isNaN(v) ? "—" : (sign && v>0 ? "+" : "") + (v*100).toFixed(d) + "%";
const pctRaw = (v, d=0) => v==null||isNaN(v) ? "—" : (v>0?"+":"") + Number(v).toFixed(d) + "%";   // already-percent values
// Already-percent, no sign. A margin or a return on capital is not a change, so "+54%" reads wrong.
const pctFlat = (v, d=0) => v==null||isNaN(v) ? "—" : Number(v).toFixed(d) + "%";
const num = (v, d=2) => v==null||isNaN(v) ? "—" : Number(v).toFixed(d);
const usd = (v, d=0) => v==null||isNaN(v) ? "—" : "$" + Number(v).toLocaleString(undefined,{minimumFractionDigits:d, maximumFractionDigits:d});
const cls = v => v==null ? "" : v>=0 ? "pos" : "neg";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qchip = q => q ? `<span class="chip ${q.toLowerCase()}">${q}</span>` : `<span class="chip">—</span>`;

/* ═══ size + factor cells (shared by the Grid and the Universe table) ═══════════════
   site_universe carries market cap and six factor percentiles for every active name. factor_scorer.py
   signs each percentile so that HIGH = MORE OF THE FACTOR, which reads naturally for five of them and
   backwards for one: size is scored as -ln(market cap), so size_pct 99 is among the SMALLEST names.
   A column plainly called "Size" that sorted large-first on it would put the smallest company in the
   universe on top, so the column is called Smallness and its tooltip says why. Low vol is the other
   one to read twice: high means a LOWER beta and volatility, i.e. calm. */
const MCAP_FLOOR = 1e6;     // below $1M a "market cap" is a units defect, not a company (see sunivNorm)
const FACTORS = [
  {k:"value",    label:"Value",     tip:"high = cheaper: FCF/EV yield, forward P/E, EV/EBITDA"},
  {k:"momentum", label:"Momentum",  tip:"high = stronger risk-adjusted 12-1 and 12-month return"},
  {k:"quality",  label:"Quality",   tip:"high = higher ROIC and margins, lower net debt / EBITDA"},
  {k:"lowvol",   label:"Low vol",   tip:"high = LOWER beta and 12-month volatility, i.e. calm; not high volatility"},
  {k:"size",     label:"Smallness", tip:"high = SMALLER. The size factor is scored as -ln(market cap), so 99 is among the smallest names and 1 among the largest. Sort Mkt cap for literal size"},
  {k:"growth",   label:"Growth",    tip:"high = faster consensus forward revenue and EPS growth"},
];
// Column ids for the block. Grid headers, Grid cells and the Universe table all derive from these two
// lists, so the header count and the cell count cannot drift apart.
const FAC_KEYS = ["mcap", ...FACTORS.map(f => "f_" + f.k)];
// Normalise one site_universe row. Numerics arrive as numbers or strings depending on the driver, and a
// stored market cap under $1M is not a company: KSPI is stored as 17,670.64, which is its cap in
// $ MILLIONS written into a column that holds dollars. Left alone it sorts as the smallest company in
// the universe, and its size percentile (derived from the same figure) says so too. Both are blanked
// here, the raw figure is kept for the tooltip, and the cause is upstream, not on this page.
function sunivNorm(u){
  const o = {...u};
  for(const k of ["market_cap","value_pct","momentum_pct","quality_pct","lowvol_pct","size_pct","growth_pct"])
    o[k] = u[k] == null || isNaN(u[k]) ? null : +u[k];
  // the factor profile names the factors a stock loads on, and size is one of the six, so it is withheld too
  if(o.market_cap != null && o.market_cap < MCAP_FLOOR){ o.mcap_bad = o.market_cap; o.market_cap = null; o.size_pct = null; o.factor_profile = null; }
  return o;
}
function fmtCap(v){
  if(v == null || isNaN(v)) return "—";
  v = +v;
  return v >= 999.95e9 ? "$" + (v/1e12).toFixed(2) + "T"
       : v >= 999.5e6  ? "$" + (v/1e9).toFixed(1) + "B"
       : "$" + Math.round(v/1e6) + "M";
}
// WHY a cell is blank, so a dash never has to be guessed at.
function facWhy(u, tag, what){
  if(typeof LIVE !== "undefined" && LIVE.sunivOk === false) return "The size and factor table could not be loaded";
  if(!u) return tag === "micro" ? "Micro-sleeve name: not in the core factor cross-section"
                                : "Not in the size and factor table";
  if(u.mcap_bad != null && (what === "mcap" || what === "f_size"))
    return `Stored market cap is ${usd(u.mcap_bad, 2)}, which cannot be a company's cap; it looks like a figure in $ millions written where dollars belong. Not shown`;
  if(what === "mcap") return "No market cap on file";
  return "Not enough data to score this factor";
}
// factor_scorer stores the conventional academic names, so a name loading on size reads "Size" —
// directly contradicting the column beside it, which is called Smallness precisely because the
// factor is -ln(market_cap). 103 names carry this profile and every one is a small cap. Renamed at
// display time rather than in the scorer, so the stored value keeps the convention the literature
// uses and only the user-facing word changes.
function profileLabel(p){
  if(!p) return "—";
  return String(p).split(" / ").map(x => x.trim() === "Size" ? "Smallness" : x).join(" / ");
}
function capCell(u, tag){
  const v = u ? u.market_cap : null;
  if(v == null) return `<span class="muted" title="${esc(facWhy(u, tag, "mcap"))}">—</span>`;
  return `<span class="mono" title="${esc("Market cap " + usd(v))}">${fmtCap(v)}</span>`;
}
// A percentile, 0 decimals. Extremes (top or bottom fifth) are set in full text colour and bold, the middle
// is muted, so a column of 400 numbers still shows where the unusual names are. No colour is used for
// "good" or "bad": for Smallness and Low vol, high is not better, it is just more of that factor.
function facCell(u, f, tag){
  const v = u ? u[f.k + "_pct"] : null;
  if(v == null) return `<span class="muted" title="${esc(f.label + ": " + facWhy(u, tag, "f_" + f.k))}">—</span>`;
  const hot = v >= 80 || v <= 20;
  return `<span class="mono${hot ? "" : " muted"}"${hot ? ' style="font-weight:600"' : ""} title="${esc(f.label + " percentile " + Math.round(v) + " of 100 · " + f.tip)}">${Math.round(v)}</span>`;
}
// TWO ENGINES, TWO VOCABULARIES, ONE CONCEPT. ic_technicals (v1, the 200-day read that drives the
// decision grid) says UPTREND / NEUTRAL / DOWNTREND. ic_technicals_v2 (the track line) says
// BULLISH / BEARISH with no neutral. This chip only knew v1's words, so every BULLISH and BEARISH
// fell through to "Flat" — the Signals tab rendered all 456 names as "■ Flat" and the name drawer
// did the same, which is total information loss on a column, not a cosmetic slip.
//
// Both vocabularies are now mapped, and the label says WHICH read it is, because the two genuinely
// disagree: on 2026-10-15 NEM was NEUTRAL to v1 and BULLISH to v2, AVGO NEUTRAL and BEARISH. A
// reader seeing "Up" on one tab and "Down" on another for the same name deserves to know they are
// different measurements rather than a contradiction.
const TREND_LOOK = {
  UPTREND:   ["up",   "▲ Up",   "200-day trend (drives the grid)"],
  DOWNTREND: ["down", "▼ Down", "200-day trend (drives the grid)"],
  NEUTRAL:   ["flat", "■ Flat", "200-day trend (drives the grid)"],
  BULLISH:   ["up",   "▲ Bull", "track line (technical v2)"],
  BEARISH:   ["down", "▼ Bear", "track line (technical v2)"],
};
const trendChip = t => { if(!t) return "—";
  const [cls, label, title] = TREND_LOOK[t] || ["flat", t, ""];
  return `<span class="chip ${cls}" title="${title}">${label}</span>`; };
const alignBar = (v, b) => { if(v==null) return "—"; const col = v>=65?C.green:v<35?C.red:C.accent;
  return `<span class="bar"><i style="width:${Math.max(3,Math.min(100,v))}%;background:${col}"></i></span> <span class="mono" style="font-size:12px;color:${col}">${v.toFixed(0)}</span>`; };
const thesisChip = s => !s ? `<span class="chip">—</span>` : `<span class="chip ${s==='BROKEN'||s==='REVIEW'?'bad':s==='WATCH'?'warn':'ok'}">${s}</span>`;

/* ═══ charts ═════════════════════════════════════════════════════════════ */
const charts = [];
function mk(el, opt){
  const ch = echarts.init(el, null, {renderer:"canvas"});

/* ═══ ABOUT — the process, start to finish, in plain language ═════════════ */
function about(el){
  const step = (n, title, body) => `<div class="card" style="margin-top:14px"><div class="card-h"><div>
      <h3><span style="color:var(--brand);font-variant-numeric:tabular-nums">${n}</span> &nbsp;${title}</h3></div></div>
      <div style="padding:2px 2px 4px;line-height:1.65">${body}</div></div>`;
  el.innerHTML = head("Integrity Compounders", "How the model works", `<span class="muted">V12.1</span>`) +
  `<div class="card"><div style="line-height:1.7">
     <b>What we are trying to own:</b> businesses that compound — they earn high returns on the capital they
     employ, convert profit into cash, and reinvest it at attractive rates, with management that allocates
     capital honestly. We want to own them while the numbers are improving rather than deteriorating, and to
     buy them at sensible points rather than after they have run.
     <br><br><b>How the process is organised:</b> a quality screen defines the universe; every name in it goes
     through the same quantitative process; the analytics produce a grade and a timing read; the portfolio is
     built from those outputs; each position carries a written thesis with the conditions that would make us sell.
   </div></div>` +
  step(1, "The universe — a quality screen, not the whole market", `
    We never start from every listed company. The starting list comes from a Fiscal screen that only admits
    businesses already showing compounder characteristics:
    <ul class="list">
      <li>US-listed, market cap above roughly $2B, share price above $10 — investable and liquid</li>
      <li>Return on invested capital and operating margin positive and healthy</li>
      <li>Revenue and earnings grown over three years <i>and</i> expected to keep growing</li>
      <li>Leverage contained, capital spending not consuming the business</li>
      <li>Buybacks positive, valuation not extreme</li>
    </ul>
    The screen currently admits about 350 names out of thousands, and is refreshed weekly. Every entry and exit
    is logged. A name is never dropped automatically: screen absence is surfaced for review, and holdings are exempt.`) +
  step(2, "The quadrant — accelerating or decelerating?", `
    For every name we compare what the business is expected to do against what it has done:
    <ul class="list">
      <li><b>Revenue momentum</b> = expected revenue growth − recent revenue growth</li>
      <li><b>Earnings momentum</b> = expected earnings growth − recent earnings growth</li>
    </ul>
    <b>Q1</b> both accelerating, the ideal · <b>Q2</b> revenue accelerating while earnings compress ·
    <b>Q3</b> both decelerating, which needs an explicit override to own ·
    <b>Q4</b> earnings rising while revenue falls — usually cost-cutting, and the bucket we most want to avoid.
    A quadrant change must persist two consecutive months before we act on it.`) +
  step(3, "Quality and honesty checks", `
    <ul class="list">
      <li><b>Quality Growth Score</b> — expected growth, cash-flow yield on enterprise value, return on capital
          and cash margin combined into one ranked number (rare elite → low quality).</li>
      <li><b>Growth efficiency</b> — how much growth survives dilution from share issuance and stock compensation.</li>
      <li><b>Six quality indicators</b> — capital efficiency, pricing power, operating efficiency, cash conversion,
          growth durability, balance sheet. They describe a company; they never remove it.</li>
      <li><b>Earnings-quality flag</b> — if earnings are accelerating while gross profit is not, the improvement
          is flagged as potentially engineered and gets extra scrutiny.</li>
    </ul>`) +
  step(4, "Human scoring — the three pillars", `
    Every candidate is scored 1–10 on three pillars, with evidence:
    <ul class="list">
      <li><b>Business quality (40%)</b> — moat durability, economics, reinvestment quality</li>
      <li><b>Management &amp; capital allocation (35%)</b> — direction of returns on capital, M&amp;A and buyback
          discipline, dilution, candour. <b>Hard floor 6.0.</b></li>
      <li><b>Financial strength (25%)</b> — balance sheet, earnings and cash quality, self-funding. <b>Floor 6.0.</b></li>
    </ul>
    A composite below 6.5 is not eligible. Valuation deliberately sits outside the pillars, in the quality score.`) +
  step(5, "The grade — one letter per company", `
    <ul class="list">
      <li><b>A</b> — accelerating, high quality, scores clear, no flags</li>
      <li><b>B</b> — ownable, something short of A</li>
      <li><b>C</b> — unscored, composite under 6.5, one floor breach, or earnings flagged</li>
      <li><b>D</b> — thesis broken, or both floors breached</li>
    </ul>`) +
  step(6, "Technicals — timing, never thesis", `
    Technicals decide <i>when</i>, never <i>what</i>:
    <ul class="list">
      <li><b>Trend rating</b> (Strong Buy → Strong Sell) from the 200-day trend. Its job is risk: names in an
          uptrend have had a materially lower chance of a large drawdown. We don't initiate into a downtrend.</li>
      <li><b>Timing</b> from where price sits in its expected range, whether buyers since the 52-week low and
          since the last earnings report are in profit, and recent bottom or reversal signals. It reads
          Buy zone → Trim zone and paces entries and exits.</li>
    </ul>
    Each piece was backtested before use; what failed — a second trend line, RSI regimes, exhaustion counts
    alone — was left out.`) +
  step(7, "The decision grid", `
    Grade × trend rating gives the action (accumulate, starter, hold, review, trim, reduce, exit) and timing
    paces it. "Accumulate · BUY NOW" is a qualified name at the low end of its range; "Accumulate · WAIT for
    range low" is the same company, extended. The grid is a default, not a cage — discretionary overrides are
    allowed and documented.`) +
  step(8, "Building the portfolio", `
    <ul class="list">
      <li><b>Three position sizes</b> — 2% starter, 4% full, 6% the most we will deliberately
          allocate to one name. A winner that drifts above 6% is left alone; nothing is trimmed
          for getting large, and a reduction is always a decision someone makes and records</li>
      <li><b>Sector cap 28%</b> of names</li>
      <li><b>Correlation clusters</b> — names that move together are capped at four per cluster</li>
      <li><b>Turnover control</b> — a supported holding isn't sold merely for being outranked</li>
      <li><b>Risk gates</b> — a proposed book must pass simulated drawdown limits (1-year median ≤ 12%,
          worst case ≤ 20%) and is stress-tested against past crises and factor shocks</li>
    </ul>`) +
  step(9, "The thesis — and what would make us sell", `
    Nothing is owned without a written thesis in three parts:
    <ul class="list">
      <li><b>Catalyst</b> — why we own it: what the company does, and the theme we want exposure to</li>
      <li><b>Edge</b> — why this company rather than named competitors</li>
      <li><b>Risk</b> — what could invalidate the thesis: business, industry, competitive, regulatory,
          balance-sheet or management risk, each with a metric to watch and a trigger. Never "the price fell";
          that is not a risk to a business.</li>
    </ul>
    Theses are drafted from primary data, reviewed, then locked. Reviews are quarterly, plus whenever a trigger fires.`) +
  step(10, "Monitoring, and how a position ends", `
    Prices refresh through the day. After each close the whole chain reruns: signals, technicals, grid, proposal,
    risk, income and volatility. A position ends when the thesis breaks, a pillar floor is breached, the grade
    falls to D, a risk trigger fires, or a portfolio limit forces it out. A falling price alone is not an exit —
    it is a reason to re-check the thesis.`) +
  step(11, "What we have proven — and what we haven't", `
    <ul class="list">
      <li><b>Where we stand:</b> the live book has beaten SPY, but its 1.7 beta explains the gap; measured alpha
          is not yet distinguishable from zero.</li>
      <li><b>What the tests support:</b> trend state helps avoid large drawdowns, and buying qualified names at
          the low end of their range beat buying them extended. Quality grades plus technical confirmation beat
          the screened universe by roughly 7–8%/yr since January 2024 — a test that still carries survivorship
          bias and is not statistically conclusive.</li>
      <li><b>What we do about it:</b> since September 2026 every variant — the grid's picks, the proposal, the
          quads, and the real book — is tracked forward monthly against SPY, unedited. That record, not a
          backtest, is what will show whether the process adds value.</li>
    </ul>`) +
  `<div class="note" style="margin-top:18px">Integrity Wealth Partners · internal research tool.
     Nothing here is a recommendation or an offer.</div>`;
}

let sigFilter = {q:"", trend:"", timing:"", held:false};
let sigSort = {k:"range_pos", d:1};
const TREND_ORD = {BULLISH:0, BEARISH:1};
const REGIME_ORD = {BULL:0, NEUTRAL:1, BEAR:2};
const SIG_COLS = [
  ["ticker","Ticker","txt"], ["close","Price","num"], ["trend","Trend line","ord"], ["range_pos","Timing","ord"],
  ["trade_mid","Trade range (1w)","num"], ["trend_mid","Trend range (1m)","num"], ["rsi","RSI","num"],
  ["rvol","Rel vol","num"], ["above_52w_low_avwap","52w-low VWAP","ord"], ["td","TD b/s","num"],
  ["range_move","Range moving","ord"],
  ["tech_rating","Rating","ord"],
];
// Sort order puts the directional reads first and the two non-directional ones last, so sorting by
// this column groups bullish ranges at one end and bearish at the other rather than alphabetically.
const RANGE_ORD = {HIGHER_HIGHS: 0, BROADENING: 1, STABLE: 2, NARROWING: 3, LOWER_LOWS: 4};
// One compact cell: which way the 1-week range is moving, with a marker when it just reversed and
// an arrow for a width that is expanding or compressing.
function rangeCell(tk){
  const r = ((typeof LIVE !== "undefined" && LIVE.ranges) || {})[tk];
  const d = r && r.trade; if(!d || !d.direction) return '<span class="muted">—</span>';
  const [what,, col] = RANGE_DIR[d.direction] || ["", "", "muted"];
  const c = {green:C.green, red:C.red, amber:C.amber, muted:C.muted}[col];
  const w = d.volatility === "EXPANDING" ? " ↔" : d.volatility === "COMPRESSING" ? " ><" : "";
  return `<span style="color:${c};white-space:nowrap">${d.reversal ? "⚑ " : ""}${esc(what)}</span>` +
         (w ? `<span class="muted" style="font-size:10px" title="range ${esc(d.volatility.toLowerCase())}">${w}</span>` : "");
}
function sigKey(v, k, M){
  const n = x => x == null ? null : +x;
  if(k === "trend") return TREND_ORD[v.trend] ?? 9;
  if(k === "range_pos") return [TIMING_ORD[v.timing] ?? 9, n(v.range_pos) ?? 9];   // timing bucket, then depth in range
  if(k === "above_52w_low_avwap") return v.above_52w_low_avwap ? 0 : 1;
  if(k === "tech_rating") return TECH_ORD[(M[v.ticker]||{}).tech_rating] ?? 9;
  if(k === "trade_mid") return v.trade_low == null ? null : (+v.trade_low + +v.trade_high) / 2;
  if(k === "trend_mid") return v.trend_low == null ? null : (+v.trend_low + +v.trend_high) / 2;
  if(k === "td") return (v.td_buy_count || 0) - (v.td_sell_count || 0);
  if(k === "range_move"){
    const d = ((LIVE.ranges||{})[v.ticker]||{}).trade;
    return d && d.direction ? (RANGE_ORD[d.direction] ?? 9) : 9;
  }
  if(k === "ticker") return v.ticker.toLowerCase();
  return n(v[k]);
}

function slugCard(){

    return [label, `${up.length}/${arr.length} (${pct(up.length/arr.length,0,false)})`, pct(au,2), pct(ad,2),

  if(T.n) rows.push(["Positions (closed + open)", `${Math.round(T.n*(T.ba||0))}/${T.n} (${pct(T.ba,0,false)})`,

  const mSlug = (() => { const up = monthly.filter(v=>v>0), dn = monthly.filter(v=>v<0);

/* ═══ technical chart (v2 overlays computed in the browser from daily bars) ═══ */
function techSeries(bars){   // bars: [{d, o, h, l, c, v}] ascending
  const n = bars.length, C_ = bars.map(b=>b.c), H=bars.map(b=>b.h), L=bars.map(b=>b.l), V=bars.map(b=>b.v||0);
  const ema = (arr, span) => { const k=2/(span+1); const o=[]; arr.forEach((v,i)=> o.push(i? o[i-1]+k*(v-o[i-1]) : v)); return o; };
  const tr = C_.map((c,i) => i ? Math.max(H[i]-L[i], Math.abs(H[i]-C_[i-1]), Math.abs(L[i]-C_[i-1])) : H[i]-L[i]);
  const atr = tr.map((_,i) => i<13 ? null : tr.slice(i-13,i+1).reduce((a,b)=>a+b,0)/14);
  // track line: EMA26, flips after 2 closes beyond ±1.5 ATR
  const line = ema(C_, 26); const bull=[]; let st=true, cnt=0;
  for(let i=0;i<n;i++){
    if(atr[i]!=null){ const want = C_[i] > line[i]+1.5*atr[i] ? true : C_[i] < line[i]-1.5*atr[i] ? false : st;
      cnt = want!==st ? cnt+1 : 0; if(cnt>=2){ st=want; cnt=0; } }
    bull.push(st);
  }
  // EWMA σ (λ≈0.94) then smoothed, and the calibrated bands
  const lr = C_.map((c,i)=> i? Math.log(c/C_[i-1]) : 0);
  let m=0, v2=0; const sig=[];
  lr.forEach((r,i)=>{ m = 0.06*r + 0.94*m; v2 = 0.06*(r-m)*(r-m) + 0.94*v2; sig.push(Math.sqrt(v2)); });
  const sigS = ema(sig, 10);
  const vwma = (win) => C_.map((_,i) => { if(i<win-1) return null; let pv=0, vv=0;
    for(let j=i-win+1;j<=i;j++){ pv += C_[j]*V[j]; vv += V[j]; }
    return vv>0 ? pv/vv : C_.slice(i-win+1,i+1).reduce((a,b)=>a+b,0)/win; });
  const band = (win, hz, wgt, k, ms) => { const vw=vwma(win), e=ema(C_, ms), lo=[], hi=[], mid=[];
    for(let i=0;i<n;i++){ if(vw[i]==null || i<win){ lo.push(null); hi.push(null); mid.push(null); continue; }
      const mi = wgt*vw[i] + (1-wgt)*e[i], b = k*sigS[i]*Math.sqrt(hz);
      mid.push(mi); lo.push(mi*Math.exp(-b)); hi.push(mi*Math.exp(b)); }
    return {lo, hi, mid}; };
  const trade = band(15, 5, 0.25, 1.2, 10), trend = band(63, 21, 0, 1.0, 5);
  // AVWAP from the rolling 252-day low
  const avwap = C_.map((_,i) => { if(i<60) return null; const s0=Math.max(0,i-251);
    let lo=Infinity, li=s0; for(let j=s0;j<=i;j++) if(L[j]<lo){ lo=L[j]; li=j; }
    let pv=0, vv=0; for(let j=li;j<=i;j++){ pv += (H[j]+L[j]+C_[j])/3*V[j]; vv += V[j]; }
    return vv>0 ? pv/vv : null; });
  // RSI(14)
  const rsi=[]; let up=0, dn=0;
  for(let i=0;i<n;i++){ const d = i? C_[i]-C_[i-1] : 0; up = i? up + ((d>0?d:0)-up)/14 : 0; dn = i? dn + ((d<0?-d:0)-dn)/14 : 0;
    rsi.push(i<14 || dn===0 ? null : 100 - 100/(1+up/dn)); }
  // TD Sequential: setup 9 (close vs close[4]) and countdown 13 (close vs low/high[2])
  const tdB=[], tdS=[], buy9=[], sell9=[], buy13=[], sell13=[];
  let bc=-1, sc=-1;
  for(let i=0;i<n;i++){
    const b = i>=4 && C_[i] < C_[i-4] ? (tdB[i-1]||0)+1 : 0;
    const sl = i>=4 && C_[i] > C_[i-4] ? (tdS[i-1]||0)+1 : 0;
    tdB.push(b); tdS.push(sl); buy9.push(b===9); sell9.push(sl===9);
    if(b===9){ bc=0; sc=-1; } if(sl===9){ sc=0; bc=-1; }
    let b13=false, s13=false;
    if(i>=2){
      if(bc>=0 && C_[i] <= L[i-2]){ bc++; if(bc===13){ b13=true; bc=-1; } }
      if(sc>=0 && C_[i] >= H[i-2]){ sc++; if(sc===13){ s13=true; sc=-1; } }
    }
    buy13.push(b13); sell13.push(s13);
  }
  // LTF markers: T / B at 20-bar extremes with RSI confirmation, R on an RSI re-cross above its signal
  const sig9 = ema(rsi.map(v => v==null?50:v), 9);
  const thin = (arr) => arr.map((v,i) => v && !arr.slice(Math.max(0,i-5),i).some(Boolean));
  const rng = (i) => (H[i]-L[i]) || 1e-9;
  const top = [], bot = [], rev = [];
  for(let i=0;i<n;i++){
    const w = Math.max(0, i-19);
    const wb = Math.max(0, i-9);
    const hiMax = Math.max(...H.slice(w, i+1)), loMin = Math.min(...L.slice(wb, i+1));
    const p = (C_[i]-L[i]) / rng(i), r = rsi[i];
    top.push(r!=null && H[i] >= hiMax && r >= 60 && p < 0.5);
    bot.push(r!=null && L[i] <= loMin && r <= 50 && p > 0.5);
    const prevLow = i>=3 ? Math.min(rsi[i-1]??50, rsi[i-2]??50, rsi[i-3]??50) : 50;
    rev.push(i>0 && r!=null && r > sig9[i] && (rsi[i-1]??50) <= sig9[i-1] && prevLow < 45 && C_[i] > H[i-1]);
  }
  return {line, bull, trade, trend, avwap, rsi, td:{b:tdB, s:tdS, buy9, sell9, buy13, sell13},
          marks:{T:thin(top), B:thin(bot), R:thin(rev)}};
}

const TIMING_COL = {BUY_ZONE:C.green, ACCUMULATE_OK:"#5fbf8f", NEUTRAL:C.muted, WAIT_FOR_LOW_END:C.amber,
                    TRIM_ZONE:C.amber, AVOID_EXTENDED:C.red, NO_DATA:C.dim};
const timingChip = (t, pos) => !t ? "—" :
  `<span style="color:${TIMING_COL[t]||C.text}">${esc(t.replaceAll("_"," "))}</span>${pos!=null?` <span class="muted">${Math.round(pos*100)}%</span>`:""}`;
// The risk range as one scannable cell: the 1-week band's low and high with a marker for where the
// price sits in it. Timing already names the zone; this shows the distance to each edge, which is
// what you need to size an entry or a trim, and it belongs on any row you scroll rather than only
// in a drawer (Niko, 2026-10-16).
//
// THE MARKER IS CLAMPED, THE NUMBER IS NOT. range_pos runs outside [0,1] whenever price has broken
// its own band — AMAT reads -0.151 today, i.e. 15% of a band-width BELOW the low. Clamping silently
// would draw that identically to "sitting on the low", which is the one case worth seeing, so an
// out-of-band marker is outlined in red and the tooltip says so.
function rangeBand(lo, hi, pos, timing){
  if(lo == null || hi == null) return '<span class="muted">—</span>';
  const L = +lo, H = +hi, p = pos == null ? null : +pos;
  const col = TIMING_COL[timing] || C.accent;
  const cl = p == null ? 0.5 : Math.max(0, Math.min(1, p));
  const out = p != null && (p < 0 || p > 1);
  const dp = H < 10 ? 2 : 0;
  const tip = (timing ? timing.replaceAll("_", " ") + " · " : "")
    + (p == null ? "position in band unknown"
       : out ? `price is ${Math.abs(Math.round((p < 0 ? -p : p - 1) * 100))}% of a band-width `
               + `${p < 0 ? "BELOW the low" : "ABOVE the high"}`
       : `price sits ${Math.round(p * 100)}% up the band`)
    + ` · 1-week risk range ${usd(L, dp)}–${usd(H, dp)}`;
  return `<div style="min-width:92px" title="${esc(tip)}">
    <div class="mono" style="font-size:10px;color:${C.muted};display:flex;justify-content:space-between;gap:8px">
      <span>${usd(L, dp)}</span><span>${usd(H, dp)}</span></div>
    <div style="position:relative;height:4px;border-radius:2px;background:${C.line};margin-top:3px">
      <span style="position:absolute;left:${(cl * 100).toFixed(1)}%;transform:translateX(-50%);top:-3px;
        width:3px;height:10px;border-radius:1px;background:${out ? C.red : col};

/* ═══ ANALYTICS (movers · benchmarks · income · vol regimes · geography · fundamentals · news) ═══ */
function regress(y, x){
  const n = Math.min(y.length, x.length); if(n < 30) return null;
  const my = y.reduce((a,b)=>a+b,0)/n, mx = x.reduce((a,b)=>a+b,0)/n;
  let sxy=0, sxx=0; for(let i=0;i<n;i++){ sxy += (x[i]-mx)*(y[i]-my); sxx += (x[i]-mx)**2; }
  const beta = sxy/sxx, alpha = my - beta*mx;
  const ex = y.map((v,i) => v - x[i]), me = ex.reduce((a,b)=>a+b,0)/n;
  const te = Math.sqrt(ex.reduce((a,b)=>a+(b-me)**2,0)/(n-1)) * Math.sqrt(252);
  const res = y.map((v,i) => v - alpha - beta*x[i]), sr = Math.sqrt(res.reduce((a,b)=>a+b*b,0)/(n-2));
  return {beta, alpha_ann: alpha*252, t_alpha: alpha/(sr/Math.sqrt(n)), te, ir: te ? me*252/te : null,
          cum: y.reduce((a,v)=>a*(1+v),1)-1, bench_cum: x.reduce((a,v)=>a*(1+v),1)-1};
}
/* book-level valuation duration: how much of what we own is terminal value */
const VDUR_H4 = "margin:14px 0 7px;font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)";
// The book's MEASURED rate profile (ic_rate_beta), position-value weighted like the rest of this card:
// the question is how much of OUR money behaves like long duration, not how many names do.
function bookRateBeta(){
  const R = LIVE.rbeta || {};
  const rows = D.holdings.map(h => ({h, b: R[h.tk]})).filter(x => x.b && x.b.rate_beta != null && (x.h.value || 0) > 0);
  if(!rows.length) return "";
  const wsum = rows.reduce((a, x) => a + x.h.value, 0), total = D.holdings.reduce((a, h) => a + (h.value || 0), 0);
  const book = rows.reduce((a, x) => a + x.h.value * (+x.b.rate_beta), 0) / wsum;
  // The universe is the STOCKS on the decision grid. Until 2026-10-16 ic_rate_beta ALSO carried 23 factor
  // and sector ETFs (478 series, 455 stocks), which dragged this median toward the rate-sensitive
  // sectors; rate_beta.py now ranks the 411 core companies only and site_rate_beta holds no ETF. The
  // filter stays as a guard: an ETF reintroduced upstream would silently shift a median again.
  // Without the stock list there is no honest median, so it reads "—" rather than a polluted number.
  const names = LIVE.matrix ? new Set(LIVE.matrix.map(m => m.ticker)) : null;
  const uni = names ? Object.values(R).filter(b => b.rate_beta != null && names.has(b.ticker)) : [];
  const sorted = uni.map(b => +b.rate_beta).sort((a, b) => a - b);
  const med = sorted.length ? qtile(sorted, .5) : null;
  const share = k => rows.filter(x => x.b.duration_bucket === k).reduce((a, x) => a + x.h.value, 0) / wsum;
  const uShare = k => uni.length ? uni.filter(b => b.duration_bucket === k).length / uni.length : null;
  const kv = (label, val, sub) => `<div class="kv"><span class="muted">${label}</span><b>${val}</b>${sub ? `<small class="muted" style="font-size:11.5px">${sub}</small>` : ""}</div>`;
  const bucket = (label, k) => kv(label, pct(share(k), 0, false),
    "of book value" + (uShare(k) == null ? "" : ` · ${pct(uShare(k), 0, false)} of universe names`));
  const side = arr => tbl(["Holding", "Rate beta", "t", "Weight"], arr.map(x => [`<b>${esc(x.h.tk)}</b>`,
    signedNum(+x.b.rate_beta), x.b.rate_beta_t == null ? "—" : signedNum(+x.b.rate_beta_t, 1), pct(x.h.weight, 1, false)]));
  const byBeta = rows.slice().sort((a, b) => +b.b.rate_beta - +a.b.rate_beta), k = Math.min(5, Math.floor(rows.length / 2));
  const spread = sorted.length ? ` Unlike the DCF split above, this separates companies: the middle 90% of stocks run from ${signedNum(qtile(sorted, .05))} to ${signedNum(qtile(sorted, .95))}.` : "";
  return `<h4 style="${VDUR_H4}">Measured rate sensitivity</h4>
    <div class="kvs">
      ${kv("Book rate beta", signedNum(book), `value-weighted · ${rows.length} of ${D.holdings.length} holdings, ${pct(wsum / total, 0, false)} of value`)}
      ${kv("Universe median", med == null ? "—" : signedNum(med), sorted.length ? `${sorted.length} stocks, equal-weighted` : "stock list not loaded")}
      ${kv("Book vs median", med == null ? "—" : signedNum(book - med), med == null ? "" : (book - med > 0 ? "longer duration than the typical stock" : "shorter duration than the typical stock"))}
    </div>
    <div class="kvs" style="margin-top:8px">
      ${bucket("Long duration", "LONG_DURATION")}${bucket("Short duration", "SHORT_DURATION")}${bucket("Neutral", "NEUTRAL")}
    </div>
    ${k ? `<div class="grid g2" style="margin-top:12px">
      <div><div class="caps" style="margin-bottom:6px">Longest duration · highest rate beta</div>${side(byBeta.slice(0, k))}</div>
      <div><div class="caps" style="margin-bottom:6px">Shortest duration · lowest rate beta</div>${side(byBeta.slice(-k).reverse())}</div>
    </div>` : ""}
    <div class="note" style="margin-top:10px">Measured, not modelled: each stock's daily return regressed on SPY and TLT over the last
      ${rows[0].b.window_sessions || 252} sessions, so the rate coefficient is the part of its move that tracks long Treasuries once the
      market move is removed. Positive = rallies when long yields fall (long duration); negative = rallies when they rise (short
      duration). A t-stat inside ±2 is labelled neutral whatever the point estimate. The book figure is the position-value-weighted
      average of the holdings' betas. The two lists are ordered by signed beta, so the second is the most negative, not the smallest
      in magnitude.${spread}</div>`;
}
function vdurCard(){
  const V = (typeof LIVE !== "undefined" && LIVE.vdur) || {};
  const rows = D.holdings.map(h => ({h, v: V[h.tk]})).filter(x => x.v && x.v.implied_fcf_cagr != null);
  const rb = bookRateBeta();
  if(!rows.length) return rb ? card("Valuation duration", "rate sensitivity only · no holding is in the current DCF set", rb) : "";
  // Weight by position value, not equally: the question is what share of OUR money sits in terminal
  // value. Names without a computable floor are excluded and counted (negative trailing FCF, no EV, a non-USD
  // reporter, ...: each name's reason is in ic_valuation_duration_skips, shown in its drawer).
  const wsum = rows.reduce((a,x) => a + (x.h.value||0), 0);
  const floorW = rows.reduce((a,x) => a + (x.h.value||0) * (+x.v.bond_floor_share), 0) / wsum;
  const covered = wsum / D.holdings.reduce((a,h) => a + (h.value||0), 0);
  const demanding = rows.slice().sort((a,b) => +b.v.implied_fcf_cagr - +a.v.implied_fcf_cagr).slice(0,8);
  const shockW = rows.reduce((a,x) => a + (x.h.value||0) * (+x.v.shock_100bp || 0), 0) / wsum;
  const a0 = rows[0].v;
  return card("Valuation duration",
    `${rows.length} of ${D.holdings.length} holdings · ${pct(covered,0,false)} of book value`,
    `<div class="kvs">
      <div class="kv"><span class="muted">Value in the visible horizon</span><b>${pct(floorW,1,false)}</b></div>
      <div class="kv"><span class="muted">Value that is terminal</span><b>${pct(1-floorW,1,false)}</b></div>
      <div class="kv"><span class="muted">Book value at +100bp</span><b class="neg">${pct(shockW,1)}</b></div>
      <div class="kv"><span class="muted">Discount rate used</span><b>${pct(+a0.discount_rate,2,false)}</b></div>
     </div>
     <h4 style="margin:14px 0 7px;font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)">Most demanding prices</h4>
     ${tbl(["Holding","Implied FCF growth","vs consensus","At +100bp"], demanding.map(x => [
        `<b>${esc(x.h.tk)}</b>`,
        `<span style="color:${+x.v.implied_fcf_cagr >= 1 ? C.red : +x.v.implied_fcf_cagr >= .5 ? C.amber : C.text}">${pct(+x.v.implied_fcf_cagr,0)}</span>`,
        x.v.value_gap == null ? "—" : `<span class="${+x.v.value_gap > 0 ? "neg" : "pos"}">${(+x.v.value_gap >= 0 ? "+" : "")}${(+x.v.value_gap*100).toFixed(0)} pts</span>`,
        pct(+x.v.shock_100bp,1)]))}
     <div class="note" style="margin-top:10px">Bond floor vs growth option (Kao). The floor is the present value of
      free cash flow inside a ${a0.assumptions ? a0.assumptions.horizon_years : 5}-year horizon, discounted at the
      10-year Treasury plus a ${pct(+a0.erp,2,false)} equity risk premium; everything beyond it is terminal value.
      <b>Implied FCF growth is what today's price requires</b> — compare it to the consensus revenue forecast, not to
      zero. The floor share itself is mostly a function of the horizon (~18% of value at 3 years, ~47% at 15), so for a
      single name it appears only beside its cross-sectional percentile (Grid, name drawer).</div>${rb}`);
}
/* ═══ REGIME DASHBOARD — how much protection, and against what ═══════════
   Two indices side by side because they answer different questions and are measured to be
   independent. Neither is a forecast and neither places a trade: MFI carries a PROTECTION BUDGET
   (what share of the book to spend on downside cover) and PFI flags a security-and-weight review.
   The honest limits of each are printed on its own card rather than kept in a journal. */
const REGIME_C = () => ({ACCELERATE:C.green, DETERIORATING:C.amber, DEFENSIVE:C.red, RECOVERY:C.accent});
// Fragility percentile -> colour. Deliberately one-directional: these scores only mean "more

async function anLoad(){

  // The rate-beta median is over the decision grid's stocks (a guard: ic_rate_beta held ETFs until
  // 2026-10-16 and no longer does); if this fetch fails the median reads "—" rather than the whole

    LIVE.benchPx = {}; rows.forEach(r => (LIVE.benchPx[r.ticker] ||= {})[r.price_date] = +r.adj_close);
  }

/* ═══ COMPOSED TABS ══════════════════════════════════════════════════════
   A section is just another view rendered into an appended div. Every one is wrapped so a single
   failing section degrades to a named message instead of taking the tab with it — the sections
   read different Supabase views and any one of them can be the thing that is missing. */
async function section(el, title, fn, right=""){
  // THE BOX IS APPENDED BEFORE fn RUNS, and fn writes into it directly. Building the HTML in a
  // detached div and copying innerHTML across looks equivalent and is not: every one of these views
  // sets innerHTML and then calls mk() to draw its charts by element id, so the chart would bind to
  // a node that never reaches the document and the card would render as an empty box. The header is
  // its own sibling element because fn overwrites whatever is in its own.
  const h = document.createElement("div"); h.innerHTML = sectionHead(title, right); el.appendChild(h);
  const box = document.createElement("div"); el.appendChild(box);
  try{ await fn(box); }
  catch(e){ box.innerHTML = `<div class="note">${esc(title)} unavailable: ${esc(e.message||e)}</div>`; }
  return box;
}
/* ═══ THE MODEL OF MODELS ════════════════════════════════════════════════
   Integrity Compounders is the EQUITY input to two client portfolios; the rest is Defensive Core
   (CSHI 30 / QDSIX 20 / BDMIX 20 / LCTIX 20 / cash 10). Every statistic here is on the DRIFTED
   book: there were no rebalances, so the weights shown are what the sleeves became, not what was

let modelSel = "Focused Compounders";

// 2025-10-13 and nothing in this system predates it, so "inception" and "the entire history" are
// the same window. The toggle exists so the page never shows a number without naming its window.
let modelPeriod = "since_inception";

const MODEL_ORDER = ["Focused Compounders","Balanced Compounders","Integrity Compounders","Defensive Core"];

                 "Integrity Compounders": C.green, "Defensive Core": C.muted};
const MSTAT = [["total_return_pct","Total","pct"],["cagr_pct","CAGR","pct"],["vol_pct","Volatility","pct"],
               ["sharpe","Sharpe","num"],["max_drawdown_pct","Max drawdown","pct"],
               ["beta_vs_spy","Beta vs SPY","num"],["alpha_ann_pct","Alpha / yr","pct"],
               ["best_month_pct","Best month","pct"],["worst_month_pct","Worst month","pct"]];
function modelsCard(){
  const M = (typeof LIVE !== "undefined" && LIVE.mstats) || {};

  if(!names.length) return card("Models", "unavailable", `<div class="note">The model engine has not
    run. ${(typeof LIVE !== "undefined" && LIVE.modelsOk === false) ? "The view did not answer — db/037 may not be applied." : ""}</div>`);
  const sel = M[modelSel] ? modelSel : names[0];
  const A = M[sel].assumptions || {};
  const pick = (n) => { const st = M[n].stats || {};
    return (st.periods && st.periods[modelPeriod]) || st; };
  const S = pick(sel);
  const fmt = (v, kind) => v == null ? "—" : kind === "pct" ? `${(+v).toFixed(2)}%` : (+v).toFixed(2);
  const seg = `<span class="seg" id="mSeg">${names.map(n =>
      `<button data-m="${esc(n)}" class="${n===sel?"on":""}">${esc(n.replace(" Compounders",""))}</button>`).join("")}</span>`;
  const pseg = `<span class="seg" id="mPer">${MPERIODS.filter(([k]) => (M[sel].stats||{}).periods?.[k]).map(([k,l]) =>
      `<button data-p="${k}" class="${k===modelPeriod?"on":""}">${esc(l)}</button>`).join("")}</span>`;
  const dc = A.defensive_core, dcd = A.defensive_core_drifted;
  return card("Models",
    `${seg} ${pseg} <span class="muted">from ${esc(S.from || A.anchor || "—")} · ${S.sessions || "—"} sessions · no rebalancing, weights drift</span>`,
    `<div class="kvs">

      <div class="kv"><span class="muted">Sharpe</span><b>${fmt(S.sharpe,"num")}</b></div>
     </div>
     <div class="chart" id="mChart"></div>
     ${tbl(["", ...names.map(n => n.replace(" Compounders",""))],
        MSTAT.map(([k,label,kind]) => [label, ...names.map(n => {
          const v = pick(n)[k];
          const hot = n === sel;
          return `<span style="${hot?`color:${MODEL_C[n]};font-weight:600`:""}">${fmt(v,kind)}</span>`; })]))}
     <div class="note" style="margin-top:10px">
      <b>Drift is real, not an approximation.</b> ${dc ? `Defensive Core was set at
      ${Object.entries(dc).map(([k,v])=>`${esc(k)} ${(v*100).toFixed(0)}%`).join(" · ")}` : ""}${dcd ? `
      and has drifted to ${Object.entries(dcd).map(([k,v])=>`${esc(k)} ${(v*100).toFixed(1)}%`).join(" · ")}` : ""}.
      There were no mass rebalances, so each sleeve compounded independently from the anchor and the
      model's daily return is value-weighted on the PREVIOUS day's values. Rebalancing monthly
      instead would be a different portfolio with a different return.
      <br><br><b>Cash earns the 13-week bill</b>, not zero — at 4-5% that is roughly 0.45% a year on
      the Defensive Core, and assuming zero would understate both models. The equity leg is the live

// The two duration L/S books as they were actually LOCKED: how many names each side they share. Read from the locked
// positions rather than written into the page, so it stays true after the next monthly lock. null if unavailable.
async function paperDurationOverlap(){
  try{
    const ids = ["ls_visible_vs_terminal", "ls_rate_duration"];
    const rows = await qAll("site_paper_positions", r => r.in("strategy", ids).order("strategy").order("rebalance_date").order("ticker"));
    const latest = {}, book = {};
    rows.forEach(r => { if(!latest[r.strategy] || r.rebalance_date > latest[r.strategy]) latest[r.strategy] = r.rebalance_date; });
    rows.forEach(r => { if(r.rebalance_date === latest[r.strategy]) (book[r.strategy] ||= {})[r.ticker] = +r.weight; });
    const a = book[ids[0]], b = book[ids[1]];
    if(!a || !b) return null;
    const o = {both_long:0, both_short:0, vis_long_rate_short:0, vis_short_rate_long:0, dates:[...new Set(ids.map(i => latest[i]))].sort()};
    Object.keys(a).forEach(t => {
      if(!(t in b)) return;
      if(a[t] > 0 && b[t] > 0) o.both_long++; else if(a[t] < 0 && b[t] < 0) o.both_short++;
      else if(a[t] > 0) o.vis_long_rate_short++; else o.vis_short_rate_long++;
    });
    return o;
  }catch(e){ return null; }
}

async function paperCard(el){
  const rows = await qAll("site_paper_nav", r => r.order("nav_date").order("strategy"));   // (nav_date, strategy) is unique: with only nav_date, ties let a page boundary drop or repeat rows
  if(!rows.length) return;
  const all = {}; rows.forEach(r => (all[r.strategy] ||= []).push(r));
  const lastDate = rows.reduce((a, r) => r.nav_date > a ? r.nav_date : a, "");
  // Anything in the data the registry does not know is shown, never silently dropped.
  const groups = PAPER_GROUPS.slice();
  const unlabelled = Object.keys(all).filter(k => !(k in PAPER_LABEL)).sort();
  unlabelled.forEach((k, i) => { PAPER_LABEL[k] = k + " (unlabelled)"; PAPER_COL[k] = PAPER_FALLBACK_COL[i % PAPER_FALLBACK_COL.length]; });
  if(unlabelled.length) groups.push({id:"other", name:"Unlabelled", refs:["spy"], keys:unlabelled});
  const avail = groups.filter(g => g.keys.some(k => all[k]));
  if(!avail.some(g => g.id === paperGroup)) paperGroup = (avail[0] || groups[0]).id;
  const overlap = avail.some(g => g.id === "duration") ? await paperDurationOverlap() : null;
  const cutoff = () => {
    if(paperRange === "ytd") return lastDate.slice(0,4) + "-01-01";
    if(paperRange === "1y"){ const d = new Date(lastDate); d.setFullYear(d.getFullYear()-1); return d.toISOString().slice(0,10); }
    return "0000-01-01";
  };
  const box = document.createElement("div"); box.style.marginTop = "16px"; el.appendChild(box);

  const draw = () => {
    const grp = avail.find(g => g.id === paperGroup);
    const view = [...grp.keys, ...grp.refs.filter(k => !grp.keys.includes(k))].filter(k => all[k]);
    // A view of young books starts at the first of them, not at the references' first day: Universe EW and SPY run from
    // January, and drawn from there the new books would sit as a few dots at the far right of an empty chart.
    const firstOf = k => all[k][0].nav_date;
    const born = ["model", "other"].includes(grp.id) ? "0000-01-01" : grp.keys.filter(k => all[k]).map(firstOf).sort()[0];
    const from = [cutoff(), born].sort().pop();
    const by = {};
    view.forEach(s => { const w = all[s].filter(r => r.nav_date >= from); if(w.length) by[s] = w; });
    const days = [...new Set(Object.values(by).flat().map(r => r.nav_date))].sort();
    const start_ = days[0], liveDays = days.filter(d => d >= PAPER_LIVE_FROM).length;
    const spyAt = d => { const r = (by.spy||[]).filter(x => x.nav_date <= d).slice(-1)[0]; return r ? +r.nav : null; };
    const rf = (D.perf && D.perf.rf_mean) || 0;
    const sharpe = ser => {
      const r = ser.map(x => x.daily_return).filter(v => v != null).map(Number);
      if(r.length < 20) return null;
      const m = r.reduce((a,b)=>a+b,0) / r.length;
      const sd = Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0) / (r.length-1));
      return sd > 0 ? (m*252 - rf) / (sd*Math.sqrt(252)) : null;
    };
    const stats = view.filter(s => by[s]).map(s => {
      const first = by[s][0], last = by[s].slice(-1)[0];
      const ret = +last.nav / +first.nav - 1;
      const s0 = spyAt(first.nav_date), s1 = spyAt(last.nav_date);
      const bench = s0 && s1 ? s1 / s0 - 1 : null;
      const sh = sharpe(by[s]);
      return [`<span title="${esc(PAPER_TIP[s] || "")}"><span style="color:${PAPER_COL[s]}">&#9679;</span> ${esc(PAPER_LABEL[s])}</span>`,
              `<span class="muted" style="font-size:11px">${first.nav_date}</span>`,
              pct(ret), s === "spy" || bench == null ? "—" : pct(ret - bench),
              sh == null ? `<span class="muted" title="needs 20 daily observations">${by[s].length}d</span>` : num(sh, 2)];
    });
    const btn = (k, label) => `<button class="lock" data-range="${k}"${paperRange===k?' style="border-color:var(--brand);color:var(--text)"':""}>${label}</button>`;
    const gbtn = g => `<button class="lock" data-group="${g.id}"${paperGroup===g.id?' style="border-color:var(--brand);color:var(--text)"':""}>${esc(g.name)}</button>`;
    const span = grp.id === "model"
      ? `since ${start_} · ${days.length} trading days · <b>proxy</b> grade to ${PAPER_REAL_FROM}, <b>model snapshots</b> to ${PAPER_LIVE_FROM}, <b>live</b> for the ${liveDays} days since`
      : `since ${start_} · ${days.length} trading day${days.length === 1 ? "" : "s"}`
          + (start_ < "2026-10-16" ? " · reconstructed before 2026-10-16" : " · forward-locked");
    const noteHtml = grp.id === "other"
      ? `<b style="color:var(--text)">${unlabelled.length} strateg${unlabelled.length === 1 ? "y has" : "ies have"} no label registered in this page</b> (${unlabelled.map(esc).join(", ")}) and
         ${unlabelled.length === 1 ? "is" : "are"} shown by key. Add ${unlabelled.length === 1 ? "it" : "them"} to PAPER_LABEL, PAPER_COL and PAPER_GROUPS in build_live.py.`
      : PAPER_NOTES[grp.id](overlap);
    box.innerHTML = card("Track record",
      `${avail.map(gbtn).join(" ")} &nbsp; ${btn("ytd","YTD")} ${btn("1y","1Y")} ${btn("all","All")} &nbsp; ${span} ·
       each series shown as cumulative % return from its first day in view`,
      `<div class="grid g-2-1"><div class="chart tall" id="paperChart"></div>${
        tbl(["Strategy","Since","Return","vs SPY (same window)","Sharpe"], stats.sort((a,b)=>parseFloat(b[2])-parseFloat(a[2])))}</div>
       <div class="muted" style="margin-top:8px">${noteHtml}</div>`);
    const series = view.filter(s => by[s]).map(s => {
      const base = +by[s][0].nav;
      return {name:PAPER_LABEL[s], type:"line", showSymbol:days.length < 3 || by[s].length < 3, symbolSize:7, connectNulls:false,
        lineStyle:{width:["grid_a_buy","actual_book"].includes(s) ? 2.4 : 1.4, color:PAPER_COL[s], type:s.startsWith("ls_") ? "dashed" : "solid"},
        itemStyle:{color:PAPER_COL[s]},
        // cumulative % return from each series' first day in view, not an index level: the

let memoIdx = 0;
function memoDates(){

}
function memoLongerTerm(notes){

function memoMorning(row){

function memoEvening(row, anchor){

    <div class="bhead"><div><div class="caps">Close note · how the day went · ${esc(row.as_of)} ${typeof writtenAt === "function" ? writtenAt(row) : ""}</div>

async function memo(el){
  const B = (typeof LIVE !== "undefined" && LIVE.briefs) || [];
  if(!B.length){
    el.innerHTML = head("Memo", "Market memo", "") +
      card("No notes yet", "", `<p class="muted">The notes are written by the scheduled jobs — pre-open,
        mid-morning for the universe, and after the close.</p>`);
    return;
  }
  const dates = memoDates();
  const draw = () => {
    memoIdx = Math.max(0, Math.min(memoIdx, dates.length - 1));
    const d = dates[memoIdx];
    const at = k => B.find(x => x.as_of === d && (x.kind || "evening") === k);
    // the close note for the anchored day may not exist yet; fall back to the most recent one
    // before it, clearly labelled with its own date rather than presented as this day's
    const ev = at("evening") || B.filter(x => (x.kind||"evening") === "evening" && x.as_of < d)[0];
    const mo = at("premarket"), un = at("universe");
    const nav = `<span class="bnav">
      <button class="bbtn" data-md="1" ${memoIdx>=dates.length-1?"disabled":""} title="Earlier">←</button>
      <span class="mono muted" style="font-size:12px">${d}</span>
      <button class="bbtn" data-md="-1" ${memoIdx<=0?"disabled":""} title="Later">→</button></span>`;
    const have = [mo && "morning", un && "universe", ev && "close"].filter(Boolean).join(" · ");
    el.innerHTML = head("Memo", "Market memo",
      `<span class="muted">${d} · ${have || "nothing written"} ${nav}</span>`) +
      memoLongerTerm([["Morning", C.accent, mo], ["Universe", C.green, un], ["Close", C.amber, ev]]) +
      memoMorning(mo) + memoUniverse(un) + memoEvening(ev, d) +
      `<div class="note" style="margin-top:14px">Three notes, each from a different point in the day:
       the morning note is what you are walking into, the universe note covers all ~453 tracked names
       rather than the book, and the close note is how the day actually went. Every figure in them is
       computed first and the model is told to add none of its own — commentary on what the model is
       showing, not advice or a forecast. Use ← → to read back through earlier days.</div>`;
    el.querySelectorAll(".bbtn[data-md]").forEach(b =>
      b.onclick = () => { memoIdx += Number(b.dataset.md); draw(); });
  };
  draw();
}

const card = (title, sub, body, extraCls="") => `<div class="card ${extraCls}"><div class="card-h"><div><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:""}</div></div>${body}</div>`;
