  },
  rsi14: {
    group: "Momentum",
    label: "RSI 14", pane: "rsi", type: "line", color: "#d4b45a", width: 1.2, on: true,
    compute: (bars, S) => S.rsi, scale: {min: 0, max: 100}, guides: [30, 70],
  },
  volume: {
    group: "Volume",
    label: "Volume", pane: "vol", type: "histogram", on: true,
    compute: (bars) => bars.map(b => b.v || 0),
  },
  // The two calibrated risk ranges. Both are bands — low and high under one toggle, because half
  // a band is not a thing anyone wants on screen. technical_v2 computes the stored version; these
  // are recomputed here from the bars on screen by the same construction.
  trade_band: {
    group: "Price",
    label: "Trade range (1w)", pane: "price", type: "line", multi: true, on: true,
    // The two edges are labelled, because the data key lists every series and two entries both
    // reading "Trade range (1w)" with different numbers is a reader's problem to solve rather
    // than an answer. A band has a low and a high and the key should say which is which.
    compute: (bars, S) => [
      {vals: S.trade.lo, color: "rgba(106,166,248,.55)", width: 1, dash: true, label: "Trade range (1w) low"},
      {vals: S.trade.hi, color: "rgba(106,166,248,.55)", width: 1, dash: true, label: "Trade range (1w) high"}],
  },
  trend_band: {
    group: "Price",
    label: "Trend range (1m)", pane: "price", type: "line", multi: true, on: false,
    compute: (bars, S) => [
      {vals: S.trend.lo, color: "rgba(240,169,74,.45)", width: 1, dash: true, label: "Trend range (1m) low"},
      {vals: S.trend.hi, color: "rgba(240,169,74,.45)", width: 1, dash: true, label: "Trend range (1m) high"}],
  },
  avwap_earn: {
    group: "Price",
    label: "Earnings VWAP", pane: "price", type: "line", color: "#d4b45a", width: 1.4,
    dash: true, on: true,
    compute: (bars, S, ctx) => earningsAvwap(bars, ctx && ctx.v2 && ctx.v2.earnings_anchor),
    basis: "anchored at the last earnings date technical_v2 recorded — absent, and the series "
         + "with it, when that name has no anchor stored.",
  },
  // ── AlphaTrend ────────────────────────────────────────────────────────────────────────────
  // A faithful JS port of scripts/technical_v2.py::alpha_trend(), which has been in the repo
  // since 883d6e9 and has never been drawn: v2 kept it "for reference" and shipped the fitted
  // track line instead. Put back on the chart 2026-11-16 at Niko's request.
  //
  // ⚠ TWO DIFFERENT THINGS CALLED MFI, AND THEY ARE NOT RELATED.
  // AlphaTrend's direction comes from the MONEY FLOW INDEX — (h+l+c)/3 × volume, split into up
  // and down flow over 14 bars. This system's MFI is the MARKET FRAGILITY INDEX
  // (scripts/market_regime.py, 0-100, five weighted legs, a protection budget). One is a
  // per-name oscillator inside this indicator; the other is a market-wide regime read. Nothing
  // below touches the fragility index, and nothing in market_regime touches this.
  //
  // ATR here is a simple rolling MEAN of true range, not Wilder smoothing — matching
  // technical_v2's atr() and the published AlphaTrend, which both use an SMA.
  alphatrend: {
    group: "Price",
    label: "AlphaTrend", pane: "price", type: "line", multi: true, on: false,
    compute: (bars) => {
      const n = 14, coeff = 1, N = bars.length;
      const H = bars.map(b=>b.h), L = bars.map(b=>b.l), Cc = bars.map(b=>b.c), V = bars.map(b=>b.v||0);
      const tr = Cc.map((_, i) => i ? Math.max(H[i]-L[i], Math.abs(H[i]-Cc[i-1]), Math.abs(L[i]-Cc[i-1]))
                                    : H[i]-L[i]);
      const a = _sma(tr, n);
      // Money Flow Index, or RSI when the series carries no volume — the same fallback
      // alpha_trend() makes, because an index has no volume and MFI would be undefined.
      const tp = bars.map(b => (b.h + b.l + b.c) / 3);
      const hasVol = V.reduce((x,y)=>x+y, 0) > 0;
      let flow;
      if(hasVol){
        const mf = tp.map((t,i) => t * V[i]);
        flow = tp.map((_, i) => { if(i < n) return null;
          let pos = 0, neg = 0;
          for(let j = i-n+1; j <= i; j++){ if(!j) continue;
            if(tp[j] > tp[j-1]) pos += mf[j]; else if(tp[j] < tp[j-1]) neg += mf[j]; }
          return neg === 0 ? 100 : 100 - 100/(1 + pos/neg); });
      } else {
        let up = 0, dn = 0;
        flow = Cc.map((v, i) => { const d = i ? v - Cc[i-1] : 0;
          up = i ? up + ((d>0?d:0) - up)/n : 0; dn = i ? dn + ((d<0?-d:0) - dn)/n : 0;
          return i < n || dn === 0 ? null : 100 - 100/(1 + up/dn); });
      }
      const at = new Array(N).fill(null);
      for(let i = 0; i < N; i++){
        if(a[i] == null || flow[i] == null) continue;
        const up = L[i] - a[i]*coeff, dn = H[i] + a[i]*coeff;
        const prev = i && at[i-1] != null ? at[i-1] : (flow[i] >= 50 ? up : dn);
        at[i] = flow[i] >= 50 ? Math.max(up, prev) : Math.min(dn, prev);
      }
      /* ⚠ THREE STATES, BECAUSE THE LINE HAS THREE — AND TWO OF THEM USED TO BE RED.
       * AlphaTrend is a RATCHET: in the flow>=50 regime it is max(up, prev), so it rises or
       * HOLDS and never falls (mirrored below 50). The old test was the binary
       * `bull = at[i] > at[i-2]`, exactly as alpha_trend() computes it — but a flat ratchet
       * fails `>` and so was drawn BEARISH. Measured over the last 420 sessions:
       *   SPY  rising 24.0%  falling  9.5%  FLAT 66.5%
       *   QQQ         21.5%          16.0%       62.5%
       *   NVDA        19.6%          18.5%       61.8%
       *   PLTR        24.7%          18.5%       56.7%
       *   ANET        18.9%          15.3%       65.8%
       * So about two-thirds of the line was painted red while the trend was simply holding,
       * which is why it read bearish most of the time and looked insensitive. The flat state is
       * not a rounding artefact — it is the ratchet doing its job between advances.
       * The engine's `bull` is UNCHANGED and still binary; this is the DISPLAY splitting a
       * state the engine collapses. alpha_trend() consumers are untouched. */
      const dir = at.map((v, i) => v == null || i < 2 || at[i-2] == null ? null
                                 : v > at[i-2] ? 1 : v < at[i-2] ? -1 : 0);
      // ONE series, a colour per bar. Three series with gaps between them is exactly what drew
      // three crossing lines: a LWC line series bridges straight across missing points, so each
      // "segment" ran the full width of the chart instead of stopping at its own state.
      // Deliberately the HEAVIEST line on the price pane (3.0 against the track line's 2.0 and
      // the moving averages' 1.2-1.4): it is the trend read, and on a pane carrying four or five
      // overlays the one you are actually reading should not be the same weight as the rest.
      const C3 = {"1": C.green, "0": C.amber, "-1": C.red};      // the theme pair, not a second one
      const A3 = {"1": "↑", "0": "→", "-1": "↓"};
      /* ⚠ UNKNOWN IS NOT FLAT. `dir` is null for the first two bars of the valid line, because
       * the direction is measured against the value two bars back and there is none yet. Those
       * bars were being painted AMBER — the colour that means "the ratchet is holding" — which
       * states a trend reading the data cannot support. The amber tally gave it away: 39
       * amber bars against 23 genuinely flat ones. The value is dropped instead, so the line
       * simply starts two bars later rather than opening with a neutral claim. */
      return [{
        vals:   at.map((v, i) => dir[i] == null ? null : v),
        colors: dir.map(d => d == null ? "#f0c04a" : C3[String(d)]),
        states: dir.map(d => d == null ? "" : A3[String(d)]),
        width: 3, label: "AlphaTrend",
      }];
    },
    basis: "the OPEN-SOURCE AlphaTrend (ATR bands steered by Money Flow Index ≥ 50), ported "
         + "verbatim from technical_v2.alpha_trend(). GREEN rising · AMBER flat · RED falling, "
         + "against the line two bars back: it is a RATCHET, so it holds far more often than it "
         + "moves (flat on 57-67% of bars across SPY/QQQ/NVDA/PLTR/ANET over 420 sessions) and "
         + "a flat stretch is the trend holding, NOT a reversal. technical_v2 judged it 'too choppy vs the "
         + "reference charts' and shipped the fitted track line instead — so the two WILL "
         + "disagree, and that disagreement is the honest version of the difference. Note: this "
         + "MFI is Money Flow Index, not the Market Fragility Index.",
  },
  sma20: {
    label: "SMA 20", pane: "price", type: "line", color: "#9aa4b2", width: 1, on: false,
    group: "Price", compute: (bars) => _sma(bars.map(b=>b.c), 20), basis: _ON_SCREEN,
  },
  ema35: {
    label: "EMA 35", pane: "price", type: "line", color: "#d4b45a", width: 1.3, on: false,
    group: "Price",
    // The briefing chart's trend anchor (trade_briefing.py draws it in gold) — same line here so
    // the DOCX an advisor reads and the screen agree on what the anchor is.
    compute: (bars) => _ema(bars.map(b=>b.c), 35), basis: _ON_SCREEN,
  },
  bb20: {
    label: "Bollinger 20", pane: "price", type: "line", multi: true, on: false, group: "Volatility",
    compute: (bars) => { const c = bars.map(b=>b.c), m = _sma(c,20), sd = _std(c,20);
      return [{vals: m.map((v,i)=> v==null?null:v+2*sd[i]), color:"rgba(167,139,250,.5)", width:1, dash:true},
              {vals: m, color:"rgba(167,139,250,.35)", width:1},
              {vals: m.map((v,i)=> v==null?null:v-2*sd[i]), color:"rgba(167,139,250,.5)", width:1, dash:true}]; },
    basis: _ON_SCREEN + " technical_engine stores bb_width = 4σ/mid rather than the bands.",
  },
  macd: {
    label: "MACD 12/26/9", pane: "macd", type: "line", multi: true, on: false, group: "Momentum",
    compute: (bars) => { const c = bars.map(b=>b.c);
      const line = _ema(c,12).map((v,i)=> v - _ema(c,26)[i]);
      const sig = _ema(line, 9);
      return [{vals: line, color:"#6aa6f8", width:1.3},
              {vals: sig,  color:"#f0a94a", width:1.1},
              {vals: line.map((v,i)=> v - sig[i]), color:"rgba(139,149,161,.5)", width:1}]; },
    basis: _ON_SCREEN,
  },
  roc63: {
    label: "ROC 63", pane: "roc", type: "line", color: "#3fcf8e", width: 1.2, on: false,
    group: "Momentum", guides: [0],
    compute: (bars) => _roc(bars.map(b=>b.c), 63), basis: _ON_SCREEN,
  },
  atrpct: {
    label: "ATR %", pane: "atr", type: "line", color: "#ef6464", width: 1.1, on: false,
    group: "Volatility",
    compute: (bars) => { const n = bars.length, tr = [];
      for(let i=0;i<n;i++){ const b = bars[i];
        tr.push(i ? Math.max(b.h-b.l, Math.abs(b.h-bars[i-1].c), Math.abs(b.l-bars[i-1].c)) : b.h-b.l); }
      const a = _sma(tr, 14);
      return a.map((v,i)=> v==null?null: v/bars[i].c); },
    basis: _ON_SCREEN,
  },
  hv20: {
    label: "HV 20", pane: "atr", type: "line", color: "#a78bfa", width: 1.1, on: false,
    group: "Volatility",
    compute: (bars) => { const c = bars.map(b=>b.c);
      const r = c.map((v,i)=> i? Math.log(v/c[i-1]) : null);
      // annualised on the BAR's own frequency — 252 daily, 126 two-day, 52 weekly. Annualising a
      // weekly series by sqrt(252) would overstate it by more than two times.
      const per = bars[0] && bars[0].n >= 5 ? 52 : bars[0] && bars[0].n === 2 ? 126 : 252;
      return _std(r.map(v=>v==null?0:v), 20).map((v,i)=> i<20||v==null?null: v*Math.sqrt(per)); },
    basis: _ON_SCREEN + " Annualised on the bar's own frequency (252 / 126 / 52).",
  },
  obv: {
    label: "OBV slope", pane: "obv", type: "line", color: "#6aa6f8", width: 1.2, on: false,
    group: "Volume", guides: [0],
    compute: (bars) => { const c = bars.map(b=>b.c), v = bars.map(b=>b.v||0);
      let o = 0; const ob = c.map((x,i)=> { if(i) o += Math.sign(x - c[i-1]) * v[i]; return o; });
      const va = _sma(v, 50);
      return ob.map((x,i)=> i<20 || !va[i] ? null : (x - ob[i-20]) / (va[i]*20)); },
    basis: _ON_SCREEN,
  },
  // ── the two fragility indices ─────────────────────────────────────────────────────────────
  // Both are SERVER-SOURCED and both are 0-100, so they share one pane: MFI against PFI is a

 *

 * books first locked 2026-11-20, the actual book, the proposal, SPY, the equal-weight universe and

 * they are locked and marked again, and are drawn on Evidence (paper.js). They are still not offered
 * as overlays here. The cut map below names them, so one that is ever offered is drawn with its
 * reconstructed span marked.
 * What follows describes the record as it stood with 39 books marked daily off monthly locks. Drawn here so a book's track can sit under the name you are looking
 * at, which is the comparison the Analytics tab cannot make.
 *
 * ⚠⚠ MOST OF THIS RECORD IS RECONSTRUCTED, AND THE CHART SAYS SO IN THE LINE ITSELF.
 * CLAUDE.md's paper-tracking entry: "Nothing is backfilled from these sources — NO LONGER TRUE
 * as of 2026-10-17". Four scripts rebuilt 33 of the 39 books BACKWARDS from point-in-time
 * sources, and an adversarial review on 2026-10-20 rated most of that DO-NOT-USE. A single
 * continuous line from 2024 to today would present eight months of replica alongside one month
 * of record as one object — the same defect as a substituted neutral that no basis column
 * distinguishes from a measured one.
 *
 * So each book draws as up to TWO series, same colour: the reconstructed span DASHED, the
 * forward record SOLID, split at that book's own live-lock date. A book with nothing
 * reconstructed draws one solid line. The split is not cosmetic — it is where the evidence
 * changes kind.

 * THE CUT DATES ARE READ, NOT GUESSED. Each is the backfill script's own constant:
 *   paper_backfill.LIVE_START       = 2026-09-15  → the 13 RULES books + the 2 LONG_SHORT books
 *   paper_duration_backfill.LIVE_FROM              → value_implied_growth 10-08, the other 5 10-16
 *   paper_factor_backfill.LIVE_START = 2026-10-16  → all 12 fac_/ls_fac_ books
 * Verified against the data on 2026-11-16: 39 strategies, 33 with a declared cut, 0 declared
 * but absent, and the 6 with no cut are exactly the books CLAUDE.md names as never backfilled.
 * Inferring the cut from a book's first NAV date would be the "do not infer the loaded screen"
 * error again: `fac_lowvol` begins 2026-06-08 and `quad_q1` 2026-06-25, and neither date has
 * anything to do with when its record stopped being a replica.                                */

/* ⚠ ONE REBASE ANCHOR FOR EVERY DRAWN SERIES, AND IT IS THE LATEST START AMONG THEM.
 * A NAV is base-100 at the book's own inception, so plotting two books unrebased compares two
 * different origins; rebasing each to 100 at its OWN first visible bar is worse still, because
 * both lines then leave 100 on different dates and the reader compares levels that share no
 * basis. So: find the first bar on which EVERY series switched on has a value, rebase all of
 * them there, and draw nothing before it.
 * The cost is deliberate and visible — switching on `val_brake_kept` (7 observations, first
 * 2026-11-05) truncates the comparison to that week for everything else too. That is the
 * truth about the evidence, and a visibly short chart is the honest failure mode where a
 * long chart off mismatched origins is the silent one. The anchor date is printed in the
 * caption so it is never implicit.                                                          */
function paperAnchor(bars, ctx){
  const rows = ctx.srv("site_paper_nav");
  if(!rows || !rows.length) return -1;
  let anchor = -1;
  for(const [key] of PAPER_SHOWN){
    if(!LWCP.on[`paper_${key}`]) continue;
    const vals = alignServer(bars, rows, "nav_date", "nav", r => r.strategy === key);
    if(!vals) return -1;
    const i = vals.findIndex(v => v != null);
    if(i < 0) return -1;
    if(i > anchor) anchor = i;
  }
  // The name's own price is rebased on the same anchor, but it must not SET it: a price series
  // covers the whole window, so it would always lose the max and never move the anchor anyway.
  return anchor;
}

function paperSeries(bars, ctx, key, color, width, label){
  const rows = ctx.srv("site_paper_nav");
  const vals = alignServer(bars, rows, "nav_date", "nav", r => r.strategy === key);
  if(!vals) return null;
  const a = paperAnchor(bars, ctx);
  if(a < 0 || vals[a] == null || !+vals[a]) return null;
  const base = +vals[a];
  const reb = vals.map((v, i) => (i < a || v == null) ? null : 100 * v / base);

  const cut = PAPER_RECON_FROM[key] || null;
  if(!cut) return [{vals: reb, color, width, label}];
  // Split at the cut. The dashed span KEEPS the first clean point so the two segments meet --
  // otherwise there is a one-bar gap exactly at the join, which reads as missing data.
  const iCut = bars.findIndex(b => b.d >= cut);
  if(iCut < 0) return [{vals: reb, color, width, dash: true,
                        label: `${label} (reconstructed)`}];      // all of it is replica
  if(iCut <= a) return [{vals: reb, color, width, label}];          // anchor is past the cut
  // The labels are set HERE, where the split actually means reconstruction, rather than being
  // inferred downstream from the line being dashed — other entries dash lines for other reasons.
  return [
    {vals: reb.map((v, i) => i <= iCut ? v : null), color, width, dash: true,
     label: `${label} (reconstructed)`},
    {vals: reb.map((v, i) => i >= iCut ? v : null), color, width, label},
  ];
}

/* ═══ THE MODEL'S OWN VERDICT, OVER TIME — grade and quadrant ════════════════════════════════
 *
 * The grid says what the model calls a name TODAY. These two say what it has been calling it,
 * against the price, which is the comparison the grid cannot make: a downgrade three weeks
 * before a breakdown and a downgrade three weeks after it are different facts about the model.
 *
 * SERVER-SOURCED AND PER NAME (`site_decision_history`, db/070). `site_decision_matrix` clamps
 * to `as_of = max(as_of)` because it backs a decision grid, so the history needed its own view.
 * It is fetched for the ticker on screen and cached under that ticker — see INDICATORS_PERNAME.
 *
 * ⚠ PLOTTED 4 = BEST, AND THE LEGEND PRINTS THE LABEL, NOT THE NUMBER. Both are categorical, so
 * they are mapped onto one 1-4 axis (A/Q1 at 4, D/Q4 at 1) and share a pane: "what does the
 * model think of this name" is one question with two answers, and putting them on one axis lets
 * a reader see the grid and the quad agree or disagree at a glance. The axis therefore reads
 * 1-4 with no units — `fmtVal` puts "A" and "Q1" in the data key so the encoding never reaches
 * the reader, and the integer is an implementation detail of drawing a category as a line.
 *
 * ⚠ STEP LINES, NOT SLOPES. A grade holds until it changes. Drawing a slope from B to C across
 * three weeks shows a transition that never happened — the name was B, and then it was C.
 *
 * ⚠ GAPS ARE REAL. 2,960 of 20,541 rows carry a NULL quadrant: a name whose EPS axis is
 * undefined (negative trailing EPS, §13.4) HAS no quadrant. alignServer passes the null through
 * and the line breaks. Carrying the previous quadrant across that span would assert a
 * classification the model explicitly declined to make.
 *
 * ⚠ AND THE HISTORY IS SHORT AND MOSTLY FLAT: 45 snapshots, 2026-09-15 to 2026-11-14. On a 1Y
 * or Max window these are a stub at the right edge, and 425 of 466 names never changed grade
 * over it (394 never changed quadrant). A flat line here is the finding, not a failure to draw.
 * They are absent, never zero, outside the observed window — the series simply stops.
 *
 * ⚠ NOT ON THE MARKETS TAB, BY CONSTRUCTION. SPY and the other index ETFs are not rows in
 * `companies`, so they have no decision row, the query returns nothing and the indicator does
 * not draw. The model scores businesses; an index fund is not one.
 */
const GRADE_LVL = {A: 4, B: 3, C: 2, D: 1};
const QUAD_LVL  = {Q1: 4, Q2: 3, Q3: 2, Q4: 1};          // EV rank: Q1 best (§ QUAD FRAMEWORK)
const _lvlName  = (m) => (v) => Object.keys(m).find(k => m[k] === v) || "—";

INDICATORS.grade_hist = {
  group: "Signals",
  label: "Grade", pane: "model", type: "line", color: "#6aa6f8", width: 2, on: false, step: true,
  source: "server", view: "site_decision_history",
  fmtVal: _lvlName(GRADE_LVL),
  compute: (bars, S, ctx) => alignServer(bars, ctx.srv("site_decision_history"),
                                         "as_of", "_grade_lvl"),
  basis: "the decision grid's own grade for THIS name on each date it was computed, from "
       + "ic_decision_matrix via site_decision_history (db/070). Plotted A=4 B=3 C=2 D=1 so "
       + "best is at the top and it shares an axis with the quadrant; the key prints the letter, "
       + "not the number. A STEP line, because a grade holds until it changes. ⚠ The record "
       + "starts 2026-09-15 (45 snapshots) and the line simply stops before that rather than "
       + "being carried back — and 425 of 466 names never changed grade in that window, so a "
       + "flat line is the reading rather than a missing one. ⚠ THE RULER CHANGED ON 2026-11-18: "
       + "from that date the grade is a percentile rank of QGS + buybacks with the pillar floors "
       + "as vetoes (V13); before it, the V12.2 gates. A step on that date is the method, not the "
       + "company — the view carries `method` and the V12.2 grade beside it (grade_v12).",
};

INDICATORS.quad_hist = {
  group: "Signals",
  label: "Quadrant", pane: "model", type: "line", color: "#f0a94a", width: 2, on: false, step: true,
  source: "server", view: "site_decision_history",
  fmtVal: _lvlName(QUAD_LVL),
  compute: (bars, S, ctx) => alignServer(bars, ctx.srv("site_decision_history"),
                                         "as_of", "_quad_lvl"),
  basis: "the quadrant for THIS name on each date, from the same view as Grade. Plotted with Q1 "
       + "at the top (Q1 = 4 … Q4 = 1); the key prints Q1-Q4. ⚠ THE RULER CHANGED ON 2026-11-18: "
       + "from that date the box is gross-profit growth of the latest quarter vs the universe "
       + "median × operating margin vs a year ago (V13); before it, forward minus trailing "
       + "growth, revenue × EPS (V12.2, where Q4 was the worst box). The two agree on a name about "
       + "as often as chance, so a step on that date is the method, not the company. Under V13 "
       + "only Q1 is evidenced as better than the rest; the order of Q2-Q4 on this axis is a "
       + "plotting convention. ⚠ A BREAK IN THE LINE IS REAL: a name with no quad on a date is "
       + "left as a gap, never carried.",
};

/* alignServer reads a numeric column, and these two arrive as 'A' and 'Q1'. Decoding them here,
 * once, when the rows land — rather than inside each compute() — keeps the mapping in one place
 * and means an UNRECOGNISED code becomes null (absent, a gap) instead of NaN, which Postgres and
 * every comparison downstream would happily accept as a populated value. */
function decodeDecisionRows(rows){
  for(const r of rows || []){
    if(r._grade_lvl === undefined) r._grade_lvl = GRADE_LVL[r.grade] ?? null;
    if(r._quad_lvl  === undefined) r._quad_lvl  = QUAD_LVL[r.quadrant] ?? null;
  }
  return rows;
}

/* ═══ GASBRAKESGAS — a trend state on the price bars, and its oscillator ═══════════════════════
 *
 * Two toggles, off by default. Niko, 2026-11-20: the indicator from his other desk, on every
 * chart here. The rules are in engines/gasbrakesgas.py and the guide they were ported from is
 * research/gasbrakesgas-implementation-guide.md.
 *
 * ⚠ SERVER-SOURCED ON PURPOSE, UNLIKE EVERY OTHER OVERLAY IN THIS FILE. It is a FITTED
 * APPROXIMATION of a proprietary third-party indicator, and this file ships in a PUBLIC
 * repository. Computing it here would publish the fitted parameter set. scripts/gasbrakesgas.py
 * computes it nightly, ic_gasbrakesgas stores it, and this file only reads the results through
 * site_gasbrakesgas (db/081) and decides how to draw them. Nothing below is the formula.
 *
 * ⚠ THE NAME. It is GasBrakesGas, with Gas, Neutral and Brakes. It is never labelled with the
 * name of the indicator it approximates — on the chip, in the key, or in the caption.
 *
 * ⚠ DISPLAY ONLY. It feeds no grade, action, grid, proposal or brake, and it has never been
 * tested against returns, here or where it came from. The caption says so.
 *
 * WHAT A BAR CAN BE:
 *   a shade      2 Gas strong · 1 Gas weak · 0 Neutral · -1 Brakes weak · -2 Brakes strong
 *   no reading   grey. The bar still forming (states exist for FINISHED bars only), a bar before
 *                the name's 110th, a bar newer than last night's run, and every bar on the
 *                monthly interval, which the engine does not compute. Grey is "not measured",
 *                and it is drawn rather than left in the ordinary green or red because an
 *                unpainted up-day candle beside painted ones would read as a state.
 *
 * MATCHED ON THE BAR'S LAST SESSION. The engine dates a weekly or two-day bar by its last
 * session; aggBars() draws a bucket at its first and carries the last as `e`. The run list is
 * filled forward only INSIDE itself — never before its first entry and never past `bar_date`.
 *
 * COLOURS (Niko, 2026-11-20): GREEN is Gas, RED is Brakes, YELLOW is Neutral, the lighter shade
 * the weaker trend. The first version used blue and purple because the candles already use green
 * and red for up and down days. That worry does not apply while the painter is on: EVERY bar is
 * then a state colour or grey, so no ordinary up-day green is left on the chart to be mistaken
 * for Gas. What is given up is the up/down day itself, which the O/H/L/C line in the key still
 * carries.
 *
 * TAGS AND ICONS ON THE PRICE BARS, the way the indicator this approximates draws them:
 *   a TAG    a word on the bar where the STATE changes — Gas, Brakes or Neutral. A change of
 *            strength inside a state is not a flip (the guide, section 9) and gets no tag, and
 *            the first reading in a name's history gets none: there is no state before it to
 *            have flipped from.
 *   an ICON  the four marks. A DOT is the trend resuming: green under the bar in Gas, red over
 *            it in Brakes. An ARROW is the move against the trend fading: red, pointing down,
 *            over a Gas bar coming off an overbought reading; green, pointing up, under a Brakes
 *            bar coming off an oversold one. They are defined on the oscillator and were first
 *            drawn there; on the price bars is where a reader looks for them.              */
/* ⚠ SUPERSEDED IN PART, SAME DAY (Niko's recording of the other desk's chart, 2026-11-20). What
 * is drawn now, and it is ONE toggle:
 *   - candles in the state's colour, strong shades bright and weak shades dimmed;
 *   - a RIBBON of the same colours along the top of the price pane, which is where the sequence
 *     is read once a candle is two pixels wide;
 *   - a LETTER on each bar the state changes: G below the bar, B above it, N on the side it came
 *     from (below when it left Gas, above when it left Brakes). Letters, not words: a word needs
 *     45px and a choppy name flips several times a week, so the words either overlapped or were
 *     thinned away; a letter needs 16;
 *   - the oscillator in its own pane: a line from −6 to +6 filled bar by bar down to zero, BLUE
 *     where volume was heavy and TEAL where it was light, over zones shaded two points deep;
 *     the GBG Squeeze as amber bars climbing a point for each bar the oscillator rests at zero,
 *     to six; and an ARROW on the zero line at the bar the squeeze ends, up or down;
 *   - the standard volume strip hidden while it is on (`hides`), its chip saying so.
 * The four continuation / correction icons that the second pass put on the price bars are gone:
 * they are not on the other desk's chart, and beside the letters they were noise. The oscillator's
 * key still names one on the bar it falls on. */
const GBG_COL  = {"2": C.green, "1": "#2c7a59", "0": "#f2d14b", "-1": "#8c3a3a", "-2": C.red};
// For TEXT on a dark page the dimmed weak shades are too dark to read, so words use these.
const GBG_TXT  = {"2": C.green, "1": "#7fd6b0", "0": "#f2d14b", "-1": "#f1a3a3", "-2": C.red};
const GBG_NONE = "#5b6472";
const GBG_NAME = {"2": "Gas · strong", "1": "Gas · weak", "0": "Neutral",
                  "-1": "Brakes · weak", "-2": "Brakes · strong"};
const GBG_MARK = {gas_continuation: {text: "Gas resumes"}, gas_correction: {text: "Gas off its high"},
                  brakes_continuation: {text: "Brakes resume"}, brakes_correction: {text: "Brakes off its low"}};
const GBG_TF = {D: "daily", "2D": "two-day", W: "weekly", M: "monthly"};
const _gbgWords = (state, strength) => state[0].toUpperCase() + state.slice(1) + (strength ? ", " + strength : "");
// The stored row for the interval on screen, or null. The engine computes D, 2D and W, and only
// for a name with 110 finished bars on that interval.
// ⚠ NO ROW IS DRAWN AS "NO READING", NOT AS NOTHING. With the toggle on and no row (the monthly
// interval, a name too young for weekly bars, a fetch that returned nothing) the trend paints
// every bar grey and the oscillator keeps an empty pane. Declining instead would leave ordinary
// green and red candles under a switched-on chip, which reads as a broken toggle or, worse, as
// a chart that has been checked and found unremarkable.
const _gbgRow = (ctx) => (ctx.srv("site_gasbrakesgas") || []).find(r => r.timeframe === LWCP.iv) || null;
// Where each GBG Squeeze in the stored tail ENDED: the first bar the oscillator left zero after
// resting there. [{date, up, size}], oldest first. From the tail, not the bars on screen, so the
// summary can name the last one even when it is left of the view.
function _gbgSqueezeExits(t){
  const out = [];
  for(let i = 1; i < (t.d || []).length; i++)
    if(t.q[i - 1] >= 1 && t.o[i] != null && t.o[i] !== 0) out.push({date: t.d[i], up: t.o[i] > 0, size: t.q[i - 1]});
  return out;
}

INDICATORS.gbg_trend = {
  group: "GasBrakesGas",
  label: "GasBrakesGas · trend state", short: "GasBrakesGas", pane: "price", type: "line", on: false, paints: "bars",
  source: "server", view: "site_gasbrakesgas",
  with: ["gbg_osc"], hides: ["volume"],
  fmtVal: v => GBG_NAME[String(v)] || "—",
  compute: (bars, S, ctx) => {
    const r = _gbgRow(ctx), blank = bars.map(() => null);
    if(!r || !Array.isArray(r.runs) || !r.runs.length)
      return {vals: blank, colors: blank, ribbon: blank, none: GBG_NONE,
              chip: LWCP.iv === "M" ? "no reading on monthly bars" : "no reading: under 110 finished bars",
              summary: `GasBrakesGas has no reading on ${GBG_TF[LWCP.iv]} bars for this name`
                     + (LWCP.iv === "M" ? ": it is computed on daily, two-day and weekly bars only." : ": it needs 110 finished bars.")};
    const runs = r.runs, first = runs[0][0], last = r.bar_date;
    let j = 0, cur = null;
    const shade = bars.map(b => { const e = b.e || b.d;
      while(j < runs.length && runs[j][0] <= e){ cur = runs[j][1]; j++; }
      return (e < first || e > last) ? null : cur; });
    // Letters, from the STORED run list rather than from the bars on screen, so a letter sits on
    // the bar the state changed on even when the bar before it is outside the loaded window.
    const at = new Map(bars.map((b, i) => [b.e || b.d, i]));
    const marks = [];
    for(let k = 1; k < runs.length; k++){
      const was = Math.sign(runs[k - 1][1]), now = Math.sign(runs[k][1]), i = at.get(runs[k][0]);
      if(was === now || i === undefined) continue;          // a change of strength is not a change of state
      marks.push(now > 0 ? {i, tag: true, above: false, color: GBG_COL["2"], text: "G"}
               : now < 0 ? {i, tag: true, above: true,  color: GBG_COL["-2"], text: "B"}
               :           {i, tag: true, minor: true, above: was < 0, color: GBG_COL["0"], text: "N"});
    }
    marks.forEach(m => { m.shape = "circle"; m.size = 0; });      // the letter alone, no shape under it
    const colors = shade.map(s => s == null ? null : GBG_COL[String(s)]);
    const t = r.tail || {}, ex = _gbgSqueezeExits(t), lastEx = ex[ex.length - 1];
    const sq = r.squeeze > 0 ? `GBG Squeeze ${r.squeeze} of 6 and still building.`
      : lastEx ? `No GBG Squeeze now; the last one (${lastEx.size} of 6) ended ${lastEx.up ? "upward" : "downward"} on ${lastEx.date}.`
      : "No GBG Squeeze in the stored bars.";
    const from = r.prev_state ? `, from ${r.prev_state[0].toUpperCase() + r.prev_state.slice(1)}` : "";
    return {vals: shade, colors, ribbon: colors, none: GBG_NONE, marks, tagWidth: 16,
            markNames: ["state letter", "icon"], minorName: "Neutral",
            chip: `${_gbgWords(r.state, r.strength)} since ${r.since}`,
            summary: `GasBrakesGas, ${GBG_TF[LWCP.iv]} bars: ${_gbgWords(r.state, r.strength)} since ${r.since}${from}. `
                   + `Oscillator ${r.osc > 0 ? "+" : ""}${r.osc}. ${sq} ${marks.length} change${marks.length === 1 ? "" : "s"} of state on the bars loaded. `
                   + `Stored as of ${r.bar_date}; the bar still forming is grey.`};
  },
  basis: "candles take the state's colour: green Gas (trend up), yellow Neutral, red Brakes (trend "
       + "down), the dimmer shade the weaker trend, so a bar's colour no longer says whether the day "
       + "closed up or down. The strip along the top is the same sequence. G, N or B marks each "
       + "change of state: G below the bar, B above it, N on the side it came from. In the pane "
       + "below, the oscillator runs from −6 to +6, filled down to zero, blue where volume was heavy "
       + "and teal where it was light, over zones shaded two points deep; the amber bars are the GBG "
       + "Squeeze, climbing a point for each bar the oscillator rests at zero, to six, and an arrow "
       + "marks the bar it ends, up or down. It is a fitted approximation of a third-party trend "
       + "indicator, not that indicator: where it was built it matched the original's state on 94% "
       + "of bars and its exact shade on 81%, and on 2026-11-19 all eleven sector readings here "
       + "matched that desk's. Computed each night on finished daily, two-day and weekly bars at "
       + "split-adjusted prices, so a grey bar has no reading: the bar still forming, a name's first "
       + "109 bars, and every monthly bar. It has not been tested against returns and feeds no "
       + "grade, action or brake.",
};

/* ═══ GASBRAKESGAS AS TABLE COLUMNS — Universe and Signals (Niko, 2026-11-20, db/082) ═════════
 * "I want to be able to see in the columns in the universe and sort based on GasBrakesGas signal
 * and current status. Same applies to Signals tab." Three columns, the same three in both tables,
 * drawn and sorted by the functions below so the two tables cannot disagree:
 *   GBG          the daily state now            sorted Gas·strong → Brakes·strong
 *   GBG weekly   the weekly state now           same order
 *   GBG flip     how many finished daily bars the state has lasted — the SIGNAL. 1 is a flip on
 *                the newest bar, so ascending puts the newest flips first.
 * LIVE.gbg is {ticker: {D, 2D, W}} from site_gasbrakesgas_status: the stored rows without their
 * history, because a table of 500 names must not fetch 5 MB of run lists to print one word each.
 *
 * ⚠ THREE DIFFERENT BLANKS, AND THE CELL SAYS WHICH. No row for the name (fewer than 110 finished
 * bars on that timeframe — 72 names have no weekly reading); the rows did not load ("?", never a
 * dash, because a dash reads as "checked, nothing there"); a row that has stopped updating (shown,
 * muted, with its date).
 * ⚠ STILL DISPLAY ONLY. A column a reader sorts by decides nothing, and every tooltip says it has
 * not been tested against returns.                                                            */
const GBG_ORD = {"Gas · strong": 0, "Gas · weak": 1, "Neutral": 2, "Brakes · weak": 3, "Brakes · strong": 4};
const _gbgRowOf = (tk, tf) => ((typeof LIVE !== "undefined" && LIVE.gbg || {})[tk] || {})[tf] || null;
function gbgLabel(tk, tf){ const r = _gbgRowOf(tk, tf); return r ? (GBG_NAME[String(r.shade)] || "") : ""; }
function gbgSortKey(tk, tf){ const r = _gbgRowOf(tk, tf); return r ? (GBG_ORD[GBG_NAME[String(r.shade)]] ?? null) : null; }
function gbgBars(tk){ const r = _gbgRowOf(tk, "D"); return r && r.bars_in_state != null ? +r.bars_in_state : null; }
const _gbgSigned = v => v == null ? "—" : (v > 0 ? "+" : "") + v;
function _gbgMissing(tf){
  if(typeof LIVE !== "undefined" && LIVE.gbgOk === false)
    return `<span class="amber" title="The GasBrakesGas rows did not load, so this is unknown, not empty">?</span>`;
  return `<span class="muted" title="No reading: this name has fewer than 110 finished ${tf === "W" ? "weekly" : "daily"} bars">—</span>`;
}
function gbgCell(tk, tf){
  const r = _gbgRowOf(tk, tf);
  if(!r) return _gbgMissing(tf);
  const newest = (typeof LIVE !== "undefined" && LIVE.gbgNewest || {})[tf];
  const old = newest && r.bar_date < newest && (Date.parse(newest) - Date.parse(r.bar_date)) > 8 * 864e5;
  const tip = `${tf === "W" ? "Weekly" : "Daily"} bars to ${r.bar_date} · score ${_gbgSigned(r.score)} of ±10 · `
    + `oscillator ${_gbgSigned(r.osc)}${r.squeeze ? " · squeeze " + r.squeeze : ""} · this state since ${r.since}`
    + (r.prev_state ? ` (from ${r.prev_state[0].toUpperCase() + r.prev_state.slice(1)})` : "")
    + (old ? " · THIS ROW HAS STOPPED UPDATING" : "")
    + " · shown for context: not tested against returns, and not an input to the grade or action";
  return `<span title="${esc(tip)}" style="white-space:nowrap;color:${old ? C.muted : GBG_TXT[String(r.shade)]}">`
       + `● ${esc(GBG_NAME[String(r.shade)])}${old ? ` <span class="muted" style="font-size:var(--fs-xs)">${esc(r.bar_date.slice(5))}</span>` : ""}</span>`;
}
function gbgFlipCell(tk){
  const r = _gbgRowOf(tk, "D");
  if(!r) return _gbgMissing("D");
  if(r.bars_in_state == null) return `<span class="muted" title="not computed yet">—</span>`;
  const n = +r.bars_in_state, to = r.state[0].toUpperCase() + r.state.slice(1);
  const from = r.prev_state ? r.prev_state[0].toUpperCase() + r.prev_state.slice(1) : null;
  const tip = (from ? `Turned ${to} from ${from} on ${r.since}` : `${to} since its readings begin, ${r.since}`)
    + ` · ${n} finished daily bar${n === 1 ? "" : "s"} in this state, the newest included`
    + (r.mark ? ` · on the newest bar: ${(GBG_MARK[r.mark] || {}).text || r.mark}` : "")
    + " · shown for context: not tested against returns";
  return `<span title="${esc(tip)}" style="white-space:nowrap">`
       + (n === 1 ? `<b style="color:${GBG_TXT[String(Math.sign(r.shade) * 2)]}">new</b>` : `<span class="mono">${n}</span>`)
       + (from ? ` <span class="muted" style="font-size:var(--fs-xs)">from ${esc(from)}</span>` : "")
       + (r.mark ? ` <span class="muted" style="font-size:var(--fs-xs)" title="${esc((GBG_MARK[r.mark] || {}).text || "")}">◆</span>` : "") + `</span>`;
}
/* ═══ technical chart — TradingView Lightweight Charts ════════════════════════════════════════
 *
 * Replaces the echarts close-line chart. LWC is Apache-2.0 and is the ONLY TradingView product
 * this site can use: Advanced Charts' free licence forbids hosting the library in a public code
 * repository (ic-site is public, because Pages on a private repo is a paid plan) and limits free
 * use to public web projects, which an auth-gated book is not. Neither restriction applies here.
 *
 * ATTRIBUTION IS A LICENCE CONDITION, not decoration: `attributionLogo` stays on, and the NOTICE
 * line lives in the About tab. Do not turn either off.
 *
 * WHAT MOVED AND WHAT DID NOT. Every overlay is still computed in the browser by techSeries() in
 * indicators.js — untouched by this migration, because it was always pure `bars → series` and
 * never knew which renderer consumed it. What changed is the drawing: real candles instead of a
 * close line, volume, panes, and native markers instead of a scatter faked at `bar.h * 1.015`.
 *
 * ⚠ THE LAST BAR MAY BE INCOMPLETE. ic_price_history carries today's partial bar during a
 * session — measured 2026-11-16, AAPL read o 357.10 / h 357.10 / l 353.02 / c 353.56 on 7.4m
 * shares against a 30-40m norm. The engines all stop at engines.trading_day.last_complete_session()
 * for exactly this reason. The chart DRAWS it, because a price chart that hides today is wrong in
 * a different way, but it says so in the caption rather than letting a half-formed candle pass as
 * a finished one.
 *
 * ⚠ A BAR WITH NO OPEN IS SKIPPED, NEVER FILLED. db/069 leaves adj_open NULL where open_price is
 * NULL. Substituting the close would draw a doji for a session that never traded that way — a
 * missing value resolving into a plausible one, which is this repository's standing defect class.
 * 99.58% of active-name bars since 2000 have an open, so the gaps are invisible; a fabricated
