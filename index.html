<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="assets/logomark.png">
<title>Integrity Compounders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --brand:#af6452; --brand-strong:#9c5544; --brand-deep:#633238; --brand-soft:rgba(175,100,82,.14);
  --bg:#0a0d12; --bg2:#0f131a; --panel:rgba(22,27,36,.72); --panel-solid:#161b24; --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12); --text:#e6e9ef; --muted:#8b93a3; --dim:#7c8596;
  --accent:#6aa6f8; --accent2:#8fbcff; --gold:#d4b25c; --green:#3fcf8e; --red:#ef6464; --amber:#f0a94a; --violet:#a78bfa;
  --q1:#6aa6f8; --q2:#3fcf8e; --q3:#ef6464; --q4:#f0a94a;
  /* ⚠ THE TYPE SCALE, ONE HOME (2026-11-17). The page used 21 font sizes from 8.5px to 26px, with
     1,674 text elements under 11px on Universe alone. Every size in the site now resolves to one of
     these eight. The floor is 11px, and only the uppercase letter-spaced micro-labels sit on it:
     tracked caps at 11px read about as large as lowercase at 12. Add a step here, never a literal. */
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:26px;
  /* The radius scale, one home (2026-11-17): 15 values across 39 declarations collapse to five steps.
     999px (pill) and 50% (circle) are shapes, not sizes, and stay literal. */
  --r:14px; --r-xs:3px; --r-sm:8px; --r-md:12px; --r-lg:var(--r); --r-xl:18px; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-base)/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;min-height:100vh;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(106,166,248,.08),transparent 60%),linear-gradient(to bottom,transparent 0,var(--bg) 85%);pointer-events:none;z-index:0}
a{color:var(--accent)}
/* One focus ring for everything the keyboard can reach — rows and sort headers became focusable on
   2026-11-18, and the browser default ring belongs to no design system. Inset on table rows so it is
   not clipped by the scroll container. */
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
tr:focus-visible,th:focus-visible{outline-offset:-2px;border-radius:0}
.mono{font-family:var(--mono)}
.caps{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:var(--red)} .amber{color:var(--amber)}
[hidden]{display:none!important}

/* gate */
#gate{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:340px}
/* THREE STATES, ONE OF THEM THE FORM (critique run 3). The form was the page's default markup, so a
   reader who was already signed in looked at a password box for the 3–8 seconds the book took to
   load — which reads as "you have been signed out". checking: the stored session is being read.
   loading: there is one, the data is on its way. signin: there is none, or the load failed. */
.gate-status{display:none;text-align:center;color:var(--muted);font:500 var(--fs-sm) var(--mono);padding:26px 0 4px}
#gate[data-state="checking"] #gateForm,#gate[data-state="loading"] #gateForm{display:none}
#gate[data-state="checking"] .gate-status,#gate[data-state="loading"] .gate-status{display:block}
.gate-hero{background:linear-gradient(180deg,rgba(99,50,56,.30),rgba(18,22,30,.90));border:1px solid var(--line2);border-radius:var(--r-xl);padding:44px 24px 58px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.logo{width:48px;height:48px;border-radius:var(--r-md);border:1px solid var(--line2);background:rgba(10,13,18,.6);display:grid;place-items:center;margin:0 auto 18px}
.gate-hero h1{margin:0 0 10px;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
.field{margin-top:34px}
.input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:var(--r-md);padding:12px 13px;font:inherit;outline:none;transition:border .15s}
.input:focus{border-color:var(--accent)}
.flabel{display:block;margin:0 0 6px;color:var(--muted);font-size:var(--fs-sm);font-weight:500}
.flabel+.input{margin-bottom:14px}
.check{display:flex;align-items:center;gap:9px;margin:14px 0 16px;color:var(--muted);font-size:var(--fs-md)}
.check input{accent-color:var(--accent);width:15px;height:15px}
.btn{width:100%;min-height:44px;background:var(--brand);color:#000;border:0;border-radius:var(--r-md);padding:12px;font:600 var(--fs-base) Inter,sans-serif;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.6;cursor:wait}
.gate-foot{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;text-align:center;color:var(--dim);font-size:var(--fs-sm)}
.err{color:var(--red);font-size:var(--fs-md);margin-top:10px;min-height:18px;text-align:center}

/* app shell */
#app{position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,13,18,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:34px;height:34px;margin:0;border-radius:var(--r-sm)}
.brand b{font-weight:700;font-size:var(--fs-lg);white-space:nowrap}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:var(--r-sm);font-weight:500;font-size:var(--fs-md);white-space:nowrap;transition:color .15s,background-color .15s}
nav.tabs a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.navgrp{align-self:center;margin:0 2px 0 10px;padding-left:10px;border-left:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;user-select:none}
nav.tabs a.on{color:var(--text);background:var(--brand-soft);box-shadow:inset 0 0 0 1px rgba(175,100,82,.4)}
/* The tab strip scrolls horizontally with a hidden scrollbar, so on a narrow window the tabs
   past the fold were unreachable with no affordance that they existed. The menu lists every
   tab and is always available; below 1150px it replaces the strip entirely. */
.menuwrap{position:relative;flex:0 0 auto}
/* attribution card (performance.js) */
.attr-top{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.attr-head{font-size:var(--fs-base);margin:0 0 8px}
.attr-bridge{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 14px}
.attr-bridge>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
.attr-bridge .v{font-size:var(--fs-lg);font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.attr-bridge .n{color:var(--muted);font-size:var(--fs-sm)}
.attr-tot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.attr-bar{position:relative;display:inline-block;width:64px;height:8px;background:rgba(255,255,255,.04);border-radius:2px}
.attr-bar>span{position:absolute;top:0;bottom:0;border-radius:2px}
.attr-names{display:grid;gap:6px;margin-top:12px;font-size:var(--fs-md)}
.attr-names .caps{margin-right:8px}
/* technical alerts bell (alerts.js) — the count is HIGH+MEDIUM flags on holdings, newest session, until opened */
.bellwrap{position:relative;flex:0 0 auto}
.bellbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative}
.bellct{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#000;font-size:var(--fs-xs);font-weight:700;line-height:18px;text-align:center}
.bellct.unk{background:var(--amber)}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:min(420px,calc(100vw - 32px));
  max-height:min(70vh,560px);overflow-y:auto;background:var(--panel-solid,#161b24);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:0 12px 40px rgba(0,0,0,.45);padding:12px}
.bp-h{font-weight:600;font-size:var(--fs-base);margin:0 0 8px}
.bp-g{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
.bp-row{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--text);
  padding:8px 6px;border-radius:var(--r-xs);cursor:pointer;font:inherit;min-height:44px}
.bp-row:hover,.bp-row:focus-visible{background:rgba(255,255,255,.05)}
.bp-dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px}
.bp-tk{flex:0 0 52px;font-weight:600;font-family:var(--mono,ui-monospace,monospace);font-size:var(--fs-md)}
.bp-t{flex:1;font-size:var(--fs-md);line-height:1.35}
.bp-sub{display:block;color:var(--muted);font-size:var(--fs-sm);margin-top:2px}
.bp-low summary{cursor:pointer;color:var(--muted);font-size:var(--fs-sm);margin-top:10px;min-height:32px;display:flex;align-items:center}
.bp-empty{font-size:var(--fs-md);margin:6px 0}
.bp-f{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--muted);font-size:var(--fs-sm);line-height:1.45}
.menubtn{display:inline-flex;align-items:center;gap:6px}
.menupanel{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:200px;padding:6px;
  /* --panel is rgba(...,.72) on purpose, for cards sitting over the page. A floating dropdown
     has to be opaque or the background grid reads straight through the labels. */
  background:var(--panel-solid);border:1px solid var(--line,rgba(255,255,255,.12));border-radius:var(--r-md);
  box-shadow:0 10px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:1px}
.menupanel a{display:block;padding:8px 11px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;
  font-size:var(--fs-md);font-weight:500;white-space:nowrap}
.menupanel a:hover{color:var(--text);background:rgba(255,255,255,.055)}
.mgrp{padding:9px 11px 3px;color:var(--dim);font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.13em;text-transform:uppercase}
.menupanel a.on{color:var(--text);background:rgba(106,166,248,.15);box-shadow:inset 0 0 0 1px rgba(106,166,248,.28)}
/* ⚠ THE TABS GET THEIR OWN ROW ON A DESKTOP. (Ten tabs and two group labels since 2026-11-23, about
   900px; the measurement below is from when there were nine and is why the rule exists.) With the brand, the as-of line, nine tabs, two group
   labels, the build stamp, the health badge, Menu and Sign out sharing one row, a 1440px window
   showed five tabs: Signals was cut mid-word and Markets, Memo and Research sat off-screen in a
   strip whose scrollbar is hidden (measured 2026-11-17: 523px visible of 855px). A section nobody
   can see is a section that does not exist. The strip is 855px, so on its own row it fits any
   window wide enough to show it at all; below 1150px the menu replaces it as before. */
@media(min-width:1151px){
  .top-in{flex-wrap:wrap;row-gap:4px;padding-bottom:6px}
  nav.tabs{order:10;flex:1 0 100%;margin-left:-12px;overflow-x:visible}
  .menuwrap{margin-left:auto}      /* nav no longer pushes the controls right, so this does */
}
@media(max-width:1150px){nav.tabs{display:none}}
@media(min-width:1151px){.menubtn .mlabel{display:none}}
/* The brand title is white-space:nowrap and its wrapper had no min-width:0, so on a narrow
   window it could not shrink and ran straight through the menu button. Let it truncate, and
   drop the as-of line, which is repeated at the foot of every view anyway. */
@media(max-width:760px){
  .top-in{gap:10px;padding:12px 14px}
  .brand{flex:1 1 auto;min-width:0}
  .brand>div{min-width:0}
  .brand b{display:block;overflow:hidden;text-overflow:ellipsis}
  .brand #asof{display:none}
  .buildstamp{display:none}      /* a build timestamp is not worth header space on a phone */
  /* The health badge wrapped to three lines and squeezed the name to "Inte…". It moves to its own
     line under the brand instead of being hidden: whether last night's run passed is the one fact
     in the header worth keeping on a phone. */
  .top-in{flex-wrap:wrap;row-gap:6px}
  /* ⚠ flex-basis 0 on the brand, or wrapping goes wrong. Allowing the row to wrap (so the badge can
     drop to its own line) let SIGN OUT wrap first instead of the name shortening: three rows, a
     142px sticky header, 17% of a phone screen (measured 2026-11-17). With a zero basis the name
     yields its width before anything wraps, so only the badge, at flex-basis 100%, moves down. */
  .brand{flex:1 1 0%}
  #pipestate{order:10;flex:1 0 100%;margin-right:0!important;font-size:var(--fs-xs)}
}
/* Safe area: on a phone with a notch, held sideways, the header ran under it. */
@supports(padding:max(0px)){
  .top-in{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
  @media(max-width:760px){.top-in{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}}
}
/* ⚠ TOUCH TARGETS. On a phone almost every control measured under 44px tall (Universe 39 of 39,
   Markets 32 of 32). Keyed to the POINTER, not the width: a narrow desktop window keeps its compact
   controls, and a tablet held wide still gets fingertip-sized ones. */
@media(pointer:coarse){
  button,.btn,.lock,.fbtn,.tfb,.indchip,.bbtn,select,.menupanel a,nav.tabs a{min-height:44px}
  button,.lock,.fbtn,.tfb,.indchip,.bbtn{display:inline-flex;align-items:center;justify-content:center}
  .tbl th[data-sort]{height:44px}
  input.search,input[type=text],input[type=search],input[type=email],input[type=password]{min-height:44px}
  input[type=checkbox]{width:22px;height:22px}
  label:has(>input[type=checkbox]){display:inline-flex;align-items:center;min-height:44px}   /* the label is the target */
  .lwckx{position:relative}
  .lwckx::before{content:"";position:absolute;inset:-12px}   /* the chip's × gets a 44px hit area */
}
/* Reduced motion: the site animates little, but what it does animate should rest. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
}
.lock{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;font-size:var(--fs-sm)}
main{max-width:1320px;margin:0 auto;padding:26px 24px 80px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 22px;flex-wrap:wrap}
.pagehead h2{margin:6px 0 0;font-size:var(--fs-3xl);font-weight:700;letter-spacing:-.02em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:980px){.g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.card h3{margin:0;font-size:var(--fs-base);font-weight:600;color:var(--text)}
.card .sub{color:var(--dim);font-size:var(--fs-sm);margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.chart{width:100%;height:280px} .chart.tall{height:360px} .chart.sm{height:220px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}} @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 12px}
.kpi .v{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .n{color:var(--dim);font-size:var(--fs-sm);margin-top:3px}

table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font:500 var(--fs-xs) var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel-solid)}
.t th:hover{color:var(--muted)}
.todayrow{text-decoration:none;color:inherit;gap:12px}
.todayrow:hover{background:rgba(255,255,255,.035)}
.todaybreach{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
/* .tbl / .table-wrap / .pill are emitted by every view build_live.py injects — the Grid, Signals,
   Risk, Proposal, Analytics and the drawers — and had NO rules at all, so six tabs including the
   decision grid rendered as browser-default tables. Match .t, which the template's own tables use,
   so the two table systems look like one product. */
.table-wrap{overflow:auto;border-radius:var(--r-md);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:var(--fs-md)}
.tbl th{text-align:left;font:500 var(--fs-xs) var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  position:sticky;top:0;background:var(--panel-solid);z-index:1}
.tbl th.sorted{color:var(--text)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.028)}
.tbl .srank{font-size:var(--fs-xs);opacity:.75;margin-left:1px}
/* Size + factor block (Grid and Universe tables): the first column carries a rule so the seven read as
   one group, and the cells sit tighter than the text columns around them. */
.tbl th.fac,.tbl td.fac{padding-left:7px;padding-right:7px;white-space:nowrap}
.tbl th.fb0,.tbl td.fb0{border-left:1px solid var(--line2);padding-left:12px}
/* On a phone the size/factor block is a swipe to the right of the ticker, and a row you cannot name is no use, so
   the first column stays put while the rest scrolls under it. Opt-in per table. */
.tbl.stickfirst th:first-child,.tbl.stickfirst td:first-child{position:sticky;left:0;z-index:2;background:var(--panel-solid);box-shadow:1px 0 0 var(--line)}
.tbl.stickfirst th:first-child{z-index:3}
/* THE DECISION GRID READS PAST ITS FIRST SCREEN (critique run 3, 2026-11-18). `.tbl th` was already
   position:sticky, but sticky needs a scrolling ancestor with a bounded height and this wrapper had
   none, so the header left with the first screen of a 51,000px table and the horizontal scrollbar
   sat at its far end. Bounded to the viewport: header pinned, both scrollbars always in reach. */
.table-wrap.gridwrap{max-height:calc(100dvh - 150px);min-height:320px}
.tbl.dense td{white-space:nowrap;vertical-align:middle;padding-top:7px;padding-bottom:7px}
.tbl.dense td.clip{overflow:hidden;text-overflow:ellipsis}
.lock[aria-pressed="true"]{color:var(--text);border-color:var(--brand,var(--accent));background:var(--brand-soft,rgba(106,166,248,.12))}
@media(max-width:700px){.tbl.stickfirst td:first-child .nm{max-width:96px}}   /* a pinned column must leave room to scroll past it */
.t td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
/* A label/value table's LABEL wraps. With every cell nowrap, "Value at Risk 95% / 99% (daily)" could
   not break, so on a phone the Risk & ratios table stood 384px wide in a 342px card and pushed the
   whole Performance page to 427px on a 390px screen (measured 2026-11-17). */
.t td.lbl{white-space:normal}
.t tr.row{cursor:pointer;transition:background .12s} .t tr.row:hover{background:rgba(106,166,248,.06)}
/* The ticker stays in view while a wide table scrolls sideways (2026-11-18). Opaque so the cells
   sliding under it do not show through; the hairline marks the edge of what is pinned. */
.t td.stick,.t th.stick{position:sticky;left:0;z-index:1;background:var(--panel-solid);box-shadow:1px 0 0 var(--line2)}
.t th.stick{z-index:2}
@media(max-width:700px){.t td.stick .nm{max-width:96px;white-space:nowrap}.t td.stick,.t th.stick{padding-right:8px}}   /* was 200px of a 313px table: same cap as the grid's pinned column */
.t tr.row:hover td.stick{background:color-mix(in srgb,var(--panel-solid) 94%,#6aa6f8)}
/* METHOD NOTES FOLD (2026-11-18): the finding stays visible, the derivation sits one click away. */
details.howto{margin-top:10px}

.t .r{text-align:right}

/* A BOXED BADGE IS ONE OF EIGHT SETS and is drawn only by badge() (see BADGES in the script). Every
   other reading that used to wear a box (quad, trend, rotation, queue kind, a limit breach, "held")

.wd{white-space:nowrap} .wd.ok,.wd.up{color:var(--green)} .wd.warn{color:var(--amber)} .wd.bad,.wd.down{color:var(--red)}
.wd.dim,.wd.flat{color:var(--muted)} .wd.q1{color:var(--q1)} .wd.q2{color:var(--q2)} .wd.q3{color:var(--q3)} .wd.q4{color:var(--q4)}
.wd.lbl{font:600 var(--fs-xs) var(--mono);letter-spacing:.09em;text-transform:uppercase}
.chip.bad{color:var(--red);border-color:rgba(239,100,100,.35)} .chip.warn{color:var(--amber);border-color:rgba(240,169,74,.35)} .chip.ok{color:var(--green);border-color:rgba(63,207,142,.3)}
.bar{height:6px;border-radius:var(--r-xs);background:rgba(255,255,255,.06);width:84px;position:relative;overflow:hidden;display:inline-block;vertical-align:middle}

.fbtn.on{color:var(--text);border-color:rgba(106,166,248,.45);background:rgba(106,166,248,.12)}
.search{background:var(--bg2);border:1px solid var(--line2);color:var(--text);border-radius:var(--r-sm);padding:6px 10px;font:inherit;font-size:var(--fs-md);outline:none;width:180px}
.list{display:flex;flex-direction:column}
/* filter rows on the Grid and Holdings tabs */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fsel{display:flex;align-items:center;gap:6px;font:500 var(--fs-sm) var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
.fsel select{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);

  max-width:190px}

  padding:5px 7px;font:500 var(--fs-sm) var(--mono);width:74px;text-transform:none;letter-spacing:0}

  margin-bottom:12px;gap:11px 14px}

/* ── technical chart chrome (chart_lwc.js) ────────────────────────────────────
   Lightweight Charts draws a canvas and nothing else: every control here is ours. */
.lwcbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tfs,.lwcopts{display:flex;gap:3px;flex-wrap:wrap}
.tfb,.indchip{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:4px 9px;font:500 var(--fs-sm) Inter,sans-serif;cursor:pointer;transition:color .13s,background-color .13s,border-color .13s}
.tfb:hover,.indchip:hover{color:var(--text);background:rgba(255,255,255,.07)}
.tfb.on,.indchip.on{color:var(--text);background:var(--brand-soft);border-color:rgba(175,100,82,.45)}
/* An indicator that is OFF must read as off at a glance, not merely un-highlighted -- the chip row
   is the only place that says what is on the chart. */
.indchip:not(.on){opacity:.55}
.lwcchips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
/* The Indicators and Signals menus: a panel under its button, each entry a name and one line.
   Until 2026-11-20 .lwcmenu had NO rule at all — the panel rendered as an unstyled block in the
   page flow, pushing the chart down when it opened. */
/* ⚠ THE PANEL HANGS FROM THE TOOLBAR, NOT FROM ITS BUTTON (2026-11-23). It was positioned against
   the button's own wrapper with right:0, so its left edge sat 390px to the left of wherever the
   button happened to be. When the toolbar wrapped (any container under about 700px, which was every
   name drawer) the button was at the left and the whole panel was outside its scrolling parent,
   clipped: the menu opened and nothing appeared. Anchored to the toolbar's right edge and no wider
   than the toolbar, it cannot leave the chart's own box whatever the toolbar does. */
.lwcmenuwrap{display:inline-block}
.lwcmenu{position:absolute;z-index:40;top:calc(100% + 6px);right:0;width:min(420px,100%);max-height:min(520px,70vh);overflow:auto;
  background:var(--panel-solid);border:1px solid var(--line2);border-radius:var(--r-md);padding:8px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
.lwcmenu[hidden]{display:none}
.lwcmhead{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 2px;font:700 var(--fs-md) Inter,sans-serif;color:var(--text)}
.lwcmhead a{font:500 var(--fs-xs) Inter,sans-serif;color:var(--muted)}
.lwcmsec{font:600 var(--fs-xs) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:10px 8px 4px}
.lwcitem{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:7px 8px;cursor:pointer;color:var(--text)}
.lwcitem:hover{background:rgba(255,255,255,.06)}
.lwcit{font:600 var(--fs-md) Inter,sans-serif}
.lwcitem.on .lwcit{color:var(--accent2)}
.lwcadded{float:right;font:500 var(--fs-xs) Inter,sans-serif;color:var(--dim)}
.lwcdesc{display:block;font:400 var(--fs-sm)/1.45 Inter,sans-serif;color:var(--muted);margin-top:2px}
.lwcsum{color:var(--muted);font-size:var(--fs-sm);line-height:1.55;margin:0 0 8px}
.lwcknote{color:var(--muted);font-weight:400;margin-left:5px}
.lwcknote:empty{display:none}
/* GBG maps: a label, a strip of one cell per session, the state now. */
.gbgmap{display:grid;grid-template-columns:minmax(150px,max-content) 1fr minmax(150px,max-content);column-gap:12px;row-gap:3px;align-items:center}
.gbglab{font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbglab[data-gbgpick]:hover b{color:var(--accent2)}
.gbgcells{display:flex;height:18px;border-radius:var(--r-xs);overflow:hidden;background:rgba(255,255,255,.03)}
.gbgcells i{flex:1 1 0;min-width:0;display:block}
.gbgx{background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 3px,transparent 3px 6px) !important}
.gbgright{font-size:var(--fs-sm);white-space:nowrap}
.gbgaxis{position:relative;height:16px;font:500 var(--fs-xs) var(--mono);color:var(--dim)}
.gbgaxis span{position:absolute;transform:translateX(-50%);top:2px;white-space:nowrap}
.gbglegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:var(--fs-xs);color:var(--muted)}
.gbglegend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gbgnote{font-size:var(--fs-xs);line-height:1.5;margin-top:8px}
@media(max-width:760px){.gbgmap{grid-template-columns:minmax(90px,max-content) 1fr}.gbgright{display:none}}
.mktsearch{display:inline-flex;gap:4px;margin-left:10px}
.mktsearch input{width:130px}
.lwcgrp{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
/* Markets: the symbol selector. Same chip as the timeframe buttons — one visual language for

.mktsel{display:flex;gap:4px;flex-wrap:wrap}
.mktsel .tfb{font:600 var(--fs-md) Inter,sans-serif;padding:6px 13px}
.tbl tr.sorted td{background:rgba(175,100,82,.07)}
.lwcglab{font:600 var(--fs-xs) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.lwcsep{display:inline-block;width:1px;height:16px;background:var(--line2);margin:0 5px;vertical-align:middle}
.lwclegend{font:500 var(--fs-sm) var(--mono);color:var(--text);min-height:17px;margin-bottom:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* THE DATA KEY. Two halves: .lwckey is the removable chip row above the chart (what is on, and
   the × to take it off), .lwcpl is the per-pane legend drawn OVER the canvas (which line is
   which, and what it reads at the crosshair). Before these the chart drew up to nine unlabelled
   lines and reported only the symbol's own OHLC. */
.lwckey{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.lwckc{display:inline-flex;align-items:center;gap:5px;font:500 var(--fs-sm) Inter,sans-serif;color:var(--text);
  background:var(--card2,rgba(255,255,255,.04));border:1px solid var(--line);border-radius:var(--r-md);padding:2px 4px 2px 8px}
.lwckx{background:none;border:0;color:var(--dim);cursor:pointer;font:600 var(--fs-md) Inter,sans-serif;
  line-height:1;padding:1px 4px;border-radius:50%}
.lwckx:hover{color:var(--text);background:rgba(255,255,255,.1)}
.lwcsw{display:inline-block;width:10px;height:2px;border-radius:var(--r-xs);vertical-align:middle;flex:0 0 auto}
/* pointer-events:none so the legend never eats a crosshair move or a drag on the pane beneath it */
/* ⚠ max-width keeps the key clear of the price axis, and the VALUES row wraps.
   At drawer width (570px) a single nowrap line fitted four of eleven overlays and cut the rest
   off mid-word — "—Trade ra" — so AlphaTrend, Grade and Quadrant had no readable value at all.
   A key that silently shows the first few entries is worse than one that takes a second line:
   the whole point is to say what every line on the chart reads. The HEADER row (OHLC) stays on
   one line; only the overlay values wrap. */
.lwcpl{position:absolute;left:9px;z-index:3;pointer-events:none;font:500 var(--fs-sm) var(--mono);
  color:var(--text);white-space:nowrap;max-width:calc(100% - 68px);
  text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
.lwcpl-h{font-weight:700}
/* the price pane prints two rows -- OHLC, then the overlays' values -- like the reference setup;
   each row stays on one line and the first .lwcpl-i on a row drops its left margin */
.lwcpl-r{line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lwcpl-r+.lwcpl-r{white-space:normal}      /* the values row wraps rather than being cut off */
.lwcpl-r+.lwcpl-r .lwcpl-i:first-child{margin-left:0}
.lwcpl-i{margin-left:11px;color:var(--muted)}
.lwcpl-i b{color:var(--text);font-weight:600;margin-left:3px}
@media(max-width:700px){.lwcpl{font-size:var(--fs-xs);left:5px}.lwcpl-i{margin-left:7px}}
/* The caption carries each indicator's `basis` from the registry -- what a series actually IS when
   it is not a plain transform of the bars. It is small, and it is not optional. */
.lwcfoot{color:var(--dim);font-size:var(--fs-xs);line-height:1.55;margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
@media(max-width:700px){.fsel{width:100%}.fsel select{flex:1;max-width:none}}
/* period segmented control (Overview) */
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(255,255,255,.03);margin-left:12px}
/* A card header's text block must be allowed to shrink, or a long segmented control (the Models
   card's four model names, then its periods) pushes the whole page sideways on a phone: 408px of
   content on a 375px screen, measured 2026-11-17. With min-width:0 the .seg above wraps instead. */
.card-h>div{min-width:0}
.seg button{background:none;border:0;color:var(--muted);cursor:pointer;font:600 var(--fs-sm) var(--mono);letter-spacing:.06em;
  padding:4px 10px;border-radius:var(--r-sm)}
.seg button:hover:not([disabled]):not(.on){color:var(--text)}
.seg button.on{background:var(--brand-strong,var(--brand));color:#fff}
.seg button[disabled]{opacity:.32;cursor:default}
/* daily note on the Holdings tab */
.brief{border-color:rgba(175,100,82,.28);background:linear-gradient(180deg,rgba(175,100,82,.07),rgba(255,255,255,.012))}
.brief h3{margin:3px 0 0;font-size:var(--fs-xl);line-height:1.25;font-weight:650}
/* The daily brief (V14): the day's notes as sections of ONE block, not one card each. */
.dbrief{border:1px solid var(--line);border-radius:var(--r-md);padding:4px 16px 12px;background:rgba(255,255,255,.012)}
.dbrief > .card{border:0;border-top:1px solid var(--line);border-radius:0;background:none;margin:0;padding:16px 0 14px;box-shadow:none}
.dbrief > .card:first-of-type{border-top:0}
.dbrief .brief h3{font-size:var(--fs-lg)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 2px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qt{font-weight:600}
.qrow .qd{grid-column:1/-1;color:var(--muted);font-size:var(--fs-sm);line-height:1.45}
.qmeta{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end;font-size:var(--fs-sm)}
/* Ruling from the page (db/096): three buttons per item, one form open at a time. */
.qact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.qact .qb{color:var(--text);min-width:76px}
.qact .qb.bad{border-color:rgba(239,100,100,.4);color:var(--red)} .qact .qb.ok{border-color:rgba(63,207,142,.35);color:var(--green)}
.qact .qb:hover,.qform .fbtn:hover{border-color:rgba(106,166,248,.45)} .qact .qb.on{color:var(--text)}
.qform{margin-top:9px;padding:12px;border:1px solid var(--line2);border-radius:var(--r-md);background:rgba(255,255,255,.02);display:grid;gap:9px;max-width:760px}
.qform .qwhat{color:var(--text);line-height:1.45}
.qform textarea{resize:vertical;min-height:76px;font:inherit;font-size:var(--fs-base);line-height:1.45;color:var(--text)}
.qform textarea:focus{border-color:rgba(106,166,248,.55)}
.qform .qgo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qform .fbtn:disabled{opacity:.5;cursor:not-allowed}
.qform .qsend{color:var(--text)}
.qpend{margin-top:9px;padding:10px 12px;border:1px solid rgba(240,169,74,.3);border-radius:var(--r-md);display:grid;gap:5px;color:var(--muted);line-height:1.45}
.qfail{margin-top:9px;padding:10px 12px;border:1px solid rgba(239,100,100,.35);border-radius:var(--r-md);color:var(--text);line-height:1.45}
.qfail b{color:var(--red)}
@media (max-width:640px){ .qrow{grid-template-columns:minmax(0,1fr)} .qmeta{justify-content:flex-start} }
.gap{border:1px dashed var(--line);border-radius:var(--r-md);padding:12px 14px;color:var(--muted)}
.gap b{color:var(--text)}
.hyp{padding:12px 2px;border-top:1px solid var(--line)}
.hyp:first-child{border-top:0}
.hyp .hc{font-weight:600;line-height:1.4}
.hyp .hr{color:var(--muted);font-size:var(--fs-sm);line-height:1.5;margin-top:4px}

.brief.universe{border-color:rgba(63,207,142,.28);background:linear-gradient(180deg,rgba(63,207,142,.06),rgba(255,255,255,.012));margin-bottom:16px}
.brief.morning{border-color:rgba(106,166,248,.3);background:linear-gradient(180deg,rgba(106,166,248,.07),rgba(255,255,255,.012));margin-bottom:16px}
.memotag{display:inline-block;font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid;border-radius:var(--r-xs);padding:1px 5px;margin-right:7px;vertical-align:1px}
.memolt>li{margin-bottom:11px}
.brief h4{margin:0 0 7px;font-size:var(--fs-sm);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bnav{display:flex;align-items:center;gap:8px;flex:none}
.bbtn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);border-radius:var(--r-sm);cursor:pointer;
  font:600 var(--fs-sm) var(--mono);padding:3px 8px}
.bbtn:hover:not([disabled]){color:var(--text);border-color:var(--brand)}
.bbtn[disabled]{opacity:.3;cursor:default}
.blede{margin:11px 0 0;font-size:var(--fs-base);line-height:1.6;color:var(--text)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 26px;margin-top:18px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:var(--fs-base);line-height:1.5}

@media(max-width:700px){.bgrid{grid-template-columns:1fr}.brief h3{font-size:var(--fs-lg)}}
/* plain-English thesis layer: the readable version, with the full record behind a toggle */
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.thesis-full>summary::marker,.thesis-full>summary::-webkit-details-marker{display:none}
.thesis-full>summary::before{content:"▸ ";color:var(--dim)}

.legend i{display:inline-block;width:9px;height:9px;border-radius:var(--r-xs);margin-right:6px;vertical-align:-1px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.55);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
/* 1080px since 2026-11-23 (Niko: the chart's Indicators and Signals menus opened out of view). At
   760px the chart's toolbar wrapped, its menu buttons landed at the left edge, and a panel hung from
   a button's RIGHT edge ran off the drawer's left side, where overflow clips it. Wider, so the
   toolbar stays on one row; the panel itself is now anchored to the toolbar (see .lwcmenu). */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1080px,100vw);background:#0d1118;border-left:1px solid var(--line2);z-index:41;transform:translateX(100%);overflow-y:auto;
  /* ⚠ Closed = hidden, not just off-screen. Slid away with translateX alone, a drawer that had shown a
     name kept its links and chart buttons in the Tab order: keyboard users tabbed into controls they
     could not see. visibility:hidden drops it from the Tab order and the accessibility tree; the
     visibility change waits out the 250ms slide so the exit still animates. */
  visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.drawer.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.dr-in{padding:22px 26px 60px}
.dr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

<script>
"use strict";
/* ═══ auth + live data ═════════════════════════════════════════════════ */
const SB = supabase.createClient(IC_CONFIG.supabaseUrl, IC_CONFIG.supabaseAnonKey,
  {auth:{persistSession:true, autoRefreshToken:true}});
let D = null, LIVE = {v2:{}, theses:{}, quotes:{}, jobs:[], matrix:null, risk:null, proposal:null, builtAt:null, briefs:[], vdur:{}, vdurHist:{}, vdurStats:null, vskips:{}, vskipsOk:false, rbeta:{}, rbetaOk:false, rgaps:{}, rgapsOk:false, rbetaHist:{}, suniv:{}, sunivOk:false, cards:{}, ranges:{}, funda:{}, fundaHist:{}}, QUOTE_TIMER = null;
async function q(view, build){ let r = SB.from(view).select("*"); if(build) r = build(r); const {data, error} = await r; if(error) throw error; return data; }
async function qAll(view, build, page = 1000){   // PostgREST caps a response at 1000 rows; page past it
  const out = [];
  for(let from = 0; ; from += page){
    let r = SB.from(view).select("*"); if(build) r = build(r);
    const {data, error} = await r.range(from, from + page - 1);
    if(error) throw error;
    out.push(...data);
    if(data.length < page) return out;
  }
}
async function loadPayload(){
  const rows = await q("site_payload");
  if(!rows.length) throw new Error("no-access");
  D = rows[0].payload; LIVE.builtAt = rows[0].built_at;
}
async function loadQuotes(){
  const rows = await qAll("site_quotes");
  LIVE.quotes = Object.fromEntries(rows.map(r => [r.ticker, r]));
  LIVE.jobs = await q("site_job_runs");
  applyQuotes();
}
// One glance at whether the run that produced these numbers passed its own assertions. Until now
// nothing on the page answered that: only price_refresh wrote ic_job_runs and its status was
// fetched and never shown, so a chain that died at step 13 looked identical to one that finished.
function renderPipeline(){
  const el = document.getElementById("pipestate");
  const h = (LIVE.pipeline || {}).health;
  if(!el || !h) return;
  let v; try{ v = typeof h.value === "string" ? JSON.parse(h.value) : h.value; }catch(e){ return; }
  if(!v) return;
  const age = Math.round((Date.now() - new Date(h.updated_at)) / 36e5);
  // `checks` counts every RESULT — warnings and skips included — so "N checks ok" claimed a pass
  // for checks that asserted nothing. The one that cannot run on a cloud box (no local
  // portfolio.csv, which is gitignored) put a free pass in that number every single night, which
  // is the defect this system keeps producing: a value that should read absent resolving into a
  // reassuring one. `passed` counts only OK, and a skip is now named rather than absorbed.
  // Verdicts written before 2026-11-06 carry no `passed`/`skipped`, so fall back to the old
  // wording instead of printing "undefined checks ok" — a missing number must look missing.
  const graded = v.passed != null;
  const pass = graded ? v.passed : v.checks;
  const skipped = v.skipped || 0, errs = v.errors || 0;
  // A run that CRASHED still records a verdict — health_check writes it in a `finally` precisely
  // so the page cannot show silence as health — and the checks it never reached asserted nothing.
  // "0 failing" out of a run that died at check 12 is not a clean bill, so it is red on its own.
  const bad = v.failed > 0 || !!v.crashed, stale = age > 30;
  const col = bad ? C.red : stale ? C.amber : C.green;
  const txt = v.crashed ? `health run crashed · ${v.ran || 0}/${v.registered || 0} checks ran`
            : bad ? `${v.failed} check${v.failed > 1 ? "s" : ""} failing${errs ? ` · ${errs} errored` : ""}`
            : stale ? `checks ${age}h old`
            : `${pass} check${pass === 1 ? "" : "s"} ok${v.warnings ? ` · ${v.warnings} warn` : ""}`
              + `${skipped ? ` · ${skipped} skipped` : ""}`;
  // An ERROR is a check that raised, so it belongs in the tooltip beside the failures rather than
  // nowhere; a SKIP belongs there too, because "which check did not run" is the question a reader
  // of this badge actually has.
  const detail = [...(v.failing || []), ...(v.erroring || []), ...(v.warning || []),
                  ...(v.skipping || [])].join(", ");
  // NOT `detail || "all checks passed"`: on a crashed run `detail` is empty, so the badge would
  // have carried a clean bill of health as its tooltip while saying the run died in its label.
  const title = v.crashed ? `the health run did not complete: ${v.crash || "reason not recorded"}`
                            + (detail ? ` · ${detail}` : "")
              : detail || (graded ? "all checks passed" : "no per-check breakdown recorded");
  el.innerHTML = `<span class="caps" style="font-size:var(--fs-xs);color:${col}" title="${esc(title)}">● ${esc(txt)}</span>`;
}
function applyQuotes(){
  if(!D) return;
  let total = 0;
  D.holdings.forEach(h => {
    const qt = LIVE.quotes[h.tk];
    if(qt && qt.price != null){ h.price = +qt.price; h.day = qt.day_change != null ? +qt.day_change : null; h.quote_date = qt.price_date; }
    h.value = (h.shares||0) * (h.price||0); h.pl = h.avg_cost && h.price ? h.price/h.avg_cost - 1 : null; total += h.value;
  });
  D.holdings.forEach(h => h.weight = total ? h.value/total : null);
  D.book_value = total;
  const pr = LIVE.jobs.find(j => j.job === "price_refresh");
  const t = pr ? new Date(pr.ran_at) : null;
  const dayPl = D.holdings.reduce((a,h) => a + (h.day!=null ? h.value - h.value/(1+h.day) : 0), 0);
  document.getElementById("asof").textContent =
    (t ? "Prices " + t.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "Prices —") +
    " · analytics " + new Date(LIVE.builtAt).toLocaleDateString([], {month:"short", day:"numeric"}) +
    " · today " + (dayPl>=0?"+":"−") + "$" + Math.abs(Math.round(dayPl)).toLocaleString();
}
async function enter(){
  const err = document.getElementById("err");
  try{ await loadPayload(); await loadQuotes(); LIVE.theses = Object.fromEntries((await qAll("site_theses")).map(t => [t.ticker, t]));
    LIVE.v2 = Object.fromEntries((await qAll("site_technicals_v2")).map(t => [t.ticker, t]));
    LIVE.briefs = await qAll("site_daily_brief", r => r.order("as_of", {ascending:false}));
    // Technical alerts (db/072). A failed load is NULL, never [] — the bell must say "unknown",
    // not "quiet night" (alerts.js).
    try{ LIVE.flags = await qAll("site_technical_flags", r => r.order("as_of", {ascending:false})); }
    catch(e){ LIVE.flags = null; }
    renderBell();
    LIVE.vdur = Object.fromEntries((await qAll("site_valuation_duration")).map(v => [v.ticker, v]));
    LIVE.vdurStats = null; LIVE.vdurHist = {};     // cross-section facts and per-name history are derived from it
    // WHY a name is absent from the DCF set, as recorded by valuation_duration.py for the current run
    // (db/029). The page used to assert one reason for every absence; six foreign filers that had both
    // a cash flow and an enterprise value were told they lacked them. Degrades to "no reason recorded".
    try{
      LIVE.vskips = Object.fromEntries((await qAll("site_valuation_duration_skips")).map(r => [r.ticker, r]));
      LIVE.vskipsOk = true;
    }catch(e){ LIVE.vskips = {}; LIVE.vskipsOk = false; }
    // Measured rate sensitivity (ic_rate_beta). Its own view and its own coverage (411 core companies
    // against ~390 in the DCF set; benchmark and theme ETFs and the micro sleeve are not in it), and a
    // page build can reach a database that has not had db/027 applied yet — so a failure here
    // degrades to "unavailable" instead of failing the boot.
    try{
      LIVE.rbeta = Object.fromEntries((await qAll("site_rate_beta")).map(r => [r.ticker, r]));
      LIVE.rbetaOk = true;
    }catch(e){ LIVE.rbeta = {}; LIVE.rbetaOk = false; }
    // Thesis watch (db/083) for the name drawer; the Theses tab reloads it. Flagged on failure.
    try{ LIVE.tsell = {}; for(const s of await qAll("site_thesis_sell_conditions")) (LIVE.tsell[s.ticker] ||= []).push(s); }
    catch(e){ LIVE.tsell = {}; }
    try{ LIVE.tprop = {}; for(const p of await qAll("site_thesis_proposals", r => r.order("created_at", {ascending: false}))) (LIVE.tprop[p.ticker] ||= []).push(p); }
    catch(e){ LIVE.tprop = {}; }
    /* Insider filings (db/086): 180 days of open-market lines for the names the nightly sync covers.
     * insiderNames is every name with at least one row, which is how the drawer tells "covered, nothing
     * recent" from "not a covered name". */
    try{ LIVE.insiders = {}; for(const r of await qAll("site_insider_filings", x => x.order("filed_at", {ascending: false})))
           (LIVE.insiders[r.ticker] ||= []).push(r);
         LIVE.insiderNames = new Set(Object.keys(LIVE.insiders)); LIVE.insidersOk = true; }
    catch(e){ LIVE.insiders = {}; LIVE.insiderNames = new Set(); LIVE.insidersOk = false; }
    try{ LIVE.twatch = Object.fromEntries((await qAll("site_thesis_watch")).map(w => [w.ticker, w])); LIVE.twatchOk = true; }
    catch(e){ LIVE.twatch = {}; LIVE.twatchOk = false; }
    // GasBrakesGas status for the Universe and Signals columns (db/082): the stored rows without
    // their run lists. A failed load is flagged, so the cells read "?" and not an empty dash.
    try{
      LIVE.gbg = {}; LIVE.gbgNewest = {};
      for(const r of await qAll("site_gasbrakesgas_status")){
        (LIVE.gbg[r.ticker] ||= {})[r.timeframe] = r;
        if(!LIVE.gbgNewest[r.timeframe] || r.bar_date > LIVE.gbgNewest[r.timeframe]) LIVE.gbgNewest[r.timeframe] = r.bar_date;
      }
      LIVE.gbgOk = true;
    }catch(e){ LIVE.gbg = {}; LIVE.gbgNewest = {}; LIVE.gbgOk = false; }
    // the session dates the maps' one-character-per-session strings are aligned to (db/084)
    try{ LIVE.gbgCal = ((await qAll("site_gasbrakesgas_calendar")).find(r => r.timeframe === "D") || {}).dates || []; }
    catch(e){ LIVE.gbgCal = []; }
    // WHY a name has no rate beta (db/029): micro-sleeve names are excluded by design, a name whose
    // price series stopped is a data problem, and the page must not call both "too few returns".
    try{
      LIVE.rgaps = Object.fromEntries((await qAll("site_rate_beta_gaps")).map(r => [r.ticker, r]));
      LIVE.rgapsOk = true;
    }catch(e){ LIVE.rgaps = {}; LIVE.rgapsOk = false; }
    // The regime dashboard (db/032). Two sources, deliberately NOT blended: the market index asks what
    // the market is doing and carries a protection budget, the portfolio index asks which of our own
    // holdings can fail together. Each in its own try — the dashboard says "unavailable" rather than
    // taking the Analytics tab down with it, and a page build can reach a database without db/032.
    try{
      LIVE.regime = await qAll("site_market_regime", r => r.order("as_of"));
      LIVE.regimeOk = LIVE.regime.length > 0;
    }catch(e){ LIVE.regime = []; LIVE.regimeOk = false; }
    try{
      LIVE.pfrag = await qAll("site_portfolio_fragility", r => r.order("as_of"));
      LIVE.pfragOk = LIVE.pfrag.length > 0;
    }catch(e){ LIVE.pfrag = []; LIVE.pfragOk = false; }
    // The consumer of the two above: what the regime implies for exposure. Its own try, so the Risk
    // tab still renders the indices if the bridge has not run.
    try{
      LIVE.bridge = (await qAll("site_sizing_bridge"))[0] || null;
      LIVE.bridgeOk = !!LIVE.bridge;
    }catch(e){ LIVE.bridge = null; LIVE.bridgeOk = false; }
    // CASH AND TRADES COME FROM LIVE VIEWS, NOT THE NIGHTLY PAYLOAD. Both change the moment a trade
    // is logged, and the payload is a snapshot: on 2026-10-22 four exits at 17:30 left the site
    // showing 29 holdings, 33 trades and $29,318 against a book of 25, 37 and $212,243 until the
    // next post-close. Holdings themselves stay on the payload — they carry sparklines, factor data
    // and a 12-month price series that would be far heavier to serve live — so the book can still
    // lag a same-day trade; cash and the trade log no longer do, and the cash row says its own date.
    try{
      const cr = (await qAll("site_cash"))[0];
      if(cr) D.cash = {as_of: cr.as_of, amount: +cr.amount, note: cr.note};
    }catch(e){}
    try{
      const tr = await qAll("site_trades", r => r.order("trade_date", {ascending:false}));
      // Mapped onto the PAYLOAD's keys (site_build.py: d · tk · amount · why), which is what the trade
      // table renders. Spreading the view row kept its own names (ticker, dollar_amount, why_now), so
      // every row printed "undefined" for date and ticker until 2026-11-18.
      if(tr && tr.length) D.trades = tr.map(t => ({d: t.trade_date, tk: t.ticker, action: t.action,
        shares: t.shares == null ? null : +t.shares, price: t.price == null ? null : +t.price,
        amount: t.dollar_amount == null ? null : +t.dollar_amount, why: t.why_now || ""}));
    }catch(e){}
    // The model of models. Until this existed the site showed only the EQUITY sleeve, so the thing
    // a client actually holds — 60/40 or 80/20 — appeared nowhere and the book's 26.7% volatility
    // read as though it were the portfolio's.
    try{
      LIVE.models = await qAll("site_model_portfolios", r => r.order("as_of"));
      LIVE.mstats = Object.fromEntries((await qAll("site_model_stats")).map(m => [m.model, m]));
      LIVE.modelsOk = LIVE.models.length > 0;
    }catch(e){ LIVE.models = []; LIVE.mstats = {}; LIVE.modelsOk = false; }
    try{
      LIVE.mrisk = Object.fromEntries((await qAll("site_model_risk")).map(m => [m.model, m]));
    }catch(e){ LIVE.mrisk = {}; }
    // What applying the regime's multiplier would have cost and bought. Both proxies, because the
    // equity leg is the whole argument and the two baskets share only 8 of 25 names.
    try{
      LIVE.brake = Object.fromEntries((await qAll("site_brake_comparison")).map(b => [b.proxy, b]));
      LIVE.brakeOk = Object.keys(LIVE.brake).length > 0;
    }catch(e){ LIVE.brake = {}; LIVE.brakeOk = false; }
    // Market cap and the six factor percentiles for the active names (site_universe, 412 rows — one page).
    // Its own try: the Grid and Universe size/factor columns degrade to dashes with a stated reason, and
    // the rest of the page boots regardless. sunivNorm blanks a stored cap that cannot be a company.
    try{
      LIVE.suniv = Object.fromEntries((await qAll("site_universe")).map(u => [u.ticker, sunivNorm(u)]));
      LIVE.sunivOk = true;
    }catch(e){ LIVE.suniv = {}; LIVE.sunivOk = false; }
    LIVE.ranges = {};
    for(const r of await qAll("site_range_dynamics")) (LIVE.ranges[r.ticker] ||= {})[r.horizon] = r;
    // One row per name — small. The 24-vintage HISTORY is ~11,000 rows and is fetched per ticker
    // when a drawer opens, so the boot payload does not carry a series nobody is looking at.
    try{
      LIVE.funda = Object.fromEntries((await qAll("site_company_fundamentals")).map(r => [r.ticker, r]));
    }catch(e){ LIVE.funda = {}; }
    LIVE.fundaHist = {};
    try{
      LIVE.pipeline = Object.fromEntries((await q("site_pipeline_state")).map(r => [r.key, r]));
      renderPipeline();
    }catch(e){ LIVE.pipeline = {}; }
    LIVE.cards = Object.fromEntries((await qAll("site_company_card")).map(v => [v.ticker, v])); }
  catch(x){
    err.textContent = x.message === "no-access" ? "This account doesn't have access." : "Couldn't load data: " + (x.message||x);
    gateState("signin");      // the form comes back WITH the reason, never a blank loading screen
    document.getElementById("gate").hidden = false; document.getElementById("app").hidden = true; return;
  }
  document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false;
  boot();
  clearInterval(QUOTE_TIMER);
  QUOTE_TIMER = setInterval(async () => {
    if(document.hidden) return;
    // The drawer's open class is "on" (index.html:196), not "open" — so this guard was always
    // false and the 60-second tick re-routed underneath an open drawer, which closes it and
    // scrolls to top. Reading a holding for more than a minute meant losing your place.
    // Also skip while the page is hidden: a backgrounded tab does not need a re-render.
    try{
      await loadQuotes();
      const v = (location.hash||"#today").slice(1).split("/")[0];
      const drawerOpen = !!document.querySelector(".drawer.on");
      const filtering = document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName);
      // Only the holdings table depends on live quotes, and it redraws in its own box: a full
      // re-route scrolled a long tab back to the top every minute.

/* Uncertainty on a Sharpe-type ratio (statistical-analysis, 2026-11-17). An annualised Sharpe from n
   daily returns has standard error sqrt((1 + SR_d^2 / 2) * 252 / n) under independent returns (Lo,
   2002), where SR_d is the daily ratio. For this book, 0.48 over 277 days is +/- 0.95, a 95% range of
   roughly -1.4 to +2.3: nothing yet tells it apart from zero, and the KPI now says so rather than
   letting a bare 0.48 read as a finding. Fat tails and autocorrelation only WIDEN this, so it is a
   lower bound on the real uncertainty. Returns null on missing input; never a fabricated range. */
const ratioRange = (sr, n) => {
  if(sr == null || isNaN(sr) || !n || n < 20) return null;
  const srd = sr / Math.sqrt(252);
  const se = Math.sqrt((1 + srd * srd / 2) * 252 / n);
  return {lo: sr - 1.96 * se, hi: sr + 1.96 * se, se};
};
const rangeNote = (sr, n) => { const r = ratioRange(sr, n);
  return r ? `95% range ${num(r.lo,1)} to ${num(r.hi,1)}` : ""; };

const pctRaw = (v, d=0) => v==null||isNaN(v) ? "—" : (v>0?"+":"") + Number(v).toFixed(d) + "%";   // already-percent values
// Already-percent, no sign. A margin or a return on capital is not a change, so "+54%" reads wrong.
const pctFlat = (v, d=0) => v==null||isNaN(v) ? "—" : Number(v).toFixed(d) + "%";

// plural. Counts that cannot plausibly be 1 (trading days since inception) are left as they are.
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const num = (v, d=2) => v==null||isNaN(v) ? "—" : Number(v).toFixed(d);

// stored Yahoo's current-event date as "next" until 2026-11-18, so Overview listed reports a month
// past as "ahead". The writer is fixed; this keeps a past date from ever being shown as a forecast.
const _todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const erNext = d => (d && d >= _todayISO()) ? d : null;
const erCell = d => !d ? "—" : erNext(d) ? esc(d)
  : `<span class="muted" title="Last report ${esc(d)}; the next date has not been published">not set</span>`;
const usd = (v, d=0) => v==null||isNaN(v) ? "—" : "$" + Number(v).toLocaleString(undefined,{minimumFractionDigits:d, maximumFractionDigits:d});

 *
 * A BOX NOW MEANS ONE OF THESE EIGHT, and badge() is the only thing that draws one:

 * ⚠ BADGES IS A REGISTRY, like HEDGED_ETFS and ANON_READABLE. badge() throws on a set that is not

const BADGES = {

  thesis:  {INTACT: ["Intact", "ok"], WATCH: ["Watch", "warn"], REVIEW: ["Review", "bad"], BROKEN: ["Broken", "bad"],

            NOT_SHOWN: ["Not shown", "", "Tested, and the test did not support it"],

   backwards for one: size is scored as -ln(market cap), so size_pct 99 is among the SMALLEST names.

  {k:"momentum", label:"Momentum",  tip:"high = stronger risk-adjusted 12-1 and 12-month return"},
  {k:"quality",  label:"Quality",   tip:"high = higher ROIC and margins, lower net debt / EBITDA"},
  {k:"lowvol",   label:"Low vol",   tip:"high = LOWER beta and 12-month volatility, i.e. calm; not high volatility"},
  {k:"size",     label:"Smallness", tip:"high = SMALLER. The size factor is scored as -ln(market cap), so 99 is among the smallest names and 1 among the largest. Sort Mkt cap for literal size"},

/* Compare two rows against an ordered key list.
 * keyFn(row, k) returns a number, a string, or null for "no value".            */
function sortCompare(a, b, sortList, keyFn, finalTie){
  for(const {k, d} of sortList){
    const x = keyFn(a, k), y = keyFn(b, k);
    if(x == null && y == null) continue;
    if(x == null) return 1;                     // blanks always sink, whichever key
    if(y == null) return -1;
    // A key may return a TUPLE for a compound ordering -- Signals sorts timing as
    // [bucket, depth-in-range], which is one column the reader thinks of as one thing and the
    // sort has to treat as two. Compared element by element, first element wins.
    let c = 0;
    if(Array.isArray(x)){
      for(let i = 0; i < x.length && !c; i++){
        const xi = x[i], yi = y[i];
        if(xi == null && yi == null) continue;
        if(xi == null){ c = 1; break; }
        if(yi == null){ c = -1; break; }
        c = typeof xi === "string" ? xi.localeCompare(yi) : xi - yi;
      }
    } else {
      c = typeof x === "string" ? x.localeCompare(y) : x - y;
    }
    if(c) return c * d;
  }
  // The final tie-break is deliberately NOT multiplied by direction: it exists to make equal rows
  // land in a stable order, and a stable order that flips with the arrow is not one.
  return finalTie ? finalTie(a, b) : 0;
}

/* Sort a copy, so a caller's array is never reordered under it. */
function sortRows(rows, sortList, keyFn, finalTie){
  return rows.slice().sort((a, b) => sortCompare(a, b, sortList, keyFn, finalTie));
}

function sortHeadHTML(cols, sortList, extraClass){
  return cols.map(([k, label, , tip]) => {
    const at = sortList.findIndex(x => x.k === k), on = at >= 0;
    const arrow = on ? (sortList[at].d > 0 ? " ↑" : " ↓") : "";
    // the rank shows only when more than one key is active, so a single sort stays uncluttered
    const rank = on && sortList.length > 1 ? `<sup class="srank">${at + 1}</sup>` : "";
    const blk = extraClass ? extraClass(k) : "";

  }).join("");
}

/* Wire the header clicks. `get()` returns the current list, `set(list)` stores it — passed as

function bindSortHead(headId, cols, get, set, draw){
  document.querySelectorAll(`#${headId} th[data-sort]`).forEach(th => th.onclick = e => {
    const k = th.dataset.sort;
    // a new column opens best-first: highest for numbers, best rank or A-Z otherwise
    const num_ = (cols.find(c => c[0] === k) || [])[2] === "num";
    const list = get(), at = list.findIndex(x => x.k === k);

    } else {

    }

  });

  const lr = C_.map((c,i)=> i? Math.log(c/C_[i-1]) : 0);
  let m=0, v2=0; const sig=[];
  lr.forEach((r,i)=>{ m = 0.06*r + 0.94*m; v2 = 0.06*(r-m)*(r-m) + 0.94*v2; sig.push(Math.sqrt(v2)); });
  const sigS = ema(sig, 10);
  const vwma = (win) => C_.map((_,i) => { if(i<win-1) return null; let pv=0, vv=0;
    for(let j=i-win+1;j<=i;j++){ pv += C_[j]*V[j]; vv += V[j]; }
    return vv>0 ? pv/vv : C_.slice(i-win+1,i+1).reduce((a,b)=>a+b,0)/win; });
  const band = (win, hz, wgt, k, ms) => { const vw=vwma(win), e=ema(C_, ms), lo=[], hi=[], mid=[];
    for(let i=0;i<n;i++){ if(vw[i]==null || i<win){ lo.push(null); hi.push(null); mid.push(null); continue; }
      const mi = wgt*vw[i] + (1-wgt)*e[i], b = k*sigS[i]*Math.sqrt(hz);
      mid.push(mi); lo.push(mi*Math.exp(-b)); hi.push(mi*Math.exp(b)); }
    return {lo, hi, mid}; };
  const trade = band(15, 5, 0.25, 1.2, 10), trend = band(63, 21, 0, 1.0, 5);
  // AVWAP from the rolling 252-day low
  const avwap = C_.map((_,i) => { if(i<60) return null; const s0=Math.max(0,i-251);
    let lo=Infinity, li=s0; for(let j=s0;j<=i;j++) if(L[j]<lo){ lo=L[j]; li=j; }
    let pv=0, vv=0; for(let j=li;j<=i;j++){ pv += (H[j]+L[j]+C_[j])/3*V[j]; vv += V[j]; }
    return vv>0 ? pv/vv : null; });
  // RSI(14)
  const rsi=[]; let up=0, dn=0;
  for(let i=0;i<n;i++){ const d = i? C_[i]-C_[i-1] : 0; up = i? up + ((d>0?d:0)-up)/14 : 0; dn = i? dn + ((d<0?-d:0)-dn)/14 : 0;
    rsi.push(i<14 || dn===0 ? null : 100 - 100/(1+up/dn)); }
  // TD Sequential: setup 9 (close vs close[4]) and countdown 13 (close vs low/high[2])
  const tdB=[], tdS=[], buy9=[], sell9=[], buy13=[], sell13=[];
  let bc=-1, sc=-1;
  for(let i=0;i<n;i++){
    const b = i>=4 && C_[i] < C_[i-4] ? (tdB[i-1]||0)+1 : 0;
    const sl = i>=4 && C_[i] > C_[i-4] ? (tdS[i-1]||0)+1 : 0;
    tdB.push(b); tdS.push(sl); buy9.push(b===9); sell9.push(sl===9);
    if(b===9){ bc=0; sc=-1; } if(sl===9){ sc=0; bc=-1; }
    let b13=false, s13=false;
    if(i>=2){
      if(bc>=0 && C_[i] <= L[i-2]){ bc++; if(bc===13){ b13=true; bc=-1; } }
      if(sc>=0 && C_[i] >= H[i-2]){ sc++; if(sc===13){ s13=true; sc=-1; } }
    }
    buy13.push(b13); sell13.push(s13);
  }
  // LTF markers: T / B at 20-bar extremes with RSI confirmation, R on an RSI re-cross above its signal
  const sig9 = ema(rsi.map(v => v==null?50:v), 9);
  const thin = (arr) => arr.map((v,i) => v && !arr.slice(Math.max(0,i-5),i).some(Boolean));
  const rng = (i) => (H[i]-L[i]) || 1e-9;
  const top = [], bot = [], rev = [];
  for(let i=0;i<n;i++){
    const w = Math.max(0, i-19);
    const wb = Math.max(0, i-9);
    const hiMax = Math.max(...H.slice(w, i+1)), loMin = Math.min(...L.slice(wb, i+1));
    const p = (C_[i]-L[i]) / rng(i), r = rsi[i];
    top.push(r!=null && H[i] >= hiMax && r >= 60 && p < 0.5);
    bot.push(r!=null && L[i] <= loMin && r <= 50 && p > 0.5);
    const prevLow = i>=3 ? Math.min(rsi[i-1]??50, rsi[i-2]??50, rsi[i-3]??50) : 50;
    rev.push(i>0 && r!=null && r > sig9[i] && (rsi[i-1]??50) <= sig9[i-1] && prevLow < 45 && C_[i] > H[i-1]);
  }
  return {line, bull, trade, trend, avwap, rsi, td:{b:tdB, s:tdS, buy9, sell9, buy13, sell13},
          marks:{T:thin(top), B:thin(bot), R:thin(rev)}};
}

const MARK = {
  T:      {label:"T", color:"#ffb74d", above:true,  name:"Top"},
  B:      {label:"B", color:"#64b5f6", above:false, name:"Bottom"},
  R:      {label:"R", color:"#81c784", above:false, name:"Reversal"},
  sell9:  {label:"9", color:C.red, above:true,  name:"TD sell 9"},
  buy9:   {label:"9", color:C.green, above:false, name:"TD buy 9"},
  sell13: {label:"13", color:C.red, above:true, name:"TD sell 13"},
  buy13:  {label:"13", color:C.green, above:false, name:"TD buy 13"},
};

function earningsAvwap(bars, anchor){
  if(!anchor) return [];
  const i0 = bars.findIndex(b => b.d >= anchor);
  if(i0 < 0) return [];
  let pv = 0, vv = 0;
  return bars.map((b, i) => { if(i < i0) return null;
    pv += (b.h + b.l + b.c) / 3 * (b.v || 0); vv += (b.v || 0); return vv > 0 ? pv / vv : null; });
}

/* ── plain helpers for registry entries, so an entry stays one line where it can ─────────────
 * ⚠ THESE RECOMPUTE ON THE BARS ON SCREEN, WHICH IS THE POINT AND ALSO THE CAVEAT.
 * ic_technicals already stores a nightly sma20/ema35/macd/atr_pct/bb_width/hv20/obv_slope_20 per
 * name — but those are DAILY values, and this chart offers 2-day and weekly bars. A stored daily
 * MACD plotted against weekly candles is simply the wrong series. So the library recomputes, with
 * the same construction technical_engine.py uses (:95-158), and the trade is that a chart value
 * will not always equal the stored one: different window, and on D the chart's window is whatever
 * the timeframe fetched rather than the engine's full history. Every entry below says so.        */
const _sma = (arr, w) => arr.map((_, i) => i < w-1 ? null
  : arr.slice(i-w+1, i+1).reduce((a,b)=>a+b, 0) / w);
const _ema = (arr, span) => { const k = 2/(span+1); const o = [];
  arr.forEach((v, i) => o.push(i ? o[i-1] + k*(v - o[i-1]) : v)); return o; };
const _std = (arr, w) => arr.map((_, i) => { if(i < w-1) return null;
  const s = arr.slice(i-w+1, i+1), m = s.reduce((a,b)=>a+b,0)/w;
  return Math.sqrt(s.reduce((a,b)=>a+(b-m)*(b-m),0)/w); });
const _roc = (arr, w) => arr.map((v, i) => i < w || !arr[i-w] ? null : v/arr[i-w] - 1);
const _ON_SCREEN = "recomputed from the bars on screen — same construction as technical_engine, "
                 + "but a different window from the nightly daily value, and necessarily so: a "
                 + "stored daily figure cannot be plotted against 2-day or weekly bars.";

/* ── THE REGISTRY ───────────────────────────────────────────────────────────────────────────
 * pane   : "price" overlays the candles · any other key opens its own pane, created on demand
 * type   : "line" | "histogram"
 * multi  : the entry draws SEVERAL series under one toggle — compute returns
 *          [{vals, color, width, dash}]. A risk range is two lines the reader thinks of as one
 *          thing, and splitting it into two chips would let someone turn half a band on.
 * ctx    : {tk, v2} — the ticker and its technicals_v2 row, for anything anchored to a date the
 *          bars alone do not carry (the earnings VWAP needs earnings_anchor).
 * on     : whether it is drawn before the viewer touches anything
 * basis  : REQUIRED for anything that is not a direct arithmetic transform of these bars.
 *          Rendered into the chart's caption. See the header.                               */

     * ALSO carried a dedicated block drawing the same line twice more, green where bull and red

     * omitted points. The library honours a per-point `color` on LineData instead, so a line

     * entry so the chip shows no swatch; the data key's swatch follows the crosshair bar. */
    label: "Track line", pane: "price", width: 2.0, on: true, type: "line", multi: true,
    compute: (bars, S) => [{

    // open-source AlphaTrend toggle — belongs here in the source, not in a chart footnote.
    basis: "A 26-day EMA that flips after two closes beyond ±1.5 ATR, fitted to approximate a "
         + "third-party trend line. In backtests it did not separate drawdown risk, so it is "

  },
  avwap52: {
