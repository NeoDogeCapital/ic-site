/* ═══ VALUATION DURATION — per name (drawer) ═════════════════════════════
   Two different things sit in this block and the page says which is which. The DCF split is MODELLED
   (every name discounted at the same rate and faded to the same terminal growth). Rate beta is
   MEASURED (what the stock actually did against long Treasuries, with the market taken out). The split
   is one degree of freedom: measured 2026-10-14 over 395 names, spearman(visible share, implied FCF
   growth) = -1.0000 and spearman(visible share, +100bp shock) = +1.0000 exactly, share sd 2.7pp. So the
   level is never shown without its cross-sectional percentile, and the framing line quotes the live
   numbers rather than a frozen sentence — if the methodology changes and the three come apart, the
   page will say so instead of repeating a claim that stopped being true. */
function ordinalOf(n){
  const k = Math.round(+n), m = k % 100;
  return k + ((m >= 11 && m <= 13) ? "th" : ({1:"st", 2:"nd", 3:"rd"}[k % 10] || "th"));
}
function signedNum(x, d = 2){
  const t = Number(x).toFixed(d);
  return Number(t) === 0 ? (0).toFixed(d) : (x > 0 ? "+" : "") + t;     // never print "-0.00"
}
const pc1 = x => x == null || isNaN(x) ? "—" : (+x * 100).toFixed(1) + "%";
function qtile(sorted, p){
  if(!sorted.length) return null;
  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
// Rank correlation with AVERAGE ranks for ties: the names pinned at the solver's floor tie in both
// series, and ordinal ranks would manufacture a correlation below 1 out of nothing.
function spearman(xs, ys){
  if(xs.length < 3) return null;
  const rk = a => {
    const o = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]), r = new Array(a.length);
    for(let i = 0; i < o.length;){
      let j = i; while(j + 1 < o.length && o[j + 1][0] === o[i][0]) j++;
      for(let k = i; k <= j; k++) r[o[k][1]] = (i + j) / 2;
      i = j + 1;
    }
    return r;
  };
  const x = rk(xs), y = rk(ys), n = x.length;
  const mx = x.reduce((s_, v) => s_ + v, 0) / n, my = y.reduce((s_, v) => s_ + v, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for(let i = 0; i < n; i++){ sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
function vdurStats(){
  if(LIVE.vdurStats) return LIVE.vdurStats;
  const rows = Object.values(LIVE.vdur || {}).filter(v =>
    v.bond_floor_share != null && v.implied_fcf_cagr != null && v.shock_100bp != null);
  const sh = rows.map(v => +v.bond_floor_share), sorted = sh.slice().sort((a, b) => a - b);
  return LIVE.vdurStats = {
    n: rows.length, p5: qtile(sorted, .05), p95: qtile(sorted, .95),
    rhoGrowth: spearman(sh, rows.map(v => +v.implied_fcf_cagr)),
    rhoShock: spearman(sh, rows.map(v => +v.shock_100bp)),
  };
}

const SUBP = "font-size:var(--fs-md);margin-top:9px";
const RANK = p => p == null ? "" : `<small class="muted" style="font-size:var(--fs-sm)">${ordinalOf(p)} percentile</small>`;
// WHY a name is absent from the DCF set. The sentence is stored by valuation_duration.py for the current

// a currency mismatch (ATAT, HTHT, ZTO report CNY; BIRK, SRAD, SPOT report EUR — all had both), negative
// FCF, a missing balance sheet, and a price so extreme the solver gives up, which is a reading and not
// a failed fetch. This function only chooses the words for the case where nothing was stored.
function vdurWhy(tk){
  const s_ = (LIVE.vskips || {})[tk];
  if(s_) return {code: s_.reason_code, text: s_.reason};

}
// A name refused for its currency never had a trustworthy row: every stored run set a local-currency

function vdurFxRefused(tk){

// WHY a name has no rate beta (site_rate_beta_gaps). Two unrelated groups: micro-sleeve names are left out

    <polyline points="${asc.map(r => X(r) + "," + Y(+r.rate_beta)).join(" ")}" fill="none" stroke="${C.accent}"

  const [lbl, tip] = qgsWhy(r, true);
  return `<td class="muted" title="${esc(tip)}">${esc(lbl)}</td>`;
}
function gridKey(r, k){
  if(k === "qgs") return qgsShown(r);
  if(k === "gbg") return gbgSortKey(r.ticker, "D");          // null when there is no reading, so it sinks
  if(k === "gbg_w") return gbgSortKey(r.ticker, "W");
  if(k === "gbg_flip") return gbgBars(r.ticker);
  if(k === "grade") return GRADE_ORD[r.grade] ?? 9;
  if(k === "tech_rating") return TECH_ORD[r.tech_rating] ?? 9;
  if(k === "timing") return TIMING_ORD[r.timing] ?? 9;
  if(k === "action") return ACTION_ORD[r.action] ?? 99;
  if(k === "list_action") return LIST_ORD[r.list_action] ?? null;      // null sinks: not held, not on the list
  if(k === "list_rank") return r.list_rank == null ? null : +r.list_rank;
  if(k === "qgs_tier") return QGS_ORD[r.qgs_tier] ?? 9;
  // Quadrant fell through to the string branch below, where `?? ""` made a MISSING quad an empty
  // string rather than null -- so unquadded names floated to the TOP of an ascending sort instead
  // of sinking like every other blank. QUAD_ORD is EV rank (Q1 best), which the digits happen to
  // match lexically; the fix here is the null, not the order.
  if(k === "quadrant") return QUAD_ORD[r.quadrant] ?? null;
  if(k === "composite" || k === "range_pos" || k === "p1" || k === "p2" || k === "p3"
     || k === "grade_score" || k === "qgs_rank" || k === "qgs_universe_rank" || k === "quad_score")
    return r[k] == null ? null : +r[k];
  // the price's required FCF growth. Sorted descending it ranks the most demanding prices first.
  if(k === "implied_cagr"){
    const v = (LIVE.vdur[r.ticker]||{}).implied_fcf_cagr; return v == null ? null : +v; }
  // share of value inside the horizon (DECIMAL). Rank-identical to implied growth, reversed.
  if(k === "vis_pct"){
    const v = (LIVE.vdur[r.ticker]||{}).bond_floor_share; return v == null ? null : +v; }
  if(k === "rate_beta"){
    const v = (LIVE.rbeta[r.ticker]||{}).rate_beta; return v == null ? null : +v; }
  // size and factors: null when the name has no row or the value is blank, so blanks sink on either direction
  if(k === "mcap"){ const u = LIVE.suniv[r.ticker]; return u && u.market_cap != null ? +u.market_cap : null; }
  if(k.startsWith("f_")){ const u = LIVE.suniv[r.ticker], v = u ? u[k.slice(2) + "_pct"] : null; return v == null ? null : +v; }
  return (r[k] ?? "").toString().toLowerCase();
}

// core factor cross-section, so those names are dashes by design and the tooltip says so.

async function grid(el){

    document.getElementById("gridRows").innerHTML = shown.map(r => {
      const u = LIVE.suniv[r.ticker] || null, tag = r.universe_tag;
      const cell = {
        ticker: `<td><b>${esc(r.ticker)}</b>${r.held ? " " + word("held", "dim lbl") : ""}</td>`,
        grade: `<td title="${esc(r.grade_reason || "")}">${r.grade}</td>`,
        grade_score: `<td title="${esc(r.grade_score == null && r.grade_reason ? String(r.grade_reason).split(";")[0] : r.grade_basis || "")}">${r.grade_score == null ? "—" : num(r.grade_score, 0)}</td>`,
        qgs: qgsCell(r), qgs_universe_rank: qgsRankCell(r),

        quad_score: `<td>${r.quad_score == null ? "—" : num(r.quad_score, 0)}</td>`,
        tech_rating: `<td>${esc(techLbl(r.tech_rating))}</td>`,
        gbg: `<td>${gbgCell(r.ticker, "D")}</td>`, gbg_w: `<td>${gbgCell(r.ticker, "W")}</td>`,
        gbg_flip: `<td>${gbgFlipCell(r.ticker)}</td>`,
        action: `<td><span style="color:${ACT_COL[r.action]||C.text}">${esc(codeLbl("action", r.action))}</span></td>`,
        list_rank: `<td>${r.list_rank == null ? `<span class="muted" title="${esc(r.veto_reason ? "Held down by a veto" : "No QGS rank, or not a core name")}">—</span>` : r.list_rank}</td>`,
        list_action: `<td>${actionBadge(r.list_action, r.veto_reason)}${r.list_defer ? ` <span class="muted" style="font-size:var(--fs-xs)" title="A new position waits while the name is in a 200-day downtrend">waiting</span>` : ""}</td>`,
        veto_reason: clip(r.veto_reason, 220),
        timing: `<td>${timingWord(r.timing, r.range_pos)}</td>`,
        range_pos: `<td>${rangeBand(r.trade_low, r.trade_high, r.range_pos, r.timing)}</td>`,
        guidance: clip(r.guidance, 260),
        quadrant: `<td title="${esc(codeLbl("quad", r.quadrant))}">${esc(r.quadrant||"—")}</td>`,
        qgs_tier: `<td>${esc(codeLbl("qgs_tier", r.qgs_tier))}</td>`,

        p1: `<td>${pillarCell(r, "p1")}</td>`, p2: `<td>${pillarCell(r, "p2")}</td>`, p3: `<td>${pillarCell(r, "p3")}</td>`,
        implied_cagr: `<td>${impliedCell(r.ticker)}</td>`, vis_pct: `<td>${visCell(r.ticker)}</td>`,
        rate_beta: `<td>${rateCell(r.ticker)}</td>`,
        trend: `<td>${trendWord(r.trend)}</td>`,
        sector: clip(r.sector, 190),

        f_profile: `<td class="muted" style="font-size:var(--fs-sm)">${esc(profileLabel((u||{}).factor_profile))}</td>`,
        mcap: `<td class="fac fb0">${capCell(u, tag)}</td>`,
        // Monitor view: the last column absorbs what is left of the card (width:100% + max-width:0 is
        // the table idiom for "fill, then clip"), so the eleven columns fit without a sideways scroll.
        grade_reason: gAllCols ? clip(r.grade_reason, 300)
          : `<td class="muted clip" style="width:100%;max-width:0" title="${esc(r.grade_reason || "")}">${esc(r.grade_reason || "")}</td>`,
      };
      FACTORS.forEach(f => { cell["f_" + f.k] = `<td class="fac">${facCell(u, f, tag)}</td>`; });
      return `<tr data-open="${r.ticker}" tabindex="0" style="cursor:pointer">${cols.map(([k]) => cell[k] ?? "<td>—</td>").join("")}</tr>`; }).join("");
    // Header and row are built from two lists and had drifted before (a cell added without its header
    // renders every column to its right under the wrong name). Say so loudly if it happens again.
    { const first = document.querySelector("#gridRows tr");
      if(first && first.children.length !== cols.length)

    // The count used to read the full row count while the table rendered only the first 400, so 56
    // names — under the default grade sort, the tail of the D grades — were invisible with nothing

    const nMicro = rows.filter(r => r.universe_tag === "micro").length;

    document.getElementById("gridHead").innerHTML = sortHeadHTML(cols, gridSort,

    bindSortHead("gridHead", GRID_COLS, () => gridSort, l => { gridSort = l; }, draw);

                   l => { gridSort = l; }, draw);
    document.querySelectorAll("#gridRows tr[data-open]").forEach(tr => tr.onclick = () => openName(tr.dataset.open));
  };
  el.innerHTML = `<div class="sub" style="margin:-8px 0 14px">as of ${M[0]?.as_of||"—"} · every tracked name, in QGS rank order</div>` +
    card("Grade × technical grid (V13)", "still computed each night, no longer the decision path · names per cell · click a cell to filter the table on that action", `<div class="table-wrap"><table class="tbl"><thead><tr><th>Grade</th>${techs.map(t=>`<th>${techLbl(t)}</th>`).join("")}</tr></thead><tbody>${
      grades.map(g => `<tr><td><b>${g}</b></td>${techs.map(t => { const c = cell(g,t); const a = c[0]?.action || "";
        return `<td data-act="${a}" style="cursor:pointer"><div style="color:${ACT_COL[a]||C.muted}">${esc(codeLbl("action", a))}</div><div class="muted">${c.length} · ${c.filter(r=>r.held).length} held</div></td>`; }).join("")}</tr>`).join("")
    }</tbody></table></div>`) +
    `<div style="margin-top:16px">` + card("Names", `<span id="gridN"></span>`,
      (() => {
        const ORD = {GRADE_ORD, TECH_ORD, TIMING_ORD, ACTION_ORD, QGS_ORD, GBG_ORD, LIST_ORD};
        const n = activeFilterCount();
        const controls = GRID_COLS.map(([key, label, type]) => {
          const ctl = colControl(key, type, M);

          return `<label class="fsel"><span>${label}</span>

        }).join("");
        return `<div class="filters">
          <input class="search" id="gq" placeholder="Search any text" value="${esc(gridFilter.q)}">

          ${n ? `<button class="lock" id="gclear">Clear all</button>` : ""}
          <button class="lock" id="gcols" aria-pressed="${gAllCols}" title="Off: ${GRID_MONITOR.length} columns, ordered by evidence. On: all ${GRID_COLS.length}, adding the technical rating, the V13 grid action, timing, the risk range, guidance, quad, QGS and its tier, implied growth, visible share, rate beta, sector, alignment, factor profile, size, the six factors and the three trend-state columns">All columns</button>
          <span class="muted" id="sortNote" style="font-size:var(--fs-sm);margin-left:auto"></span>
        </div>
        <div class="filters colfilters" ${gridFilterOpen ? "" : "hidden"}>${controls}</div>`;
      })() +
      `<div class="note" style="margin-bottom:6px">Click any row for the chart. Every column can be filtered and sorted whether or not it is shown.
         Factor columns are percentiles, 0–100, high = more of the factor; <b>Smallness high means small</b>, Low vol high means calm. Micro-sleeve names are not scored (dash).</div>
       <div class="table-wrap gridwrap"><table class="tbl stickfirst dense"><thead><tr id="gridHead"></tr></thead><tbody id="gridRows"></tbody></table></div>`) + `</div>`;
  // This set gridFilter.act, but matchesFilters iterates GRID_COLS where the key is "action" — so
  // nothing read it and clicking a cell silently did nothing, while the filter badge counted it as
  // an active filter. Set the key the filter actually uses, and re-render so the dropdown shows it.
  el.querySelectorAll("td[data-act]").forEach(td => td.onclick = () => {

    grid(el); };
  // Dropdowns and number boxes re-render the view so their own state persists; free-text boxes
  // redraw only the rows, so typing does not lose focus mid-word.
  GRID_COLS.forEach(([key, , type]) => {

      else e2.oninput = ev => { gridFilter[key] = ev.target.value; draw(); };
    }
  });
  const gc = document.getElementById("gclear");
  if(gc) gc.onclick = () => { gridFilter = {q:"", held:false}; grid(el); };
  draw();
}

async function anLoad(){

  // The rate-beta median is over the decision grid's stocks (a guard: ic_rate_beta held ETFs until

    LIVE.benchPx = {}; rows.forEach(r => (LIVE.benchPx[r.ticker] ||= {})[r.price_date] = +r.adj_close);
  }

// RANGE TOGGLES ON BOTH FRAGILITY CHARTS (Niko, 2026-11-04).
//
// The cutoff is derived from the LAST DATE IN THE SERIES, never from the clock — the same rule the
// paper-trading toggle uses. These series are written by post-close, so on any morning before it
// runs the newest row is yesterday's; a clock-derived "QTD" on 1 October would start the window
// after every row and draw nothing.
//
// Each chart keeps its OWN selection rather than sharing one control, because the two series have
// nothing like the same depth: ic_market_regime holds 1,404 rows back to 2021-04-06, while
// ic_portfolio_fragility holds 9, from 2026-10-22. One shared window would make whichever chart it
// did not suit useless.
let mfiRange = "qtd", pfiRange = "qtd";
const FRAG_RANGES = [["1m","1M"], ["qtd","QTD"], ["ytd","YTD"], ["all","All"]];
function fragCutoff(lastDate, key){
  if(!lastDate) return "0000-01-01";
  // UTC setters, not local ones. `new Date("2026-11-04")` parses as UTC midnight while setMonth()
  // reads and writes LOCAL components, so west of Greenwich the date is already the 3rd before the
  // month is decremented and a "1M" window from 2026-11-04 came out at 2026-10-03. Immaterial to a
  // chart, wrong by a day in a figure someone might read back.
  if(key === "1m"){ const d = new Date(lastDate + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0,10); }
  if(key === "qtd"){
    const m = +lastDate.slice(5,7);
    return `${lastDate.slice(0,4)}-${String(3 * Math.floor((m - 1) / 3) + 1).padStart(2,"0")}-01`;
  }
  if(key === "ytd") return lastDate.slice(0,4) + "-01-01";
  return "0000-01-01";
}
// The buttons, plus an honest note about what the window is actually showing. Three buttons that
// all draw the same nine points would read as a broken toggle rather than as a short history, so
// the note says when a window is showing the entire series.
const LIVE_FRAG_TOTAL = {}, LIVE_FRAG_FIRST = {};
function fragBtns(sel, attr, shown, lastDate){
  const btns = FRAG_RANGES.map(([k,l]) =>
    `<button class="lock" data-${attr}="${k}"${sel===k?' style="border-color:var(--brand);color:var(--text)"':""}>${l}</button>`).join(" ");
  const full = LIVE_FRAG_TOTAL[attr] || shown, first = LIVE_FRAG_FIRST[attr] || "";
  const note = (shown >= full)
    ? `the whole series — ${full} point${full===1?"":"s"}${first ? " from " + esc(first) : ""}`
    : `${shown} of ${full} points`;
  return `${btns} <span class="muted" style="margin-left:8px">· ${note}, to ${esc(String(lastDate))}</span>`;
}

/* ═══ COMPOSED TABS ══════════════════════════════════════════════════════
   A section is just another view rendered into an appended div. Every one is wrapped so a single
   failing section degrades to a named message instead of taking the tab with it — the sections
   read different Supabase views and any one of them can be the thing that is missing. */
async function section(el, title, fn, right="", ownHead=false){
  // THE BOX IS APPENDED BEFORE fn RUNS, and fn writes into it directly. Building the HTML in a
  // detached div and copying innerHTML across looks equivalent and is not: every one of these views
  // sets innerHTML and then calls mk() to draw its charts by element id, so the chart would bind to
  // a node that never reaches the document and the card would render as an empty box. The header is
  // its own sibling element because fn overwrites whatever is in its own.
  // ownHead: the view writes its own heading (it needs its toggle or as-of in it), so the wrapper
  // must not add a second one. Risk carried "Risk engine — equity sleeve only" directly above a
  // second "Risk", and "Factor exposure & concentration" above "Factors & concentration".
  if(!ownHead){ const h = document.createElement("div"); h.innerHTML = sectionHead(title, right); el.appendChild(h); }
  const box = document.createElement("div"); el.appendChild(box);
  try{ await fn(box); }
  catch(e){ box.innerHTML = `<div class="note">${esc(title)} unavailable: ${esc(e.message||e)}</div>`; }
  return box;
}
/* ═══ THE MODEL OF MODELS ════════════════════════════════════════════════
   Integrity Compounders is the EQUITY input to two client portfolios; the rest is Defensive Core
   (CSHI 30 / QDSIX 20 / BDMIX 20 / LCTIX 20 / cash 10). Every statistic here is on the DRIFTED

let modelSel = "Focused Compounders";
// Since inception is the default because it is the whole record: the book's first daily return is
// 2025-10-13 and nothing in this system predates it, so "inception" and "the entire history" are

const MPERIODS = [["since_inception","Since inception"],["ytd","YTD"],["qtd","QTD"],["mtd","MTD"]];
const MODEL_ORDER = ["Focused Compounders","Balanced Compounders","Integrity Compounders","Defensive Core"];

     </div>
     <div class="chart" id="mChart"></div>
     ${tbl(["", ...names.map(n => n.replace(" Compounders",""))],

     <div class="note" style="margin-top:10px">
      <b>Drift is real, not an approximation.</b> ${dc ? `Defensive Core was set at

      and has drifted to ${Object.entries(dcd).map(([k,v])=>`${esc(k)} ${(v*100).toFixed(1)}%`).join(" · ")}` : ""}.
      There were no mass rebalances, so each sleeve compounded independently from the anchor and the
      model's daily return is value-weighted on the PREVIOUS day's values. Rebalancing monthly

      <br><br><b>Cash earns the 13-week bill</b>, not zero — at 4-5% that is roughly 0.45% a year on

/* ── THESIS WATCH: is anything this thesis said to watch actually happening? (db/083) ──────────
 * scripts/thesis_watch.py reads every holding's locked thesis each night and gives one verdict
 * per risk and per sell condition, with the evidence it rests on. The status here is COMPUTED
 * from those verdicts (engines/thesis_watch.py) and never says "broken": that is a person's call.
 * ⚠ THREE THINGS THAT MUST NOT LOOK LIKE "FINE": a row that failed to load ("?"), a name the
 * monitor has no row for, and "could not assess" — which is the answer whenever the evidence had
 * nothing bearing on an item, and is shown in its own colour rather than left blank. */
const TV_LBL = {NOT_TRIGGERED: "Not triggered", APPROACHING: "Approaching", TRIGGERED: "Triggered", CANNOT_ASSESS: "Could not assess"};
const _twColor = v => v === "TRIGGERED" ? C.red : v === "APPROACHING" ? C.amber : v === "NOT_TRIGGERED" ? C.green : C.muted;
function watchBadge(tk){
  if(LIVE.twatchOk === false) return badge("fresh", "UNKNOWN", {title: "The thesis-watch rows did not load, so this is unknown"});
  const w = (LIVE.twatch || {})[tk];
  if(!w) return `<span class="muted" title="Not a holding, or not read yet: the monitor reads held names only">—</span>`;
  const inv = (w.invalidation_met || []).length;
  return badge("thesis", w.status, {title: w.assessed + " of " + w.items + " items assessed · as of " + w.as_of,
    text: esc((BADGES.thesis[w.status] || [w.status])[0]) + (inv ? " · sell condition met" : "")});
}
function thesisWatchBlock(tk, compact = false){
  const w = (LIVE.twatch || {})[tk];
  if(!w) return "";
  const ev = Object.fromEntries((w.evidence || []).map(e => [e.id, e]));
  const cite = ids => (ids || []).map(i => `<span class="mono" style="border-bottom:1px dotted ${C.muted};cursor:help" title="${
    esc(ev[i] ? (ev[i].date ? "[" + ev[i].date + "] " : "") + ev[i].text : "not in the stored evidence")}">${esc(i)}</span>`).join(" ");
  const rows = (w.results || []).map(r => [
    `<span class="mono">${esc(r.id)}</span>`,
    `<div>${esc(r.text)}</div>` + (r.kind === "risk" && r.trigger ? `<div class="muted" style="font-size:var(--fs-xs)">Trigger: ${esc(r.trigger)}</div>` : ""),
    `<b style="color:${_twColor(r.verdict)};white-space:nowrap">${esc(TV_LBL[r.verdict] || r.verdict)}</b>`,
    `${esc(r.reading || "")}${r.note ? `<div class="muted" style="font-size:var(--fs-xs)">${esc(r.note)}</div>` : ""}`,
    cite(r.evidence)]);
  const inv = (w.invalidation_met || []);
  /* THE LATCHED SELL CONDITIONS (db/085): what actually reaches the grade. The nightly verdict
   * above it comes and goes with the news window; a condition assessed as met stays here until a
   * person confirms or dismisses it, and the line says what it is doing to the grade meanwhile. */
  const latched = ((LIVE.tsell || {})[tk] || []).filter(s => s.thesis_version === w.thesis_version);

function thesisBlock(tk, full=false, compact=false){

  const plain = plainBlock(t, docState, compact);
  // The plain version is what people read; the full Catalyst · Edge · Risk record is the process
  // document (every risk carries a watch metric and a trigger) and sits behind a toggle.
  const li = a => (a||[]).map(x => `<li>${esc(x)}</li>`).join("");
  const detail = `<div class="sec">
    ${t.theme ? `<div class="caps" style="margin:4px 0 8px">${esc(t.theme)}</div>` : ""}
    ${t.business ? `<p class="muted">${esc(t.business)}</p>` : ""}

    <h4 style="margin-top:10px">Edge — why this company</h4><p>${esc(t.edge?.summary)}</p>
    <ul class="list">${(t.edge?.vs_peers||[]).map(v => `<li><b>vs ${esc(v.peer)}:</b> ${esc(v.advantage)}</li>`).join("")}</ul>
    <h4 style="margin-top:10px">Risks — what would break it</h4>
    ${tbl(["Risk","Type","Watch","Trigger"], (t.risks||[]).map(r => [esc(r.risk), esc(r.category), esc(r.watch), esc(r.trigger)]))}
    <h4 style="margin-top:10px">Sell if</h4><ul class="list">${li(t.invalidation)}</ul>
    ${(t.upcoming||[]).length ? `<h4 style="margin-top:10px">Upcoming</h4><ul class="list">${(t.upcoming||[]).map(u => `<li>${esc(u.date)} — ${esc(u.event)}</li>`).join("")}</ul>` : ""}
    <h4 style="margin-top:10px">Model view</h4><p class="muted">${esc(t.model_view)}</p>
    <h4 style="margin-top:10px">Evidence</h4><ul class="list">${(t.evidence||[]).map(e => `<li><span class="muted">${esc(e.date)} · ${esc(e.source)}</span> — ${esc(e.fact)}</li>`).join("")}</ul>
    ${(t.open_questions||[]).length ? `<h4 style="margin-top:10px">Open questions</h4><ul class="list">${li(t.open_questions)}</ul>` : ""}
  </div>`;
  const watch = thesisProposalBlock(tk) + thesisWatchBlock(tk, compact);
  if(!plain) return watch + detail.replace('<div class="sec">', `<div class="sec"><h4>Thesis ${docState}</h4>`);
  return watch + plain + `<details class="thesis-full"${full?"":""}><summary>Full research record — sources, risk triggers, model view</summary>${detail}</details>`;

/* A PROPOSED THESIS REVISION (db/088, scripts/thesis_analyst.py). A model drafted it; it is NOT the
 * thesis. It is shown above the thesis it would replace, as a list of what it changes, and it
 * becomes the thesis only when a person runs `run.py thesis accept`. A recent ruling is shown too,
 * so "accepted" and "rejected" leave a trace on the page where the question was asked. */
function thesisProposalBlock(tk){
  const all = (LIVE.tprop || {})[tk] || [];
  const p = all.find(x => x.status === "PROPOSED"), last = all.find(x => x.status === "ACCEPTED" || x.status === "REJECTED");
  const txt = v => v == null ? "" : typeof v === "string" ? esc(v) : Object.entries(v).map(([k, x]) => `<b>${esc(k)}:</b> ${esc(x)}`).join(" · ");
  const ruled = last ? `<p class="muted" style="font-size:var(--fs-sm)">Last ruling: a revision drafted against version ${last.based_on_version} was
      <b>${last.status === "ACCEPTED" ? "accepted as version " + last.accepted_version : "rejected"}</b> on ${esc(String(last.resolved_at || "").slice(0, 10))}${last.resolved_note ? ": " + esc(last.resolved_note) : ""}.</p>` : "";
  if(!p) return ruled ? `<div class="sec">${ruled}</div>` : "";
  const kinds = k => (p.checks || {})[k] || ["none"];
  const blind = Object.keys(p.checks || {}).filter(k => k[0] === "I" && kinds(k).join() === "none");
  return `<div class="sec" style="border-left:3px solid ${C.amber};padding-left:12px">
    <h4>A revision is proposed ${word("· not the thesis", "warn")}</h4>
    <p class="muted" style="font-size:var(--fs-sm)">Drafted ${esc(String(p.created_at).slice(0, 10))} by the thesis analyst against version ${p.based_on_version}.
      The thesis below is unchanged until a person accepts this: <span class="mono">python run.py thesis accept ${esc(tk)} "why"</span> (or <span class="mono">reject</span>).</p>
    ${p.rationale ? `<p><b>Why:</b> ${esc(p.rationale)}</p>` : ""}
    ${(p.notes || []).length ? `<p class="amber" style="font-size:var(--fs-sm)">${(p.notes || []).map(esc).join(" · ")}</p>` : ""}
    <details><summary>${(p.changes || []).length} change(s) against the current thesis</summary>
      ${tbl(["Part", "Change", "Was", "Would be"], (p.changes || []).map(c => [esc(c.part), esc(c.change), txt(c.before) || `<span class="muted">—</span>`, txt(c.after) || `<span class="muted">—</span>`]))}</details>
    <details><summary>The draft's ${p.draft.risks.length} risks and ${p.draft.invalidation.length} sell conditions, and what could check each nightly</summary>
      ${tbl(["", "Item", "Watch · trigger", "Checkable from"], [
        ...p.draft.risks.map((r, i) => [`R${i + 1}`, esc(r.risk), `${esc(r.watch)}<div class="muted">${esc(r.trigger)}</div>`, esc(kinds(`R${i + 1}`).join(", ").replaceAll("_", " "))]),
        ...p.draft.invalidation.map((x, i) => [`I${i + 1}`, esc(x), `<span class="muted">sell condition</span>`,
           kinds(`I${i + 1}`).join() === "none" ? `<span class="amber">nothing collected nightly</span>` : esc(kinds(`I${i + 1}`).join(", ").replaceAll("_", " "))])])}</details>
    ${blind.length ? `<p class="muted" style="font-size:var(--fs-sm)">${blind.length} sell condition(s) (${blind.join(", ")}) could not be checked from anything collected nightly; "no sell condition met" would not cover them.</p>` : ""}
    ${ruled}</div>`;
}

  catch(e){ LIVE.tsell = {}; }

    })() +

// The two duration L/S books as they were actually LOCKED: how many names each side they share. Read from the locked
// positions rather than written into the page, so it stays true after the next monthly lock. null if unavailable.
async function paperDurationOverlap(){
  try{
    const ids = ["ls_visible_vs_terminal", "ls_rate_duration"];
    const rows = await qAll("site_paper_positions", r => r.in("strategy", ids).order("strategy").order("rebalance_date").order("ticker"));
    const latest = {}, book = {};
    rows.forEach(r => { if(!latest[r.strategy] || r.rebalance_date > latest[r.strategy]) latest[r.strategy] = r.rebalance_date; });
    rows.forEach(r => { if(r.rebalance_date === latest[r.strategy]) (book[r.strategy] ||= {})[r.ticker] = +r.weight; });
    const a = book[ids[0]], b = book[ids[1]];
    if(!a || !b) return null;
    const o = {both_long:0, both_short:0, vis_long_rate_short:0, vis_short_rate_long:0, dates:[...new Set(ids.map(i => latest[i]))].sort()};
    Object.keys(a).forEach(t => {
      if(!(t in b)) return;
      if(a[t] > 0 && b[t] > 0) o.both_long++; else if(a[t] < 0 && b[t] < 0) o.both_short++;
      else if(a[t] > 0) o.vis_long_rate_short++; else o.vis_short_rate_long++;
    });
    return o;
  }catch(e){ return null; }
}

async function paperCard(el){
  let rows;
  try{ rows = await qAll("site_paper_nav", r => r.order("nav_date").order("strategy")); }   // (nav_date, strategy) is unique: with only nav_date, ties let a page boundary drop or repeat rows
  catch(e){ el.innerHTML = card("Paper trading · every strategy", "could not be loaded", gapBox("The paper record did not load.", e.message || String(e))); return; }
  if(!rows.length){ el.innerHTML = card("Paper trading · every strategy", "empty", gapBox("The paper record has no rows.", "This is an empty table, not a strategy with no return.")); return; }
  const all = {}; rows.forEach(r => (all[r.strategy] ||= []).push(r));
  const lastDate = rows.reduce((a, r) => r.nav_date > a ? r.nav_date : a, "");
  // Anything in the data the registry does not know is shown, never silently dropped.
  const groups = PAPER_GROUPS.slice();
  const unlabelled = Object.keys(all).filter(k => !(k in PAPER_LABEL)).sort();
  unlabelled.forEach((k, i) => { PAPER_LABEL[k] = k + " (unlabelled)"; PAPER_COL[k] = PAPER_FALLBACK_COL[i % PAPER_FALLBACK_COL.length]; });
  if(unlabelled.length) groups.push({id:"other", name:"Unlabelled", refs:["spy"], keys:unlabelled});
  const avail = groups.filter(g => g.keys.some(k => all[k]));
  if(!avail.some(g => g.id === paperGroup)) paperGroup = (avail[0] || groups[0]).id;
  const overlap = avail.some(g => g.id === "duration") ? await paperDurationOverlap() : null;
  const cutoff = () => {
    // Every boundary is derived from lastDate, the newest NAV in the data, NOT from today's clock.
    // A paper NAV is only marked when paper_tracker runs, so on a day the chain has not run yet —
    // or the morning after a quarter turns — a clock-derived QTD would start a window the data has
    // no marks in and the chart would read empty rather than "not marked yet".
    if(paperRange === "qtd"){
      const m = +lastDate.slice(5,7);
      return `${lastDate.slice(0,4)}-${String(3 * Math.floor((m - 1) / 3) + 1).padStart(2,"0")}-01`;
    }
    if(paperRange === "ytd") return lastDate.slice(0,4) + "-01-01";
    if(paperRange === "1y"){ const d = new Date(lastDate); d.setFullYear(d.getFullYear()-1); return d.toISOString().slice(0,10); }
    return "0000-01-01";
  };
  const box = document.createElement("div"); box.style.marginTop = "16px"; el.appendChild(box);

  const draw = () => {
    const grp = avail.find(g => g.id === paperGroup);
    const view = [...grp.keys, ...grp.refs.filter(k => !grp.keys.includes(k))].filter(k => all[k]);
    // A view of young books starts at the first of them, not at the references' first day: Universe EW and SPY run from
    // January, and drawn from there the new books would sit as a few dots at the far right of an empty chart.
    const firstOf = k => all[k][0].nav_date;
    const born = ["model", "other"].includes(grp.id) ? "0000-01-01" : grp.keys.filter(k => all[k]).map(firstOf).sort()[0];
    const from = [cutoff(), born].sort().pop();
    const by = {};
    view.forEach(s => { const w = all[s].filter(r => r.nav_date >= from); if(w.length) by[s] = w; });
    const days = [...new Set(Object.values(by).flat().map(r => r.nav_date))].sort();
    const start_ = days[0], liveDays = days.filter(d => d >= PAPER_LIVE_FROM).length;
    const spyAt = d => { const r = (by.spy||[]).filter(x => x.nav_date <= d).slice(-1)[0]; return r ? +r.nav : null; };
    const rf = (D.perf && D.perf.rf_mean) || 0;
    const sharpe = ser => {
      const r = ser.map(x => x.daily_return).filter(v => v != null).map(Number);
      if(r.length < 20) return null;
      const m = r.reduce((a,b)=>a+b,0) / r.length;
      const sd = Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0) / (r.length-1));
      return sd > 0 ? (m*252 - rf) / (sd*Math.sqrt(252)) : null;
    };
    const stats = view.filter(s => by[s]).map(s => {
      const first = by[s][0], last = by[s].slice(-1)[0];
      const ret = +last.nav / +first.nav - 1;
      const s0 = spyAt(first.nav_date), s1 = spyAt(last.nav_date);
      const bench = s0 && s1 ? s1 / s0 - 1 : null;
      const sh = sharpe(by[s]);
      return [`<span title="${esc(PAPER_TIP[s] || "")}"><span style="color:${PAPER_COL[s]}">&#9679;</span> ${esc(PAPER_LABEL[s])}</span>`,
              `<span class="muted" style="font-size:var(--fs-sm)">${first.nav_date}</span>`,
              pct(ret), s === "spy" || bench == null ? "—" : pct(ret - bench),
              sh == null ? `<span class="muted" title="needs 20 daily observations">${by[s].length}d</span>` : num(sh, 2)];
    });
    const btn = (k, label) => `<button class="lock" data-range="${k}"${paperRange===k?' style="border-color:var(--brand);color:var(--text)"':""}>${label}</button>`;
    const gbtn = g => `<button class="lock" data-group="${g.id}"${paperGroup===g.id?' style="border-color:var(--brand);color:var(--text)"':""}>${esc(g.name)}</button>`;
    const span = grp.id === "model"
      ? `since ${start_} · ${plural(days.length,"trading day")} · <b>proxy</b> grade to ${PAPER_REAL_FROM}, <b>model snapshots</b> to ${PAPER_LIVE_FROM}, <b>live</b> for the ${plural(liveDays,"day")} since`
      : `since ${start_} · ${days.length} trading day${days.length === 1 ? "" : "s"}`
          + (grp.id === "process" ? " · forward-locked, nothing reconstructed" : start_ < "2026-10-16" ? " · reconstructed before 2026-10-16" : " · forward-locked");
    const noteHtml = grp.id === "other"
      ? `<b style="color:var(--text)">${unlabelled.length} strateg${unlabelled.length === 1 ? "y has" : "ies have"} no label registered in this page</b> (${unlabelled.map(esc).join(", ")}) and
         ${unlabelled.length === 1 ? "is" : "are"} shown by key. Add ${unlabelled.length === 1 ? "it" : "them"} to PAPER_LABEL, PAPER_COL and PAPER_GROUPS in build_live.py.`
      : PAPER_NOTES[grp.id](overlap);
    box.innerHTML = card("Paper trading · every strategy",
      `${avail.map(gbtn).join(" ")} &nbsp; ${btn("qtd","QTD")} ${btn("ytd","YTD")} ${btn("1y","1Y")} ${btn("all","All")} &nbsp; ${span} ·
       each series shown as cumulative % return from its first day in view`,
      `<div class="grid g-2-1"><div class="chart tall" id="paperChart"></div>${
        tbl(["Strategy","Since","Return","vs SPY (same window)","Sharpe"], stats.sort((a,b)=>parseFloat(b[2])-parseFloat(a[2])))}</div>
       <div class="muted" style="margin-top:8px">${noteHtml}</div>`);
    const series = view.filter(s => by[s]).map(s => {
      const base = +by[s][0].nav;
      return {name:PAPER_LABEL[s], type:"line", showSymbol:days.length < 3 || by[s].length < 3, symbolSize:7, connectNulls:false,
        lineStyle:{width:["grid_a_buy","actual_book"].includes(s) ? 2.4 : 1.4, color:PAPER_COL[s], type:s.startsWith("ls_") ? "dashed" : "solid"},
        itemStyle:{color:PAPER_COL[s]},
        // cumulative % return from each series' first day in view, not an index level: the
        // question is "how much did this strategy make", which a 100-based index makes you do
        // arithmetic to answer.
        data:days.map(d => { const x = by[s].find(r => r.nav_date === d); return x ? +((+x.nav / base - 1) * 100).toFixed(2) : null; })};
    });
    /* ⚠ "LIVE" IS PER BOOK, NOT ONE DATE (backtesting-frameworks review, 2026-11-17).
       The marker used to sit at PAPER_LIVE_FROM, 2026-09-15, on every group. That is right for the
       grid and quad books and WRONG for the others: the duration books went live 2026-10-08/10-16 and
       the factor books 2026-10-16, so on those groups the chart called a month of reconstruction
       "live" while the note printed under it said the opposite. The cut now comes from
       PAPER_RECON_FROM (indicators.js) — the same registry the price chart's paper overlay reads,
       itself taken from each backfill script's own LIVE_START — and the span before it is SHADED, so
       the reconstructed stretch reads as a different kind of evidence instead of one unbroken record.
       A group whose books cut on different dates shades to the LATEST cut: everything before it is
       reconstructed for at least one book on screen. */
    const shown = view.filter(s => by[s]);
    const cuts = shown.map(s => (typeof PAPER_RECON_FROM !== "undefined" && PAPER_RECON_FROM[s]) || null).filter(Boolean).sort();
    const liveFrom = cuts.length ? cuts[cuts.length - 1] : null;
    const atOrAfter = d => days.find(x => x >= d);
    const marks = [[grp.id === "model" ? PAPER_REAL_FROM : null, "model data"], [liveFrom, "live"],
                   [grp.id === "model" ? PAPER_V13_LOCK : null, "V13 rules"]]
      .filter(([d]) => d)
      .map(([d,l]) => { const at = atOrAfter(d); return at && at !== days[0] ? {xAxis:at, label:{formatter:l}} : null; })
      .filter(Boolean);
    const liveAt = liveFrom ? atOrAfter(liveFrom) : null;
    if(series.length && marks.length)
      series[series.length-1].markLine = {silent:true, symbol:"none", lineStyle:{color:C.dim, type:"dashed"},
        label:{color:C.muted, fontSize:11}, data:marks};
    if(series.length && liveAt && liveAt !== days[0])
      series[series.length-1].markArea = {silent:true, itemStyle:{color:"rgba(255,255,255,.035)"},
        label:{show:true, position:"insideTopLeft", color:C.dim, fontSize:11},
        data:[[{name:"reconstructed", xAxis:days[0]}, {xAxis:liveAt}]]};
    mk(document.getElementById("paperChart"), {
      legend:{type:"scroll", bottom:0, textStyle:{color:C.muted},
        selected:Object.fromEntries(view.filter(s => by[s]).map(s => [PAPER_LABEL[s], grp.id === "model" ? PAPER_DEFAULT.includes(s) : true]))},
      grid:{left:56,right:16,top:20,bottom:40},
      tooltip:{trigger:"axis", valueFormatter:v => v == null ? "—" : (v > 0 ? "+" : "") + (+v).toFixed(2) + "%"},
      xAxis:{type:"category", data:days, axisLabel:{color:C.muted}},
      yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:C.line}},
        axisLabel:{color:C.muted, formatter:v => (v > 0 ? "+" : "") + v + "%"}},
      series});
    box.querySelectorAll("button[data-range]").forEach(b => b.onclick = () => { paperRange = b.dataset.range; draw(); });
    box.querySelectorAll("button[data-group]").forEach(b => b.onclick = () => { paperGroup = b.dataset.group; draw(); });
  };
  draw();
}

/* ── THE BUY-LIST RULE, REPLAYED FROM 2009 (ic_process_backtest, scripts/process_backtest_load.py) ──
 * Niko, 2026-11-23: "for the new ones we added, take it back further in a backtest." The four process
 * paper books were first locked on 2026-11-20. Their RULE has a history: the research replay.
 *
 * ⚠ ITS OWN CARD, ITS OWN TABLE, ITS OWN AXIS. A replay is not a paper book: annual filed
 * fundamentals, trailing growth where the live score uses consensus forward growth, a company list
 * of survivors only, no pillar scores and no theses (so no veto of either kind), and every rule was
 * chosen on this same history. Each row says which paper book it stands behind and HOW IT DIFFERS,
 * in the engine's own words (the `differs` column), and the card says "upper bound, not a forecast".
 * Three states that must not look alike: the read failed, the table is empty (the load is local and
 * has not been run), and loaded. Growth of 100 on a LOG axis: on a linear one 17 years of compounding
 * draws the first decade as a flat line. Month-end points; the statistics are from daily rows. */
async function backtestCard(el){
  let B, N;
  try{ B = await qAll("site_process_backtest_books", r => r.order("position"));
       N = await qAll("site_process_backtest", r => r.order("nav_date").order("book")); }
  catch(e){ el.innerHTML = card("The buy-list rule, replayed", "could not be loaded", gapBox("The backtest did not load.", e.message || String(e))); return; }
  if(!B.length){ el.innerHTML = card("The buy-list rule, replayed", "not loaded",
      gapBox("No backtest is stored.", "It is loaded locally from the research replay (scripts/process_backtest_load.py). This is an empty table, not a rule with no history.")); return; }
  const by = {}; N.forEach(r => (by[r.book] ||= []).push([r.nav_date, +r.nav]));
  const dates = [...new Set(N.map(r => r.nav_date))].sort();
  const p1 = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
  const pts = v => v == null ? "" : `${v > 0 ? "+" : ""}${(v * 100).toFixed(1)} pts`;
  const COL = {bt_qgs25: C.green, bt_qgs25_brake: C.accent2, bt_qgs25_not_down: "#c9a1ff", bt_screen: C.accent, bt_spy: C.muted};
  const stands = b => b.analog_of ? `stands behind <b>${esc(typeof paperName === "function" ? paperName(b.analog_of) : b.analog_of)}</b>` : "a reference";
  const rows = B.map(b => [
    `<span style="color:${COL[b.book] || C.text}">&#9679;</span> <b>${esc(b.label)}</b><div class="nm">${stands(b)}</div>`,
    `<span class="mono">${p1(+b.cagr)}</span>`,
    b.excess_cagr == null ? `<span class="muted">—</span>` : `<span class="mono ${cls(+b.excess_cagr)}">${pts(+b.excess_cagr)}</span> <span class="muted">t ${(+b.excess_t).toFixed(1)}</span>`,
    `<span class="mono">${p1(+b.vol)}</span>`, b.sharpe == null ? "—" : `<span class="mono">${(+b.sharpe).toFixed(2)}</span>`,
    `<span class="mono neg">${p1(+b.max_drawdown)}</span>`,
    b.turnover == null ? `<span class="muted">—</span>` : `<span class="mono">${(+b.turnover * 100).toFixed(0)}%</span>`]);
  const first = B.map(b => b.first_date).sort()[0], last = B.map(b => b.last_date).sort().slice(-1)[0];
  const loaded = B.map(b => String(b.loaded_at || "").slice(0, 10)).sort().slice(-1)[0];
  el.innerHTML = card("The buy-list rule, replayed", `${esc(first)} to ${esc(last)} · ${B[0].sessions} sessions · monthly rebalance, equal weight, net of 10bp a side · loaded ${esc(loaded)}`,
    `<div class="gap" style="margin-bottom:12px"><b>A backtest, not the paper record.</b> The paper books above start on 2026-11-20 and are locked forward. This is their rule run over history, on different data. It is an upper bound, not a forecast: every rule in it was chosen on these same years.</div>
     ${tbl(["Book", "A year", "Against SPY, a year", "Volatility", "Sharpe", "Worst drawdown", "Turnover a year"], rows)}
     <div class="chart tall" id="btChart" style="margin-top:14px"></div>
     <h4 style="${VDUR_H4}">How each differs from the paper book it stands behind</h4>
     <ul class="list">${B.filter(b => b.differs).map(b => `<li><b>${esc(b.label)}.</b> ${esc(b.rule)} <span class="muted">${esc(b.differs)}</span></li>`).join("")}</ul>
     <div class="note" style="margin-top:12px">Source: ${esc(B[0].source)}. Sharpe is over the risk-free rate. "Against SPY" is the mean monthly return minus SPY's, times twelve, with a Newey-West t. The chart is growth of 100 on a log scale at month ends; every statistic is computed from daily returns. It is not updated nightly: it changes when the replay is rerun.</div>`);
  mk(document.getElementById("btChart"), {
    legend:{top:0,right:0,textStyle:{color:C.muted},icon:"roundRect",itemWidth:12,itemHeight:3},
    grid:{left:60,right:16,top:28,bottom:28},
    tooltip:{trigger:"axis", valueFormatter:v => v == null ? "—" : Math.round(v).toLocaleString()},
    xAxis:axX({type:"category",data:dates,boundaryGap:false}),
    yAxis:axY({type:"log", min:50, axisLabel:{color:C.dim,fontSize:11,formatter:v => Math.round(v).toLocaleString()}}),
    series:B.filter(b => by[b.book]).map(b => { const m = Object.fromEntries(by[b.book]);
      return {name:b.label, type:"line", symbol:"none", connectNulls:true,

const FLAG_SEEN_KEY = "ic.flags.seen";

function bellNoteLink(d){

  if(notes.includes(d)) return `<a href="#memo" data-memo="${esc(d)}">Read the technicals note →</a>`;
  if(notes.length) return `No technicals note was written for ${esc(d)}. <a href="#memo" data-memo="${esc(notes[0])}">Read the ${esc(notes[0])} note →</a>`;

function toggleBell(force){
  const p = document.getElementById("bellpanel"), btn = document.getElementById("bellbtn");
  if(!p || !btn) return;
  bellOpen = force === undefined ? !bellOpen : force;
  if(bellOpen){
    p.innerHTML = bellPanelHTML();
    p.querySelectorAll(".bp-row[data-tk]").forEach(b => b.onclick = () => { toggleBell(false); openName(b.dataset.tk); });
    p.querySelectorAll('a[href="#memo"]').forEach(a => a.onclick = () => {
      toggleBell(false);

      if((location.hash || "").split("/")[0] === "#memo") route();

    renderBell();

  // closing hands it back to the bell instead of dropping it on <body>.

  } else if(wasOpen && p.contains(document.activeElement) || (wasOpen && document.activeElement === document.body)){
    btn.focus({preventScroll: true});
  }
}

function pageJump(el){

  const heads = [...el.querySelectorAll(".pagehead")].slice(1).filter(h => h.querySelector("h2") && h.querySelector("h2").textContent.trim());

  strip.innerHTML = `<span class="caps">On this page</span>` + heads.map((h, i) => { h.id = h.id || `psec-${i}`; h.style.scrollMarginTop = "110px";
    return `<button class="fbtn" data-to="${h.id}">${esc(h.querySelector("h2").textContent.trim())}</button>`; }).join("");
  el.insertBefore(strip, el.firstChild);
  strip.querySelectorAll("button[data-to]").forEach(b => b.onclick = () => { const t = document.getElementById(b.dataset.to);
    if(t) t.scrollIntoView({block: "start", behavior: "smooth"}); });

// One listener on the card, so a redraw never has to rewire anything.
function queueWire(box){
  if(!box || box.dataset.wired) return;
  box.dataset.wired = "1";
  const redraw = (focus) => { box.innerHTML = queueCard();
    if(focus){ const t = box.querySelector(`textarea.qwhy[data-qid="${focus}"]`); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } } };
  box.addEventListener("click", async ev => {
    const b = ev.target.closest ? ev.target.closest("button") : null;
    if(!b || !b.dataset.qid || QUI.busy) return;
    const id = +b.dataset.qid;
    if(b.classList.contains("qb")){
      QUI.form = QUI.form && QUI.form.id === id && QUI.form.ruling === b.dataset.ruling ? null : {id, ruling: b.dataset.ruling};
      delete QUI.err[id]; redraw(QUI.form ? id : null); return;
    }
    if(b.classList.contains("qcancel")){ QUI.form = null; delete QUI.err[id]; redraw(); queuePoll(box); return; }
    if(b.classList.contains("qsend") && QUI.form && QUI.form.id === id){
      const why = (QUI.draft[id] || "").trim(), ruling = QUI.form.ruling;
      if(why.length < Q_MIN) return;
      QUI.busy = true; delete QUI.err[id]; redraw();
      let res = null, msg = null;
      try{ res = await SB.rpc("site_rule_decision", {p_id: id, p_ruling: ruling, p_reason: why}); if(res.error) msg = res.error.message || String(res.error); }
      catch(e){ msg = "It could not be sent (" + (e.message || String(e)) + "). Nothing was recorded."; }
      QUI.busy = false;
      if(msg){ QUI.err[id] = msg; redraw(id); return; }
      // The request is stored. Show it as SENT, never as ruled: the row changes when the job has applied it.
      delete QUI.draft[id]; QUI.form = null;
      (LIVE.rulings ||= []).push({id: res.data, queue_id: id, ruling, reason: why, status: "PENDING", requested_at: new Date().toISOString()});
      redraw(); queuePoll(box);
    }
  });

    const t = ev.target;
    if(!t.classList || !t.classList.contains("qwhy")) return;
    const id = +t.dataset.qid; QUI.draft[id] = t.value;
    const n = t.value.trim().length, form = t.closest(".qform");

    if(send) send.disabled = n < Q_MIN;

  });
}
// While a ruling is being applied, read the queue again every 15 seconds. Never redraws under a

function queuePoll(box){
  clearTimeout(QUI.timer);
  const pending = (LIVE.rulings || []).some(x => x.status === "PENDING" && Date.now() - new Date(x.requested_at).getTime() < 3 * Q_SLOW_MS);
  if(!pending) return;
  QUI.timer = setTimeout(async () => {
    if(!document.body.contains(box)) return;                        // another tab was opened
    try{ LIVE.queue = await qAll("site_decision_queue"); LIVE.queueErr = null; LIVE.rulings = await qAll("site_ruling_requests"); }catch(e){ /* keep what is drawn; try again */ }
    if(!QUI.form && !QUI.busy && document.body.contains(box)) box.innerHTML = queueCard();
    queuePoll(box);
  }, 15000);
}

/* The day's notes: Keith first, then ONE brief with a section per note, then Keith's weekly on its
 * own. memoIdx / memoJump / the per-note renderers are memo.js's; the bell still jumps here. */
function dailyBrief(box){
  const B = LIVE.briefs || [];
  if(!B.length){
    box.innerHTML = sectionHead("Notes") + card("No notes yet", "", `<p class="muted">The notes are written by the scheduled jobs: before the open, mid-morning for the universe, and after the close.</p>`);
    return;
  }
  const dates = memoDates();
  const draw = () => {
    memoIdx = Math.max(0, Math.min(memoIdx, dates.length - 1));
    const d = dates[memoIdx];
    const at = k => B.find(x => x.as_of === d && (x.kind || "evening") === k);
    const prior = k => B.filter(x => (x.kind || "evening") === k && x.as_of < d)[0];
    // A note written after the close may not exist yet for the anchored day: the most recent earlier
    // one is shown, and its own renderer labels it with its own date.
    const ev = at("evening") || prior("evening"), mo = at("premarket"), un = at("universe"),
          te = at("technicals") || prior("technicals"), ro = at("rotation") || prior("rotation"),
          ke = at("keith") || prior("keith"), kw = at("keith_weekly") || prior("keith_weekly");
    const parts = [["Morning", mo, memoMorning(mo)], ["Close", ev, memoEvening(ev, d)], ["Technicals", te, memoTechnicals(te, d)],
                   ["Rotation", ro, typeof rotationNote === "function" ? rotationNote(ro, d) : ""], ["Universe", un, memoUniverse(un)]];
    const have = parts.filter(p => p[1] && p[2]);
    const missing = parts.filter(p => !(p[1] && p[2])).map(p => p[0].toLowerCase());
    const nav = `<span class="bnav">
      <button class="bbtn" data-md="1" ${memoIdx >= dates.length - 1 ? "disabled" : ""} title="Earlier">←</button>
      <span class="mono muted" style="font-size:var(--fs-sm)">${d}</span>
      <button class="bbtn" data-md="-1" ${memoIdx <= 0 ? "disabled" : ""} title="Later">→</button></span>`;
    box.innerHTML = sectionHead("Notes", `<span class="muted">${nav}</span>`) +
      (typeof keithNote === "function" && ke ? keithNote(ke, d) : gapBox("No daily markets note for this session or before it.", "")) +
      `<div style="margin-top:16px"><div class="caps" style="margin:0 0 8px">Daily brief · ${esc(d)} · ${have.length} of ${parts.length} sections${
          missing.length ? ` · not written: ${missing.join(", ")}` : ""}</div>
        <div class="dbrief">${memoLongerTerm([["Morning", C.accent, mo], ["Universe", C.green, un], ["Close", C.amber, ev]])}${have.map(p => p[2]).join("") ||
          `<div class="muted" style="padding:14px 0">No section was written for ${esc(d)}.</div>`}</div></div>` +
      (kw && typeof keithNote === "function" ? `<div style="margin-top:16px">${keithNote(kw, null, true)}</div>` : "") +
      `<div class="note" style="margin-top:14px">Every figure in a note is computed first and the model that writes it is told to add none of its own. The notes describe what the model is showing. They are not advice or a forecast. Use the arrows to read earlier days.</div>`;
    box.querySelectorAll(".bbtn[data-md]").forEach(b => b.onclick = () => { memoIdx += Number(b.dataset.md); draw(); });
  };
  if(memoJump){ const i = dates.indexOf(memoJump.date); if(i >= 0) memoIdx = i; }
  draw();
  if(memoJump){
    const t = document.getElementById(memoJump.to); memoJump = null;
    if(t) setTimeout(() => { t.scrollIntoView({block: "start"}); if(t.focus) t.focus({preventScroll: true}); }, 0);
  }
}

const TAB_OF = {overview: "today", memo: "today", holdings: "book", performance: "book", history: "book", grid: "universe", proposal: "buylist", markets: "market", research: "theses", analytics: "risk", factors: "risk", about: "reference"};
// SIX TABS (V14, 2026-11-22). Every older route name still resolves: TAB_OF (build_live.py) says
// which tab an old name now lives on, so a bookmark or a link inside a note lands on
// the right tab with the right tab lit instead of silently falling back to the landing page.
function route(){
  const HOME = typeof VIEWS.today === "function" ? "today" : "overview";
  const v = (location.hash || "#" + HOME).slice(1).split("/")[0];
  const fn = VIEWS[v] || VIEWS[HOME];
  const tabOf = typeof TAB_OF !== "undefined" ? TAB_OF : {};
  const active = VIEWS[v] ? (tabOf[v] || v) : HOME;
  document.querySelectorAll("#tabs a, #menupanel a").forEach(a => { const on = a.dataset.v === active;
    a.classList.toggle("on", on); if(on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  setMenu(false);
  clearCharts(); closeDrawer(true);
  const el = document.getElementById("view"); el.innerHTML = ""; window.scrollTo(0,0);
  // The "On this page" strip is built when the tab has finished drawing (its sections arrive async),
  // and only if the reader is still on it.
  const at = location.hash;
  Promise.resolve(fn(el)).then(() => { if(location.hash === at && typeof pageJump === "function") pageJump(el); }).catch(e => console.error(e));
  // A sub-path opens that name. Only holdings was handled, so every #grid/TICKER link the universe
  // morning note writes landed on the Grid tab and then sat there, which reads as a dead link.
  // The drawer needs LIVE.matrix for grade / quad / guidance and only the Grid tab loads it, so the
  // same await the Universe table's row click uses is repeated here rather than a second path.
  const sub = location.hash.split("/")[1];
  if(sub){
    // ONE DRAWER (2026-11-23): whichever tab the link is on, the name opens the same way. The drawer
    // shows the model's rank and action, which come from the grid, so that is loaded first.
    (async () => { if(typeof ensureMatrix === "function") await ensureMatrix();
                   if(typeof openName === "function") openName(decodeURIComponent(sub)); })();
  }
}
// Built from the nav's own links rather than a second hard-coded list, so a tab added to the
// strip (build_live.py injects Memo, Analytics, Grid, Proposal, Theses and About) shows up here
// with no extra step and the two can never drift apart.
function buildMenu(){

function periodStart(key, lastDate){
  const d = new Date(lastDate + "T00:00:00Z"), y = d.getUTCFullYear();
  if(key === "mtd") return `${y}-${String(d.getUTCMonth()+1).padStart(2,"0")}-01`;
  if(key === "qtd") return `${y}-${String(Math.floor(d.getUTCMonth()/3)*3+1).padStart(2,"0")}-01`;
  if(key === "ytd") return `${y}-01-01`;

// Compounds the daily series from the window start. Returns null when the window has no data yet.
function periodStats(key){
  const P = D.perf, dates = P.dates, dp = P.daily_p, db = P.daily_b;
  if(!dates || !dates.length) return null;
  const start = periodStart(key, dates[dates.length-1]);
  let i = start ? dates.findIndex(d => d >= start) : 0;
  if(i < 0) return null;
  let p = 1, b = 1, up = 0, n = 0;
  const cp = [0], cb = [0], dd = [];
  let peak = 1;
  for(let j = i; j < dates.length; j++){
    p *= 1 + (dp[j]||0); b *= 1 + (db[j]||0);
    cp.push(p-1); cb.push(b-1);
    peak = Math.max(peak, p); dd.push(p/peak - 1);
    if((dp[j]||0) > (db[j]||0)) up++;
    n++;
  }
  if(!n) return null;
  return {key, from: dates[i], to: dates[dates.length-1], days: n,
          port: p-1, spy: b-1, excess: (p-1)-(b-1), beat_days: n ? up/n : null,
          max_dd: Math.min(...dd, 0), x: [dates[i], ...dates.slice(i)], cum_p: cp, cum_b: cb};
}

/* Both book notes share one shape (daily_brief.SHAPE, imported by premarket_brief), so they share
   one renderer. The note is a set of LENSES — the book, its factor exposure, the market, the names'
   news, risks, catalysts, what's next — rather than a narrative, and it is capped hard: the evening
   note had grown to 1,217 words, of which risks alone were 453. */
const OBS_SECTIONS = [["portfolio","The book"],["factors","Factor read"],["market","Market"]];
function obsList(items){
  return (items||[]).map(x =>
    `<li><b>${esc(x.obs||x.risk||x.shift||"")}</b><div class="muted">${esc(x.note||"")}</div></li>`).join("");
}
// Notes written before 2026-10-14 used performance / movers / risks_this_week / week_ahead. The
// Holdings arrows and the Memo tab read 30 days back, so without this every historical note would
// render with only its news and catalysts — the rest silently gone.
// When a note was actually written, not just which day it is about. The pre-open note on
// 2026-10-14 was generated at 15:12 ET — five hours into the session — and read identically to one
// written before the bell. created_at ships in site_daily_brief and was never rendered.
// A NOTE OLDER THAN THE RECORD IT QUOTES SAYS SO (2026-11-18). ic_analytics stamps
// ic_pipeline_state('returns_restated') whenever it changes a stored daily return. A book note
// written before that stamp, about a date the restatement reached, quotes returns the record no
// longer holds — the 11-17 close note said YTD 12.45% vs SPY 10.44% against a record of 10.13% vs
// 8.25%. Only material restatements (5bp or more on some day) and only the two notes that quote the
// book's returns. If the stamp cannot be read nothing is claimed either way.
function staleRecordMark(row, written){
  try{
    if(!["evening", "premarket"].includes(row.kind)) return "";
    // The stamp is a LIST of restatements ({events:[…]}; the first day's single-object shape is
    // still read). A note is marked when any material one (5bp or more on a day) came after it was
    // written and reached its date; the largest such event is the one quoted.
    const st = JSON.parse(((LIVE.pipeline || {}).returns_restated || {}).value || "null");
    const hit = (st ? (st.events || [st]) : []).filter(e => e && e.at && e.max_change_bp >= 5
      && written < new Date(e.at) && row.as_of >= e.first_date);
    if(!hit.length) return "";
    const rs = hit.reduce((a, b) => b.max_change_bp > a.max_change_bp ? b : a), at = new Date(rs.at);
    const when = at.toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:"America/New_York"});
    return " " + badge("fresh", "RESTATED", {text: "written before the return record was restated · its period returns are out of date",
      title: `${rs.rows} daily returns from ${rs.first_date} were restated on ${when} ET, by up to ${rs.max_change_bp}bp on a day. Period returns quoted in this note (MTD, QTD, YTD) are from the record as it stood before.`});
  }catch(e){ return ""; }
}
function writtenAt(row){
  if(!row || !row.created_at) return "";
  try{
    const d = new Date(row.created_at);
    const t = d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/New_York"});
    const day = d.toLocaleDateString("en-CA", {timeZone:"America/New_York"});
    return `<span class="muted" style="font-size:var(--fs-sm)">written ${day === row.as_of ? "" : day + " "}${t} ET</span>` + staleRecordMark(row, d);
  }catch(e){ return ""; }
}
function briefShape(b){
  if(!b) return {};
  if(b.portfolio || b.factors || b.market) return b;
  const movers = (b.movers || []).map(m => ({obs: m.ticker, note: m.note}));
  // the old EVENING keys were performance / risks_this_week / week_ahead; the old MORNING ones were
  // overnight / before_the_bell / watch_at_open. Both shapes are still in the 30-day window.
  const lede = b.performance || b.overnight;
  return Object.assign({}, b, {
    portfolio: (lede ? [{obs: b.performance ? "Performance" : "Overnight", note: lede}] : []).concat(movers),
    risks: b.risks_this_week || [],
    catalysts: b.catalysts || (b.before_the_bell || []).map(x => ({when: "", what: x.what, note: x.note})),
    watching: b.watching || b.week_ahead || b.watch_at_open || "",
  });
}
function briefBody(b){
  b = briefShape(b);
  const sec = (label, inner) => inner ? `<div><h4>${label}</h4><ul class="blist">${inner}</ul></div>` : "";
  const news = (b.news||[]).map(n => {
    const txt = esc(n.note || n.so_what || n.headline || "");
    return `<li><a href="#holdings/${n.ticker}" class="tk" style="text-decoration:none">${n.ticker}</a> ${
      n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" style="color:inherit">${txt}</a>` : txt}</li>`;
  }).join("");
  const cats = (b.catalysts||[]).map(c =>
    `<li>${c.when ? `<span class="mono amber" style="font-size:var(--fs-sm)">${esc(c.when)}</span> ` : ""}<b>${esc(c.what)}</b>${
      c.note ? `<div class="muted">${esc(c.note)}</div>` : ""}</li>`).join("");
  return `<div class="bgrid">
      ${OBS_SECTIONS.map(([k,label]) => sec(label, obsList(b[k]))).join("")}
      ${sec("On our names", news)}
      ${sec("Risks", obsList(b.risks))}
      ${sec("Catalysts", cats)}
      ${sec("Longer term", obsList(b.longer_term))}
    </div>
    ${b.watching ? `<div class="bahead"><div class="caps">What we're watching next</div><p>${esc(b.watching)}</p></div>` : ""}`;
}

// The drawer is a dialog: it takes focus when it opens and hands it back when it closes, so a keyboard
// or screen-reader user lands inside it rather than on <body> behind the scrim (2026-11-18).
let _drawerReturn = null, _drawerTk = null;
function drawerOpened(tk){
  const d = document.getElementById("drawer");
  if(!d.contains(document.activeElement)) _drawerReturn = document.activeElement;
  _drawerTk = tk;
  d.setAttribute("aria-label", `${tk} detail`);
  const x = d.querySelector("button.x"); if(x){ x.setAttribute("aria-label", "Close"); x.focus({preventScroll:true}); }
}
function closeDrawer(silent){ const d = document.getElementById("drawer"); const was = d.classList.contains("on");
  d.classList.remove("on"); document.getElementById("scrim").classList.remove("on");
  // Opening from a row changes the hash, which re-renders the table, so the element that had focus
  // is often gone by now: fall back to the row for the same name in the current table.
  if(was){
    const back = (_drawerReturn && _drawerReturn !== document.body && document.contains(_drawerReturn)) ? _drawerReturn
      : (_drawerTk && document.querySelector(`tr[data-tk="${CSS.escape(_drawerTk)}"][tabindex], tr[data-open="${CSS.escape(_drawerTk)}"][tabindex]`));
    if(back) back.focus({preventScroll:true});
  }
  _drawerReturn = null; _drawerTk = null;
  if(!silent && location.hash.includes("/")) history.replaceState(null,"",location.hash.split("/")[0]); }
document.getElementById("scrim").onclick = () => closeDrawer();
// FOCUS STAYS IN THE DRAWER WHILE IT IS OPEN. It declares aria-modal="true", which tells a screen
// reader the page behind is inert — but Tab walked straight out of it into the table underneath,
// so a keyboard reader was operating rows they could not see. Tab and Shift+Tab now wrap at the
// drawer's edges; focus that has escaped some other way (a re-render) is pulled back on next Tab.
document.addEventListener("keydown", e => {
  if(e.key !== "Tab") return;
  const d = document.getElementById("drawer");
  if(!d || !d.classList.contains("on")) return;
  const f = [...d.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])')]
    .filter(x => x.offsetParent !== null);
  if(!f.length){ e.preventDefault(); return; }
  const first = f[0], last = f[f.length - 1], at = document.activeElement;
  if(!d.contains(at)){ e.preventDefault(); first.focus(); }
  else if(e.shiftKey && at === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && at === last){ e.preventDefault(); first.focus(); }
});
// METHOD NOTES FOLD ON THE DENSE TABS (critique, 2026-11-18). Risk was 51,000px tall and half its
// 3,010 words were ten method notes, so the readings were buried in their own derivations. A note of
// FOLD_MIN_WORDS or more keeps its first sentence — which in this codebase is nearly always the
// finding ("These are targets, not instructions. 17 positions…") — and folds the rest under "How
// this is measured". Nothing is deleted. An observer applies it to sections that render after the
// tab's first paint (the risk engine and factor cards arrive async). data-nofold opts a note out.
const FOLD_TABS = new Set(["risk", "holdings", "book", "reference", "analytics", "factors", "about"]), FOLD_MIN_WORDS = 50;
function foldNotes(root){
  root.querySelectorAll(".note").forEach(n => {
    if(n.closest("details.howto") || n.hasAttribute("data-nofold")) return;
    const text = n.textContent.replace(/\s+/g, " ").trim(), words = text.split(" ").length;
    if(words < FOLD_MIN_WORDS) return;
    // THE LEDE ENDS AT A FULL STOP, NEVER AT A COLON (critique run 3). The pattern used to accept
    // either, so "Where the fragility actually is: factor." folded to "Where the fragility
    // actually is:" — the label shown, the finding hidden, on 3 of the 8 Risk notes. A note whose
    // first sentence is a definition rather than a finding is reworded at its source instead.
    const m = text.match(/^(.{20,260}?[.!?])(?=\s|$)/), lede = m ? m[1] : text.slice(0, 160) + "…";
    const d = document.createElement("details"); d.className = "howto";
    d.innerHTML = `<summary>${esc(lede)}<span class="more">How this is measured · ${words} words</span></summary>`;
    n.replaceWith(d); d.appendChild(n);
  });
}
(() => {
  const v = document.getElementById("view");
  if(!v || typeof MutationObserver === "undefined") return;   // verify.py's harness has no observer
  let queued = false;
  new MutationObserver(() => {
    if(queued) return; queued = true;
    requestAnimationFrame(() => { queued = false;
      if(FOLD_TABS.has((location.hash || "#").slice(1).split("/")[0])) foldNotes(v); });
  }).observe(v, {childList: true, subtree: true});
})();
// KEYBOARD: rows that open a name and headers that sort were mouse-only (22 clickable rows on
// Holdings, 0 focusable). Any element rendered with tabindex and one of these roles answers Enter
// and Space the way it answers a click — one delegated handler rather than one per table.

function ema(a, n){ const k=2/(n+1); let e=null; return a.map(v=>{ e = e==null ? v : v*k + e*(1-k); return e; }); }
function sma(a, n){ return a.map((_,i)=> i<n-1 ? null : a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n); }
function sd(a, n){ return a.map((_,i)=>{ if(i<n-1) return null; const w=a.slice(i-n+1,i+1), m=w.reduce((s,v)=>s+v,0)/n; return Math.sqrt(w.reduce((s,v)=>s+(v-m)**2,0)/n); }); }

  });

let uFilter = "all";
// ONE predicate for the scatter, the table and their counts, so the two cannot disagree about who is in.
const uKeep = u => uFilter==="all" || (uFilter==="held"&&u.held) || (uFilter==="watch"&&u.watch) || (uFilter==="accum"&&u.bucket==="ACCUMULATE");
const uPlotted = u => u.x!=null && u.y!=null && !!u.quad;      // what the scatter can draw

function universe(el){
  const U = D.universe, qc = D.quad_counts, n = U.length;
  // THE AXES ARE THE PAYLOAD'S (V13). D.method says what x and y are, in which units, and where to
  // clip; a payload from before V13 has no method block and draws as it always did.
  const QM = D.method || {}, QQ = QM.quad === "quarterly";

  const xU = QM.x_unit || "%", yU = QM.y_unit || "%";
  el.innerHTML = sectionHead("Quad map", `<span class="muted">${n} core names · the micro sleeve and index ETFs are not plotted</span>`) +
  `<div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))">
    ${["Q1","Q2","Q3","Q4"].map(q=>kpi({Q1:"Q1 · Full compounders",Q2:"Q2 · Margin compression",Q3:"Q3 · Full deterioration",Q4:"Q4 · Reset"}[q],
      `<span style="color:${C.q[q]}" title="${esc(QUAD_MEANS()[q])}">${qc[q]||0}</span>`, `${((qc[q]||0)/n*100).toFixed(0)}% of universe`)).join("")}
    ${(() => {
      // THE FIFTH CARD (2026-11-18). The four quads summed to 79% of the universe and the rest —
      // names with an undefined axis (negative trailing EPS, no forward estimate) — appeared in no
      // card and no dot on the map. Missing must look missing, so it is counted, not inferred.
      const none = n - ["Q1","Q2","Q3","Q4"].reduce((a, q) => a + (qc[q] || 0), 0);
      return kpi(QQ ? "No quad · no current quarter" : "No quad · axis undefined", `<span style="color:${C.dim}">${none}</span>`,
                 `${(none/n*100).toFixed(0)}% of universe · not on the map`);
    })()}
  </div>
  <div class="card"><div class="card-h"><div><h3>${esc(QM.quad_title || "Revenue momentum vs earnings momentum")}</h3><div class="sub">${esc(QM.quad_sub || "x = forward minus trailing revenue growth · y = forward minus trailing EPS growth")}${
      QQ && QM.universe_median_gp_growth != null ? ` · universe median growth ${num(QM.universe_median_gp_growth*100,1)}%` : ""} · size = alignment · rings = holdings</div></div>
    <div class="filters" id="uf">${[["all","All"],["held","Holdings"],["watch","Watchlist"],["accum","Accumulate"]].map(([k,l])=>`<button class="fbtn ${uFilter===k?'on':''}" data-f="${k}">${l}</button>`).join("")}</div></div>
    <div class="chart" id="uMap" style="height:560px"></div></div>
  <div class="grid g2" style="margin-top:16px">
    ${card("Top alignment scores", "universe leaders not held", `<div class="list" id="uTop"></div>`)}
    ${card("Quad by sector", "count of names", `<div class="chart tall" id="uSec"></div>`)}
  </div>
  <div class="grid g2" style="margin-top:16px">
    ${card("Quad by industry", `largest industries · <select class="input" id="uIndN" style="width:auto;display:inline-block;padding:2px 6px">
      <option value="14">top 14</option><option value="25">top 25</option><option value="99">all</option></select>
      <label class="check" style="display:inline-flex;margin-left:10px"><input type="checkbox" id="uIndQ1"> sort by Q1 share</label>`,
      `<div class="chart" id="uInd" style="height:520px"></div>`)}
  </div>
  <div class="note" style="margin-top:16px">The quad is shown for context. It is not an input to the grade or to
    which names are bought: in testing only the first box separated, and not reliably.</div>`;
  document.querySelectorAll("#uf .fbtn").forEach(b => b.onclick = () => { uFilter = b.dataset.f;
    // only this view's own charts: the tab it sits on has others
    disposeOnly(charts.filter(c => c.getDom && ["uMap", "uSec", "uInd"].includes((c.getDom() || {}).id))); universe(el); });
  const keep = uKeep;
  const clipX = v => Math.max(-XC, Math.min(XC, v)), clipY = v => Math.max(-YC, Math.min(YC, v));
  const pts = U.filter(u=>u.x!=null&&u.y!=null&&u.quad);
  mk(document.getElementById("uMap"), {
    grid:{left:50,right:20,top:20,bottom:40},
    xAxis:axY({type:"value",min:-XC,max:XC,name:QM.x_label || "Revenue momentum →",nameLocation:"middle",nameGap:26,nameTextStyle:{color:C.dim},axisLabel:{color:C.dim,formatter:v=>v+xU},splitLine:{lineStyle:{color:C.line}}}),
    yAxis:axY({type:"value",min:-YC,max:YC,name:QM.y_label || "Earnings momentum →",nameLocation:"middle",nameGap:34,nameTextStyle:{color:C.dim},axisLabel:{color:C.dim,formatter:v=>v+yU}}),
    tooltip:{trigger:"item",formatter:p=>{const u=p.data.u;return `<b>${u.tk}</b> ${esc(u.name)}<br>${u.quad} · ${u.tier||"—"} · align ${num(u.align,0)} ${u.bucket||""}<br>${esc(QM.x_short || "rev mom")} ${num(u.x,1)}${xU} · ${esc(QM.y_short || "EPS mom")} ${num(u.y,1)}${yU}${u.qscore != null ? ` · quad score ${num(u.qscore,0)}` : ""}<br>composite ${num(u.comp)} · ${u.trend||""}${u.held?"<br><b style='color:#6aa6f8'>HELD</b>":""}`;}},
    series:[
      {type:"scatter",data:[],markArea:{silent:true,data:[
        [{coord:[0,0],itemStyle:{color:"rgba(106,166,248,.045)"}},{coord:[XC,YC]}],[{coord:[0,-YC],itemStyle:{color:"rgba(63,207,142,.035)"}},{coord:[XC,0]}],
        [{coord:[-XC,-YC],itemStyle:{color:"rgba(239,100,100,.035)"}},{coord:[0,0]}],[{coord:[-XC,0],itemStyle:{color:"rgba(240,169,74,.035)"}},{coord:[0,YC]}]]},
       markLine:{silent:true,symbol:"none",lineStyle:{color:"rgba(255,255,255,.18)",type:"solid"},label:{show:false},data:[{xAxis:0},{yAxis:0}]}},
      {type:"scatter",data:pts.map(u=>({value:[clipX(u.x),clipY(u.y)],u,
        symbol: Math.abs(u.x)>XC||Math.abs(u.y)>YC ? "triangle" : "circle",
        symbolSize: 5 + (u.align||0)/9,
        itemStyle:{color:C.q[u.quad], opacity: keep(u) ? (u.held?.95:.6) : .07,
          borderColor: u.held ? "#fff" : "transparent", borderWidth: u.held ? 1.5 : 0},
        label:{show: keep(u) && (u.held || uFilter!=="all"), formatter:u.tk, position:"right", color:C.text, fontSize:11}}))}]
  }).on("click", p => { if(p.data && p.data.u && p.data.u.held) location.hash = "#holdings/" + p.data.u.tk; });
  const top = U.filter(u=>!u.held&&u.align!=null).sort((a,b)=>b.align-a.align).slice(0,10);
  document.getElementById("uTop").innerHTML = top.map(u=>`<div class="li"><span><span class="tk">${u.tk}</span> <span class="nm">${esc(u.name)}</span></span>
    <span style="display:flex;gap:8px;align-items:center">${quadWord(u.quad)} ${alignBar(u.align)}</span></div>`).join("");
  const secs = [...new Set(U.map(u=>u.sector||"Other"))].sort((a,b)=>U.filter(u=>(u.sector||"Other")===b).length-U.filter(u=>(u.sector||"Other")===a).length).slice(0,11).reverse();

      data:secs.map(s=>U.filter(u=>(u.sector||"Other")===s&&u.quad===q).length)}))
  });
  const drawInd = () => {
    const nWanted = +(document.getElementById("uIndN")?.value || 14);
    const byQ1 = document.getElementById("uIndQ1")?.checked;
    const names = [...new Set(U.map(u=>u.industry||"Unclassified"))];

    const q1share = i => { const n = cnt(i); return n ? U.filter(u=>(u.industry||"Unclassified")===i&&u.quad==="Q1").length/n : 0; };
    let inds = names.filter(i => cnt(i) >= 2).sort((a,b)=>cnt(b)-cnt(a)).slice(0, nWanted);
    inds = inds.sort((a,b)=> byQ1 ? q1share(a)-q1share(b) : cnt(a)-cnt(b));
    const el2 = document.getElementById("uInd");
    if(el2) el2.style.height = Math.max(260, inds.length*26 + 60) + "px";

      grid:{left:210,right:14,top:24,bottom:20}, legend:{top:0,right:0,textStyle:{color:C.muted},itemWidth:10,itemHeight:8},
      xAxis:axY({type:"value"}),
      yAxis:axX({type:"category",data:inds,axisLabel:{color:C.muted,fontSize:10,width:200,overflow:"truncate"}}),
      tooltip:{trigger:"axis", formatter:p => { const i = p[0].axisValue;
        return `<b>${esc(i)}</b><br>` + p.map(x=>`${x.marker}${x.seriesName} ${x.value}`).join("<br>")
             + `<br><span style="opacity:.7">${cnt(i)} names · Q1 ${(q1share(i)*100).toFixed(0)}%</span>`; }},

        data:inds.map(i=>U.filter(u=>(u.industry||"Unclassified")===i&&u.quad===q).length)}))

  drawInd();
  const nSel = document.getElementById("uIndN"), q1c = document.getElementById("uIndQ1");

}

function factors(el, title="Factors & concentration"){
  const F = D.factor_snapshot || {}, FS = D.factor_scores, H = D.holdings;
  el.innerHTML = sectionHead(title, `<span class="muted">${F.snapshot_date?"snapshot "+F.snapshot_date:""}</span>`) +
  `<div class="kpis">

                    third IT weight from a different date, and printed 0.0% when the field was missing */
      const CAP = D.cap || {}, w = (CAP.table || {})["Information Technology"], lim = CAP.limit ?? 28;
      return kpi("IT sector", w == null ? "—" : num(w,1) + "%",
        w == null ? "cap table not in the payload" : `of total · cap ${num(lim,0)}% · ${esc((CAP.priced||"").slice(5))} close`, w > lim ? "neg" : ""); })()}
    ${kpi("Effective N", num(F.effective_n,1), "stocks only · the index fund is left out")}

      const c = F.correlation, g = c && c.governing, r = c && c.recent;

                     `over ${num(c.cap)} on 1 year · ${r ? r.n_over : "—"} on the last ${r ? r.window_days : 90} days · avg ${num(g.avg)}`,

    ${kpi("Wtd ROIC", F.wtd_avg_roic!=null?num(F.wtd_avg_roic,1)+"%":"—", "")}

                    : `<div class="note">${esc(CAP.error || "No sector table was written by the nightly build, so nothing is drawn. An estimate from the holdings would be on a different basis from the cap.")}</div>`); })()}
    </div>
  </div>
  <div style="margin-top:16px">${card("Portfolio averages", "weighted", `<div class="mtab" style="grid-template-columns:repeat(6,1fr)">${[
      ["Fwd rev growth", F.wtd_avg_fwd_revenue_growth!=null?num(F.wtd_avg_fwd_revenue_growth,1)+"%":"—"],["Momentum 3m", F.wtd_avg_momentum_3m!=null?num(F.wtd_avg_momentum_3m,1)+"%":"—"],
      ["Momentum 12m", F.wtd_avg_momentum_12m!=null?num(F.wtd_avg_momentum_12m,1)+"%":"—"],["Gross margin", F.wtd_avg_gross_margin!=null?num(F.wtd_avg_gross_margin,1)+"%":"—"],
      ["FCF margin", F.wtd_avg_fcf_margin!=null?num(F.wtd_avg_fcf_margin,1)+"%":"—"],["FCF yield", F.wtd_avg_fcf_yield_current!=null?num(F.wtd_avg_fcf_yield_current,2)+"%":"—"],
      ["Fwd P/E", num(F.wtd_avg_pe_forward,1)],["EV / EBITDA", num(F.wtd_avg_ev_ebitda,1)],["Net debt / EBITDA", num(F.wtd_avg_net_debt_ebitda,2)],
      ["Buyback yield", F.wtd_avg_buyback_yield!=null?num(F.wtd_avg_buyback_yield,2)+"%":"—"],["Earnings beats (TTM)", F.pct_earnings_beats_ttm!=null?num(F.pct_earnings_beats_ttm,0)+"%":"—"],
      ["Positive revisions", F.pct_positive_revisions!=null?num(F.pct_positive_revisions,0)+"%":"—"]
    ].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("")}</div>`)}</div>`;

    tooltip:{trigger:"item",formatter:p=>`<b>${rows[p.data[1]].tk}</b> · ${facs[p.data[0]]}: ${p.data[2]}th pct<br>${esc(rows[p.data[1]].profile||"")}`},
    series:[{type:"heatmap",data,label:{show:true,color:"rgba(255,255,255,.75)",fontSize:11},itemStyle:{borderColor:"#0a0d12",borderWidth:2,borderRadius:3}}]

    series:[{type:"radar",data:[{value:avg.map(v=>Math.round(v)),name:"Portfolio",areaStyle:{color:"rgba(106,166,248,.25)"},lineStyle:{color:C.accent,width:2},itemStyle:{color:C.accent}},

  });

  // INVESTED capital, and drew the 28% line across them: Information Technology read about 37% here
  // and 31.4% everywhere the cap is tested. It now draws D.cap.table (engines.book.cap_table, share of
  // total capital including cash) and nothing else; with no table it draws nothing and says so above.
  const CAPT = D.cap || {};
  if(CAPT.table){
    const lim = (CAPT.limit ?? 28) / 100, ex = new Set(CAPT.exempt || []);
    const se = Object.entries(CAPT.table).map(([k, v]) => [k, v / 100]).sort((a, b) => a[1] - b[1]);
    mk(document.getElementById("fSec"), {

      yAxis:axX({type:"category",data:se.map(s=>s[0]),axisLabel:{color:C.muted,fontSize:11}}),
      tooltip:{trigger:"axis",valueFormatter:v=>pct(v,1,false)},
