// Timeframe buttons. `days` is a trading-day count translated to a calendar window for the fetch;
// null means "everything the view holds", which db/069 fixed at 2000-01-01.
const LWC_TF = [["3M", 63], ["6M", 126], ["YTD", "ytd"], ["1Y", 252], ["3Y", 756], ["5Y", 1260], ["Max", null]];

// Closing the menu is a page-level concern (click anywhere, or Escape). Registered ONCE, not
// per chart — techChart can run several times for one drawer and a listener per call leaks.
if(typeof window !== "undefined" && !window.__lwcMenuWired){
  window.__lwcMenuWired = true;
  const shut = () => { if(!lwcMenuOpen) return; lwcMenuOpen = null;
    document.querySelectorAll(".lwcmenu").forEach(m => m.hidden = true);
    document.querySelectorAll(".lwcmenubtn").forEach(b => b.classList.remove("on")); };
  document.addEventListener("click", shut);
  document.addEventListener("keydown", e => { if(e.key === "Escape") shut(); });
}

/* ── BAR INTERVAL: daily, two-day, weekly ──────────────────────────────────────────────────────
 * Separate axis from the timeframe buttons: the timeframe says HOW MUCH you see, the interval
 * says WHAT A BAR IS. Aggregating is not cosmetic — every indicator then computes on the
 * aggregated series, so a weekly RSI is the RSI of weekly bars and not a daily RSI sampled on
 * Fridays. That is the whole reason to offer it.
 *
 * ⚠ THE LAST BUCKET IS USUALLY PARTIAL, and more often than on daily. A Wednesday sits inside an
 * unfinished week; a 2-day bucket is half-formed every other session. The caption says so, the
 * same as it does for today's daily bar, because a half-week candle that looks finished is a
 * statement about a week that has not happened.
 */
const LWC_IV = [["D", 1], ["2D", 2], ["W", "W"], ["M", "M"]];

// ISO week key (Monday-start), so a bucket is "the week of", not "five bars from wherever the
// window happened to begin" — a rolling 5-bar group would redraw every day and no two charts
// would agree on where a week starts.
function _isoWeek(iso){
  const d = new Date(iso + "T00:00:00Z");
  const day = (d.getUTCDay() + 6) % 7;            // Mon=0 … Sun=6
  d.setUTCDate(d.getUTCDate() - day);
  return d.toISOString().slice(0, 10);
}

/* Which two-day bar a session belongs to: weekdays are numbered from Monday 1970-01-05, weekends
 * skipped, and paired 0 with 1, 2 with 3, and so on.
 * ⚠ THIS WAS `Math.floor(i / 2)` — THE BAR'S POSITION IN WHATEVER WINDOW HAD BEEN FETCHED. The
 * window's first day moves forward every session, so the pairing flipped from one day to the
 * next: yesterday's (Mon,Tue)(Wed,Thu) became (Tue,Wed)(Thu,Fri), and every indicator on the
 * two-day chart was recomputed on different bars each morning. The comment three lines below
 * already said why W and M bucket on the calendar ("an N-bar bucket slides forward each session
 * and no two charts agree"); 2D was the N-bar bucket it warned about. Counting from a fixed
 * Monday makes a two-day bar the same bar on every chart and every day, and it is the pairing
 * engines/gasbrakesgas.py uses, so the stored GasBrakesGas states land on the right bars.
 * A holiday leaves its pair with one session. */
function _twoDayKey(iso){
  const n = Math.round((Date.parse(iso + "T00:00:00Z") - Date.UTC(1970, 0, 5)) / 864e5);
  return Math.floor((Math.floor(n / 7) * 5 + Math.min(((n % 7) + 7) % 7, 4)) / 2);
}

function aggBars(bars, iv){
  if(iv === "D" || !bars.length) return bars;
  const out = [];
  let key = null, cur = null;
  bars.forEach((b, i) => {
    // M buckets on calendar month (the date's own YYYY-MM), for the same reason W uses the ISO
    // week rather than 21 bars: a calendar bucket is the same bucket on every chart and every
    // day, while an N-bar bucket slides forward each session and no two charts agree.
    const k = iv === "W" ? _isoWeek(b.d) : iv === "M" ? b.d.slice(0, 7) : _twoDayKey(b.d);
    if(k !== key){
      if(cur) out.push(cur);
      key = k;
      // The bucket's OPEN is the first bar's open, which may be null (db/069 leaves it NULL where
      // the vendor had none). It stays null rather than falling back to the close — a bucket whose
      // first session has no open has no open, and inventing one draws a candle body that did not
      // happen.
      // `d` is the bucket's FIRST session (where the candle is drawn) and `e` its LAST — the
      // date a server-computed series dates the same bar by, so it is what such a series is
      // matched on. A daily bar carries no `e`; readers use `b.e || b.d`.
      cur = {d: b.d, e: b.d, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0, sc: b.sc, n: 1};
    } else {
      cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l);
      cur.c = b.c; cur.sc = b.sc; cur.v += (b.v || 0); cur.n++; cur.e = b.d;
    }
  });
  if(cur) out.push(cur);
  return out;
}

// Per-viewer chart preferences. localStorage, wrapped: it can throw in a private window and comes
// back empty after cleared site data, so the chart must render correctly without it. This is a
// convenience, never state anything else reads.
function lwcPrefs(){
  const d = {tf: "1Y", iv: "D", log: false, total: true, ser: "candles",
             on: Object.fromEntries(Object.entries(INDICATORS).map(([k, v]) => [k, !!v.on]))};
  try {
    const p = Object.assign(d, JSON.parse(localStorage.getItem("ic.chart") || "{}"));
    // A pref saved before `ser` existed has none, and a hand-edited one may hold anything.
    // An unknown form would fall through every branch and draw NO price series at all, which
    // looks like missing data rather than a bad setting.
    if(!["candles", "bars", "line"].includes(p.ser)) p.ser = "candles";
    if(!LWC_IV.some(x => x[0] === p.iv)) p.iv = "D";
    if(!LWC_TF.some(x => x[0] === p.tf)) p.tf = "1Y";
    // a companion (the GasBrakesGas oscillator) is on exactly when its owner is, whatever a
    // preference saved before the two were one toggle says
    for(const [k, v] of Object.entries(INDICATORS)) if(v.companionOf) p.on[k] = !!p.on[v.companionOf];
    return p;
  } catch(e){ return d; }
}
function lwcSave(p){ try { localStorage.setItem("ic.chart", JSON.stringify(p)); } catch(e){} }
let LWCP = lwcPrefs();
// techChart() rebuilds the whole element on every toggle, so "is the menu open" cannot live in
// the DOM — it would close the moment you ticked something, which is the one time you want it
// to stay put. Module-level, not in prefs: it is this session's state, not a preference.
let lwcMenuOpen = null;          // null, "indicators" or "signals"

// Earliest date the view holds. db/069 set this floor deliberately — a FIXED date, so "Max" means
// the same window today and in a year, which a rolling CURRENT_DATE - N never could.
const LWC_FLOOR = "2000-01-01";

// ⚠ A TIMEFRAME IS A VIEW, NOT A FETCH, AND THE TWO WINDOWS ARE DIFFERENT.
// The first version used one date for both, and clicking 3M after 1Y did nothing visible: the
// cache already held the wider set, so the fetch was a no-op and fitContent() then fitted ALL of
// it. Worse the other way — fetching only 3 months makes SMA 200 null across the entire view,
// because a 200-bar average needs 200 bars BEFORE the first bar you are looking at.
// So: fetch the window plus a lead-in long enough for the slowest indicator, compute on all of
// it, and show the part that was asked for.
const LWC_LEADIN = 260;                   // trading days; SMA 200 is the longest lookback drawn

function lwcViewFrom(tf){                 // what the viewer sees
  if(tf === "Max") return LWC_FLOOR;
  const spec = (LWC_TF.find(t => t[0] === tf) || [, 252])[1];
  if(spec === "ytd") return new Date().getFullYear() + "-01-01";
  return new Date(Date.now() - Math.ceil((spec || 252) * 1.45) * 864e5).toISOString().slice(0, 10);
}
function lwcFrom(tf){                     // what is fetched and computed on
  if(tf === "Max") return LWC_FLOOR;
  const spec = (LWC_TF.find(t => t[0] === tf) || [, 252])[1];
  const bars = spec === "ytd"
    ? Math.ceil((Date.now() - new Date(new Date().getFullYear() + "-01-01").getTime()) / 864e5 / 1.45)
    : (spec || 252);
  const from = new Date(Date.now() - Math.ceil((bars + LWC_LEADIN) * 1.45) * 864e5)
    .toISOString().slice(0, 10);
  return from < LWC_FLOOR ? LWC_FLOOR : from;
}

/* Bars for one ticker, cached by the WIDEST window fetched so far — asking for 1Y after Max must
 * not refetch, and asking for Max after 1Y must. */
async function loadBars(tk, tf){
  const from = lwcFrom(tf || LWCP.tf);
  const got = (LIVE.barsFrom ||= {})[tk];
  if(LIVE.bars?.[tk] && got && got <= from) return LIVE.bars[tk];
  const rows = await qAll("site_price_history", r => r.eq("ticker", tk).gte("price_date", from).order("price_date"));
  const out = rows.map(r => ({
    d: r.price_date,
    c: +r.adj_close,
    o: r.adj_open == null ? null : +r.adj_open,     // NULL stays null — see the header
    h: +(r.adj_high ?? r.adj_close),
    l: +(r.adj_low  ?? r.adj_close),
    v: +(r.volume || 0),
    // close_price is SPLIT-adjusted; adj_close is dividend-adjusted, i.e. total return. Both are
    // already in the view, so the toggle costs nothing but reading the other column.
    sc: r.close_price == null ? null : +r.close_price,
  }));
  (LIVE.bars ||= {})[tk] = out;
  LIVE.barsFrom[tk] = from;
  return out;
}

/* ── SERVER-SOURCED INDICATORS ────────────────────────────────────────────────────────────────
 * Some series cannot be computed from the bars on screen: the fragility indices are market- and
 * book-wide, written nightly by their own engines. A registry entry names a site_* view and the
 * two columns to read; this fetches each view ONCE per session and aligns it to whatever a bar
 * currently is.
 *
 * ⚠ ALIGNMENT NEVER EXTRAPOLATES. Within the series it forward-fills, which is right for a LEVEL
 * — an MFI of 66 stands until the next reading. Outside it the value is null at BOTH ends: no
 * back-fill before the first observation, no flat line continuing past the last. A fragility
 * index that appears to run from 2000 because the chart carried its first value backwards would
 * be inventing eighteen years of regime history.                                              */
async function lwcPrefetch(tk){
  LIVE.srv ||= {};
  const views = new Set();
  for(const [k, cfg] of Object.entries(INDICATORS))
    if(LWCP.on[k] && cfg.source === "server" && cfg.view) views.add(cfg.view);
  for(const v of views){
    // A PER-NAME view is cached and fetched per name. The fragility indices are market-wide, so
    // one fetch serves every chart in the session; the decision history is 20,000+ rows across
    // 466 names and the chart draws ONE of them, so it is fetched for that name and keyed by it.
    // Caching a per-name view under the bare view name would serve AAPL's grade line on MSFT's
    // chart — a plausible, wrong line, which is the defect class this repo keeps producing.
    const perName = INDICATORS_PERNAME.has(v);
    const key = perName ? `${v}|${tk}` : v;
    if(LIVE.srv[key]) continue;
    const rows = await qAll(v, r => {
      let q = r.order(INDICATORS_DATEKEY[v] || "as_of");
      if(perName) q = q.eq("ticker", tk);
      return INDICATORS_QUERY[v] ? INDICATORS_QUERY[v](q) : q;
    });
    LIVE.srv[key] = INDICATORS_DECODE[v] ? INDICATORS_DECODE[v](rows) : rows;
  }
}
// Which column carries the date in each served view — they do not agree (ic_paper_nav uses
// nav_date), so it is declared rather than guessed.
const INDICATORS_DATEKEY = {site_market_regime: "as_of", site_portfolio_fragility: "as_of",
                            site_paper_nav: "nav_date", site_gasbrakesgas: "timeframe"};

// Server-side narrowing, for a view that serves far more than the chart draws. site_paper_nav
// holds every paper book ever marked, retired ones included (~8,000 rows), and the registry
// exposes only the reported ones, so the rest are
// filtered in Postgres instead of fetched over the wire and thrown away. DECLARED per view: a
// view with no entry here is fetched whole, which is correct but not free.
const INDICATORS_QUERY = {
  site_paper_nav: q => q.in("strategy", PAPER_SHOWN.map(p => p[0])),
};

// Views served PER TICKER rather than once per session. Declared, like everything else here: a
// view that is per-name and not listed would be fetched once and then shown on every other name.
const INDICATORS_PERNAME = new Set(["site_decision_history", "site_gasbrakesgas"]);

// A view whose rows need decoding before a compute() can read them as numbers (grade "A" -> 4).
// Done once where the rows land, not per indicator, so the mapping has one home.
const INDICATORS_DECODE = {site_decision_history: r => decodeDecisionRows(r)};

function alignServer(bars, rows, dkey, vkey, filter){
  if(!rows || !rows.length) return null;
  const src = (filter ? rows.filter(filter) : rows).slice()
    .sort((a, b) => a[dkey] < b[dkey] ? -1 : 1);
  if(!src.length) return null;
  const first = src[0][dkey], last = src[src.length - 1][dkey];
  let j = 0, cur = null;
  return bars.map(b => {
    while(j < src.length && src[j][dkey] <= b.d){ cur = src[j][vkey]; j++; }
    if(b.d < first || b.d > last) return null;      // neither end is extended
    return cur == null ? null : +cur;
  });
}

const _lwcTheme = () => ({
  layout: {background: {color: "transparent"}, textColor: C.muted, attributionLogo: true,
           fontFamily: "Inter, system-ui, sans-serif"},
  grid: {vertLines: {color: C.line}, horzLines: {color: C.line}},
  rightPriceScale: {borderColor: C.line},
  timeScale: {borderColor: C.line, rightOffset: 4},
  crosshair: {mode: LightweightCharts.CrosshairMode.Normal},
});

/* Is the newest bar today's, i.e. still forming? Compared in America/New_York, because the
 * session is, and a viewer in another timezone must not be told a different story. */
function lwcPartial(bars){
  if(!bars.length) return false;
  const nyToday = new Date().toLocaleDateString("en-CA", {timeZone: "America/New_York"});
  return bars[bars.length - 1].d === nyToday;
}

// How tall the canvas needs to be. A fixed 420px squeezed the price pane to a sliver once a few
// indicator panes were open — with everything on it was 7 panes in 420px and the candles were
// unreadable. Price keeps a floor and each extra pane adds its own room.
/* ⚠ THESE TWO NUMBERS ARE A BUDGET, AND THE BUDGET IS ENFORCED BELOW (setStretchFactor).
 * They were only ever half a rule: lwcHeight() added 95px of canvas per indicator pane, and
 * Lightweight Charts then ignored that and split the WHOLE height by stretch factor — 2 for the
 * price pane and 1 for every other. So the default set (RSI + volume) gave the candles 230px of
 * a 490px chart, 47%, and every further indicator took another full share while contributing
 * only 95px. Switching on six panes left a year of price action in ~200px: every line flat,
 * no trend readable, which is the one thing the chart is for.
 * Declaring the budget here and applying the SAME numbers as stretch factors makes the declared
 * geometry and the actual geometry one thing — the price pane now holds its height no matter how
 * many indicators are open, and each indicator pane costs exactly what it is budgeted.         */
const LWC_PRICE_PX = 420;      // the price pane's budget — tall enough to read a year of candles
const LWC_PANE_PX  = 95;       // every indicator pane's budget

/* ⚠ BUDGET THE PANES THAT WILL BE DRAWN, NOT THE ONES THAT ARE TOGGLED.
 * This used to derive the pane set from `LWCP.on` alone, which is a statement about the MENU,
 * not about the chart. An indicator whose compute() declines — returns null because the data it
 * needs does not exist for this symbol — still reserved a 95px pane that was never created.
 * The case that showed it: Grade and Quadrant switched on while looking at SPY on the Markets
 * tab. They are server-sourced per name, SPY is not a row in `companies`, the view returns
 * nothing, no series is made and no pane appears — but the chart was still sized for one, so it
 * came out 95px taller than its contents (measured: 705px budgeted, 3 panes of 464/105/105 plus
 * a 28px axis). Nothing was visibly broken, because LWC redistributes the surplus across the
 * panes that do exist — the price pane simply grew. A budget for something absent, silently
 * absorbed, is the same shape as every other defect here.
 * `panes` is passed in by the caller, which now computes the indicators BEFORE sizing the chart.
 * An indicator that returns an all-null array still keeps its pane deliberately: an empty pane
 * labelled "MACD —" says "on, no data yet", while no pane at all reads as a broken toggle. */
// `heights` is {pane name: px} for a pane whose entry asks for more than the default 95px
// (`paneHeight` in the registry): an oscillator drawn as a filled area over shaded zones with a
// squeeze climbing from its zero line needs room that an RSI line does not.
function lwcHeight(panes, heights){
  let h = LWC_PRICE_PX;
  for(const p of (panes || [])) if(p !== "price") h += (heights && heights[p]) || LWC_PANE_PX;
  return h;
}

function lwcChrome(tk, partial, basisLines, hidden){
  const tf = LWC_TF.map(([l]) =>
    `<button class="tfb${l === LWCP.tf ? " on" : ""}" data-tf="${l}">${l}</button>`).join("")
    + `<span class="lwcsep"></span>`
    + LWC_IV.map(([l]) => `<button class="tfb${l === LWCP.iv ? " on" : ""}" data-iv="${l}"
        title="Bar interval — every indicator is recomputed on these bars">${l}</button>`).join("")
    + `<span class="lwcsep"></span>`
    + [["candles", "Candles"], ["bars", "Bars"], ["line", "Line"]].map(([v, l]) =>
        `<button class="tfb${v === LWCP.ser ? " on" : ""}" data-ser="${v}"
          title="${v === "line" ? "Closing price only — the one form that can draw a session with no recorded open" : "Open, high, low and close"}">${l}</button>`).join("");
  /* TWO MENUS, AND EACH ENTRY SAYS WHAT IT IS (Niko, 2026-11-20, from his other desk's chart).
   * The first version was a panel of 36 unlabelled chips grouped by a one-word heading, with the
   * meaning of each in a tooltip nobody hovers. An INDICATOR is arithmetic on the bars on screen;
   * a SIGNAL is something this model (or a published method) concludes from them. Each entry is
   * its name and one plain line, under the heading that says where it is drawn or where it comes
   * from, and "Added" where it is already on. The descriptions live in IND_MENU (indicators.js).
   * An entry that is the second half of another (the GasBrakesGas oscillator) is not listed: it
   * goes on and off with the entry it belongs to. */
  const meta = (k, cfg) => { const m = IND_MENU[k];
    return m ? {menu: m[0], section: m[1], desc: m[2]}
             : {menu: "indicators", section: cfg.pane === "price" ? "On the price chart" : "In a pane below", desc: ""}; };
  const listed = Object.entries(INDICATORS).filter(([, cfg]) => !cfg.companionOf);
  const nOn = listed.filter(([k]) => LWCP.on[k]).length;
  /* The removable key: one chip per indicator that is ON, with the × that turns it off. It is
   * the second half of "which line is which" — the pane legends name the lines where they are
   * drawn, and this says what is on at all and lets a reader take one off without hunting
   * through the menu for it. The swatch is omitted where the registry declares no colour,
   * because a chip showing a colour the line is not drawn in is worse than no swatch; the pane
   * legend carries the colour the series was ACTUALLY created with.
   * A chip can carry a NOTE: what the signal reads right now ("Brakes, strong since 10-30"), or
   * that the entry is switched on but not drawn ("hidden while GasBrakesGas is on") — an entry
   * that is on and absent with no word of why reads as a broken toggle. */
  const keyRow = !nOn ? "" : `<div class="lwckey">` + listed
    .filter(([k]) => LWCP.on[k])
    .map(([k, cfg]) => `<span class="lwckc" title="${esc(cfg.basis || cfg.label)}">`
       + (cfg.color ? `<i class="lwcsw" style="background:${esc(cfg.color)}"></i>` : "")
       + `${esc(cfg.label)}<span class="lwcknote" data-chipnote="${esc(k)}">${
           hidden && hidden.has(k) ? "hidden while " + esc(hidden.get(k)) + " is on" : ""}</span>`
       + `<button class="lwckx" data-indoff="${esc(k)}" `
       + `title="Remove ${esc(cfg.label)} from the chart">×</button></span>`).join("")
    + `</div>`;
  const menus = [["indicators", "Indicators"], ["signals", "Signals"]].map(([id, title]) => {
    const mine = listed.filter(([k, cfg]) => meta(k, cfg).menu === id);
    const sections = [];
    for(const [k, cfg] of mine){ const sec = meta(k, cfg).section;
      (sections.find(x => x[0] === sec) || (sections.push([sec, []]), sections[sections.length - 1]))[1].push([k, cfg]); }
    // the model's own conclusions first, then what any browser can compute, then the paper record
    const rank = x => { const i = IND_SECTIONS.indexOf(x[0]); return i < 0 ? 99 : i; };
    sections.sort((x, y) => rank(x) - rank(y));
    const n = mine.filter(([k]) => LWCP.on[k]).length, open = lwcMenuOpen === id;
    return `<div class="lwcmenuwrap">
      <button class="tfb lwcmenubtn${open ? " on" : ""}" data-menu="${id}"
        title="${id === "signals" ? "What this model, or a published method, concludes from the bars" : "Arithmetic on the bars on screen"}">${title} <b>${n}</b> ▾</button>
      <div class="lwcmenu" data-menupanel="${id}"${open ? "" : " hidden"}>
        <div class="lwcmhead"><span>${title}</span><a href="#" data-indreset title="Back to the default set">Reset</a></div>
        ${sections.map(([sec, items]) => `<div class="lwcmsec">${esc(sec)}</div>` + items.map(([k, cfg]) => {
            const on = !!LWCP.on[k];
            return `<button class="lwcitem${on ? " on" : ""}" data-ind="${esc(k)}">
              <span class="lwcit">${esc(cfg.label)}</span>${on ? `<span class="lwcadded">Added</span>` : ""}
              <span class="lwcdesc">${esc(meta(k, cfg).desc || cfg.label)}</span></button>`; }).join("")).join("")}
      </div></div>`; }).join("");
  return `<div class="lwcbar">
      <div class="tfs">${tf}</div>
      <div class="lwcopts">
        <button class="tfb${LWCP.log ? " on" : ""}" data-opt="log" title="Logarithmic price scale">Log</button>
        <button class="tfb${LWCP.total ? " on" : ""}" data-opt="total"
          title="Total return uses the dividend-adjusted close; split-adjusted uses the raw close">${
          LWCP.total ? "Total return" : "Split-adjusted"}</button>
        <span class="lwcsep"></span>${menus}
      </div>
    </div>
    ${keyRow}
    <div class="lwcsum" id="lwcSum-${esc(tk)}"></div>
    <div id="lwcChart-${esc(tk)}"></div>
    <div class="lwcfoot">${partial
      ? `<span class="amber">The last ${LWCP.iv === "D" ? "bar" : LWCP.iv === "W" ? "week" : LWCP.iv === "M" ? "month" : "2-day bucket"} is still forming</span> — the engines stop at the last complete session; this chart draws it so the price is current. `
      : ""}${LWCP.iv !== "D" ? `Bars are ${LWCP.iv === "W" ? "weekly (ISO weeks, Monday-start)" : LWCP.iv === "M" ? "monthly (calendar months)" : "two sessions"}, and every indicator is computed on them, not on daily bars resampled. ` : ""}${basisLines.map(b => esc(b)).join(" · ")}</div>`;
}

/* The chart. `el` is the container; chrome and canvas are built inside it. */
async function techChart(el, tk, dailyBars){
  if(!dailyBars || !dailyBars.length){ el.innerHTML = `<div class="muted">no price history</div>`; return; }
  await lwcPrefetch(tk);          // any server-sourced indicator that is switched on

  /* ⚠⚠ PUT EVERY PRICE ON ONE BASIS BEFORE ANYTHING READS IT.
   * `o`, `h` and `l` arrive DIVIDEND-ADJUSTED from site_price_history (adj_open/high/low) while
   * the close switched with the Split-adjusted / Total-return toggle — so in Split-adjusted mode
   * the candle paired an adjusted open with an unadjusted close, and the body was wrong by the
   * whole dividend adjustment. The error grows the further back you look, because that is what
   * a dividend adjustment does: SPY's adj_close/close_price runs 0.628 in 2000, 0.973 in 2024,
   * 0.996 in 2026. Measured consequence — the share of SPY bars rendering GREEN in that mode was
   * 100% every year through 2024, 96.4% in 2025 and 75% in 2026, against 45-60% on a correct
   * basis. Every candle before roughly last spring was green, which is exactly what Niko saw on
   * the Markets tab in Max.
   * db/069's own header warned about this in the other direction ("mixing an unadjusted open
   * with an adjusted close would draw a candle whose body is wrong by the whole dividend
   * adjustment") and the renderer did it anyway, because the open was added to a code path whose
   * close was already conditional.
   * Rebasing HERE, before aggBars and before techSeries, means the candles, every indicator and
   * the data key are all on the basis the toggle names — rather than the candles alone. The
   * factor is close_price/adj_close, i.e. undoing the dividend adjustment; a bar missing either
   * close keeps its values rather than being scaled by a guess. */
  const based = LWCP.total ? dailyBars : dailyBars.map(b => {
    const f = (b.c && b.sc != null) ? b.sc / b.c : null;
    return f == null ? b : {...b, c: b.sc, o: b.o == null ? null : b.o * f, h: b.h * f, l: b.l * f};
  });
  // Aggregate SECOND: techSeries and every registry compute() run on whatever a bar is now.
  const bars = aggBars(based, LWCP.iv);
  const S = techSeries(bars);
  // On D the last bar is partial only if it is today's. On 2D/W the last BUCKET is partial
  // whenever it holds fewer sessions than a full one, which is most of the time.
  const lastN = bars[bars.length - 1].n || 1;
  const partial = lwcPartial(dailyBars)
    || (LWCP.iv === "2D" && lastN < 2) || (LWCP.iv === "W" && lastN < 5)
    || (LWCP.iv === "M" && lastN < 18);   // ~21 sessions in a full month; 18 allows for holidays
  // Only the enabled indicators contribute a basis line, so the caption describes what is on
  // screen rather than everything that could be.
  /* AN ENTRY CAN HIDE ANOTHER WHILE IT IS ON (`hides`). GasBrakesGas hides the volume strip: its
   * own oscillator already draws volume into every bar (blue where heavy), and a second volume
   * pane under it spends 95px saying the same thing less well. The hidden entry stays switched
   * on — it comes back the moment the other goes off — and its chip says why it is not drawn. */
  const HIDDEN = new Map();
  for(const [k, cfg] of Object.entries(INDICATORS))
    if(LWCP.on[k]) (cfg.hides || []).forEach(h => { if(LWCP.on[h]) HIDDEN.set(h, cfg.short || cfg.label); });
  const basis = Object.entries(INDICATORS)
    .filter(([k, c]) => LWCP.on[k] && c.basis && !HIDDEN.has(k)).map(([, c]) => `${c.label}: ${c.basis}`);
  el.innerHTML = lwcChrome(tk, partial, basis, HIDDEN);

  const host = document.getElementById(`lwcChart-${tk}`);

  /* ⚠⚠ EVERYTHING FROM HERE TO THE `catch` IS GUARDED, AND THE CONTROLS BELOW IT ARE NOT.
   * On 2026-11-16 every indicator toggle and every timeframe button on this chart was found to
   * be dead. The cause was elsewhere (a `function performance()` in index.html clobbering
   * window.performance, which Lightweight Charts calls internally) but the reason it was
   * INVISIBLE is this function's shape: the control wiring sat at the very end, so any throw
   * above it left a fully rendered chart whose buttons did nothing, with no error on screen.
   * A chart that fails loudly is a bug; a chart that renders and silently ignores every click
   * is the "missing information must look missing" defect in the UI layer.
   * So: the drawing is guarded and reports its failure where the reader is looking, and the
   * controls are wired in the `finally` — they are plain DOM handlers and do not depend on the
   * canvas existing, so a broken chart must still be re-drawable from its own buttons.
   * The guarded body is deliberately left at its original indentation: re-indenting 100 lines
   * would bury the restructuring in a whitespace diff.                                        */
  /* COMPUTE FIRST, THEN SIZE. Every enabled indicator is evaluated here, before the chart
   * exists, so the height can be budgeted on what will actually be drawn. An entry whose
   * compute() returns nothing is dropped now rather than reserving a pane it never fills.
   * A compute() that THROWS takes only itself out, named in the console — one broken indicator
   * must not cost the chart. */
  const ctx = {tk, v2: (LIVE.v2 || {})[tk] || {},
               srv: v => (LIVE.srv || {})[INDICATORS_PERNAME.has(v) ? `${v}|${tk}` : v] || []};
  const COMPUTED = [];
  for(const [k, cfg] of Object.entries(INDICATORS)){
    if(!LWCP.on[k] || HIDDEN.has(k)) continue;
    let out = null;
    try { out = cfg.compute(bars, S, ctx); }
    catch(e){ console.warn(`lwc: indicator "${k}" failed to compute — skipped`, e); continue; }
    if(!out) continue;                                   // declined: no data for this symbol
    if(cfg.multi && !out.some(ln => ln && ln.vals)) continue;
    COMPUTED.push([k, cfg, out]);
  }
  /* AN ENTRY MAY PAINT THE PRICE BARS INSTEAD OF ADDING A SERIES (`paints: "bars"`).
   * Its compute() returns {vals, colors, none}: a colour per bar, and the colour for a bar it has
   * NO reading for. Under a painter every bar is one or the other — a bar with no reading is
   * drawn in `none` (grey), never left in the ordinary green or red, because an up-day candle
   * left green beside state-coloured ones would read as a state. Generic, not a branch for one
   * indicator: the first enabled painter wins, and the candles, bars and line forms all take it. */
  // What a signal reads RIGHT NOW goes on its chip, and its one-paragraph reading above the
  // chart: a reader should not have to hover the newest bar to learn the state.
  for(const [k, , out] of COMPUTED){
    const n = out && out.chip && el.querySelector(`[data-chipnote="${k}"]`);
    if(n) n.textContent = out.chip;
  }
  { const sum = el.querySelector(".lwcsum"), lines = COMPUTED.map(([, , out]) => out && out.summary).filter(Boolean);
    if(sum){ sum.innerHTML = lines.map(esc).join("<br>"); sum.hidden = !lines.length; } }
  const PAINT = COMPUTED.find(([, cfg]) => cfg.paints === "bars");
  const paintAt = !PAINT ? null
    : Object.fromEntries(bars.map((b, i) => [b.d, PAINT[2].colors[i] || PAINT[2].none]));
  const panesUsed = new Set(["price", ...COMPUTED.map(([, cfg]) => cfg.pane)]);
  const paneHeights = {};
  for(const [, cfg] of COMPUTED) if(cfg.paneHeight) paneHeights[cfg.pane] = Math.max(paneHeights[cfg.pane] || 0, cfg.paneHeight);

  let chart = null, ro = null;
  try {
  chart = LightweightCharts.createChart(host, Object.assign(_lwcTheme(), {
    width: host.clientWidth, height: lwcHeight(panesUsed, paneHeights),
    rightPriceScale: {borderColor: C.line, mode: LWCP.log ? 1 : 0},   // 1 = logarithmic
  }));

  // Panes are created on demand from whatever is enabled, so switching an indicator off removes
  // its pane instead of leaving a gap. Pane 0 is always price.
  const paneOf = {price: 0}; let nextPane = 1;
  const pane = (name) => (paneOf[name] ??= nextPane++);

  // ── price: candles ─────────────────────────────────────────────────────────────────────────
  // A bar with no open contributes no candle (see the header). The close series is always
  // complete, so the overlays still span the full window.
  // The basis is already applied above, so the close is just the close. It was
  // `LWCP.total ? b.c : (b.sc ?? b.c)` — the conditional that the open, high and low never had.
  const px = b => b.c;
  /* Candles / Bars / Line. A line chart is not a cosmetic preference: it is the only one of the
   * three that can draw a bar with NO OPEN, and db/069 leaves `adj_open` NULL where the vendor
   * had none rather than substituting the close. The OHLC forms filter those bars out — one
   * missing session in two years is invisible — but on a name with a sparse history the line is
   * the honest view, so the caption says how many bars the chosen form had to drop. */
  const withOpen = bars.filter(b => b.o != null);
  const dropped = bars.length - withOpen.length;
  let candles;
  if(LWCP.ser === "line"){
    candles = chart.addSeries(LightweightCharts.LineSeries,
      {color: C.green, lineWidth: 2, priceLineVisible: false, lastValueVisible: true}, 0);
    candles.setData(bars.map(b => paintAt ? {time: b.d, value: px(b), color: paintAt[b.d]}
                                          : {time: b.d, value: px(b)}));
  } else if(LWCP.ser === "bars"){
    candles = chart.addSeries(LightweightCharts.BarSeries,
      {upColor: C.green, downColor: C.red, thinBars: false, lastValueVisible: true}, 0);
    candles.setData(withOpen.map(b => Object.assign({time: b.d, open: b.o, high: b.h, low: b.l, close: px(b)},
      paintAt ? {color: paintAt[b.d]} : null)));
  } else {
    candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: C.green, downColor: C.red, borderVisible: false,
      wickUpColor: C.green, wickDownColor: C.red, lastValueVisible: true,
    }, 0);
    candles.setData(withOpen.map(b => Object.assign({time: b.d, open: b.o, high: b.h, low: b.l, close: px(b)},
      paintAt ? {color: paintAt[b.d], borderColor: paintAt[b.d], wickColor: paintAt[b.d]} : null)));
  }

  /* A PAINTER'S RIBBON: one thin strip along the top of the price pane, a colour per bar. The
   * candles already carry the state, but on a three-year chart a candle is two pixels wide and
   * the strip is where the eye reads the sequence. Its own price scale, pinned to the top 1.5%
   * of the pane, so it never moves with the price and never touches it. */
  if(PAINT && Array.isArray(PAINT[2].ribbon)){
    const rb = chart.addSeries(LightweightCharts.HistogramSeries,
      {priceScaleId: "ribbon", priceLineVisible: false, lastValueVisible: false, priceFormat: {type: "volume"}}, 0);
    rb.priceScale().applyOptions({scaleMargins: {top: 0, bottom: 0.985}, visible: false});
    rb.setData(bars.map((b, i) => PAINT[2].ribbon[i] ? {time: b.d, value: 1, color: PAINT[2].ribbon[i]} : {time: b.d}));
  }

  // ── the registry's indicators ──────────────────────────────────────────────────────────────
  // Already computed above (see COMPUTE FIRST, THEN SIZE); this only draws them.
  /* SER is the DATA KEY's source of truth: every series that reaches the canvas registers here
   * with the colour it was actually drawn in and a date->value map. The legend reads THIS rather
   * than the crosshair's seriesData, for two reasons — the value must still show when the
   * pointer is off the chart (the reader is looking at the last bar then, not at nothing), and a
   * swatch whose colour is re-derived from the registry can disagree with the line on screen if
   * a multi-line entry overrode it. One list, written where the series is made.          */
  const SER = [];
  /* `colors` (and `states`) are the ONE-LINE-MANY-COLOURS path. LWC honours a per-point `color`
   * on LineData, so a trend line that changes colour is ONE series, not one series per state.
   * ⚠ This is not a style preference, it is the only correct way to do it here: measured against
   * this exact library build, a LineSeries BRIDGES both whitespace points ({time} with no value)
   * AND omitted points — a V-shape with its middle removed drew 8,465 red pixels against the
   * full line's 7,999, i.e. MORE ink, because the straight bridge is longer than the V it
   * replaced. So you cannot cut a hole in a line series by withholding data, and the usual
   * "one series per colour, gaps in between" idiom silently draws every segment straight across
   * every other segment's span. That is what put three crossing lines on the chart. */
  const put = (vals, cfg, p, color, width, dash, label, colors, states, ln) => {
    /* A BAND is a shaded zone between two levels (`ln.base` and the value), for a pane that
     * needs its extremes marked: the library's baseline series, lines off, one fill. A line may
     * also be SILENT — drawn, but not given a row in the key — for the fill under a line that is
     * already named and for the zones, which are not readings. */
    if(cfg.type === "band"){
      const fill = color || "rgba(255,255,255,.06)";
      const z = chart.addSeries(LightweightCharts.BaselineSeries, {
        baseValue: {type: "price", price: ln.base}, topLineColor: "transparent", bottomLineColor: "transparent",
        topFillColor1: fill, topFillColor2: fill, bottomFillColor1: fill, bottomFillColor2: fill, lineVisible: false,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        ...(cfg.scale ? {autoscaleInfoProvider: () => ({priceRange: {minValue: cfg.scale.min, maxValue: cfg.scale.max}})} : {})}, p);
      z.setData(bars.map((b, i) => vals[i] == null ? {time: b.d} : {time: b.d, value: +vals[i]}));
      return z;
    }
    const Type = cfg.type === "histogram" ? LightweightCharts.HistogramSeries : LightweightCharts.LineSeries;
    const col = color || (cfg.type === "histogram" ? "rgba(106,166,248,.45)" : C.text);
    /* `scale: {min, max}` IS A DECLARED RANGE, AND IT WAS BEING IGNORED — RSI has carried
     * {min: 0, max: 100} since the registry was written and the pane autoscaled anyway, so a
     * quiet RSI filled its pane and looked like a volatile one. It also matters once a line
     * carries marks: the library pads the scale for them, and a −6..+6 oscillator in a 95px pane
     * came out on a ±20 axis, flat. A bounded reading is drawn on its bounds. */
    const fixed = cfg.scale ? {autoscaleInfoProvider: () => ({
      priceRange: {minValue: cfg.scale.min, maxValue: cfg.scale.max}})} : {};
    const s = chart.addSeries(Type, cfg.type === "histogram"
      ? {color: col, priceLineVisible: false, lastValueVisible: false,
         priceFormat: {type: "volume"}, ...fixed}
      : {color: col, lineWidth: width || 1.2, priceLineVisible: false, lastValueVisible: false, ...fixed,
         // A STEP line for anything that holds a value until it changes. A grade does not
         // interpolate from B to C over three weeks; drawing a slope between them would show a
         // transition that never happened.
         lineType: cfg.step ? LightweightCharts.LineType.WithSteps : LightweightCharts.LineType.Simple,
         lineStyle: dash ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid}, p);
    /* ⚠⚠ A GAP IS WHITESPACE, NOT A DELETED POINT. `.filter(Boolean)` used to drop the nulls,
     * and Lightweight Charts then joined the surviving points with a STRAIGHT LINE across the
     * hole. For an SMA that is harmless — its only nulls are the lead-in — but for a series that
     * is mostly gaps it is fatal: AlphaTrend's three colour segments each rendered as a separate
     * line bridging its own absences, so one ratchet became a green diagonal, a yellow step and
     * a red diagonal crossing each other, and the diagonal was the giveaway because a ratchet
     * cannot slope. LWC breaks a line on a whitespace point — {time} with no `value` — which is
     * what a missing bar is. Same defect as every other one in this repo: the gap resolved into
     * a plausible value (an interpolation) instead of looking missing. */
    s.setData(bars.map((b, i) => vals[i] == null
      ? {time: b.d}
      : colors && colors[i] ? {time: b.d, value: +vals[i], color: colors[i]}
                            : {time: b.d, value: +vals[i]}));
    if(ln && ln.silent) return s;
    const map = new Map();
    bars.forEach((b, i) => { if(vals[i] != null) map.set(b.d, +vals[i]); });
    SER.push({pane: p, label: label || cfg.label, color: col, dash: !!dash, map,
              // the key's swatch follows the line: on a per-point-coloured series it shows the
              // colour of the bar under the crosshair, and `states` names that state
              colors: colors || null, states: states || null,
              // A CATEGORICAL series must print its category, not the integer it is plotted at:
              // a grade legend reading "4.00" is the encoding leaking into the reader's view.
              fmtVal: cfg.fmtVal || null,
              vol: cfg.type === "histogram"});
    return s;
  };
  const guide = (s, cfg) => (cfg.guides || []).forEach(g => s.createPriceLine({
    price: g, color: C.dim, lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dotted, axisLabelVisible: false}));
  // Marks a LINE carries (`ln.marks`), as opposed to the T/B/R markers on the candles. Collected
  // here and placed below, under the same density cap and the same "never silently" rule.
  const LINEMARKS = [];
  for(const [k, cfg, out] of COMPUTED){
    if(cfg.paints){
      // A painter adds no series; it gets a key entry on the price pane so the colour under the
      // crosshair is NAMED. A colour with no legend is the unlabelled line all over again.
      const map = new Map();
      bars.forEach((b, i) => { if(out.vals[i] != null) map.set(b.d, out.vals[i]); });
      SER.push({pane: 0, label: cfg.label, color: out.none, dash: false, map,
                colors: out.colors, states: out.states || null, fmtVal: cfg.fmtVal || null, vol: false});
      continue;
    }
    const p = pane(cfg.pane);
    // ⚠ The label comes from the LINE or the entry — never inferred from `dash`. The first
    // version read a dashed line as "(reconstructed)", which is true of the paper books and
    // false of the trade band, whose bands are dashed because they are bands. A legend that
    // invents a provenance claim is worse than one that only gives a name.
    if(cfg.multi){
      let first = null;
      out.forEach(ln => { if(!ln || !ln.vals) return;
        // a line may be a different KIND from its entry (bars under a line) and print its own
        // values; both default to the entry's
        const lc = (ln.type || ln.fmtVal)
          ? Object.assign({}, cfg, {type: ln.type || cfg.type, fmtVal: ln.fmtVal || cfg.fmtVal}) : cfg;
        const s = put(ln.vals, lc, p, ln.color, ln.width, ln.dash, ln.label || cfg.label, ln.colors, ln.states, ln);
        first ||= s;
        if(ln.marks && ln.marks.length) LINEMARKS.push([s, ln.marks, ln.label || cfg.label]);
      });
      if(first) guide(first, cfg);       // guides were honoured on single-line entries only
    }
    else {
      const s2 = put(out, cfg, p, cfg.color, cfg.width, cfg.dash);
      // guides are declared in the registry (RSI 30/70) and were being ignored -- an overbought
      // line the reader cannot see is a threshold that may as well not exist
      guide(s2, cfg);
    }
  }

  // The track line used to be drawn HERE as well as by its registry entry — a third and fourth
  // copy of the same line. It is a `multi` registry entry now and needs no special case; see
  // indicators.js::trackline. Do not reintroduce a renderer branch for one indicator.

  // ── T / B / R and TD markers, native this time ─────────────────────────────────────────────
  const marks = [];
  for(const [k, cfg] of Object.entries(MARK)){
    const on = S.marks[k] || S.td[k] || [];
    on.forEach((hit, i) => { if(hit) marks.push({
      time: bars[i].d, position: cfg.above ? "aboveBar" : "belowBar",
      color: cfg.color, shape: cfg.above ? "arrowDown" : "arrowUp", text: cfg.label,
    }); });
  }
  /* ⚠ MARKERS ARE HIDDEN WHEN THEY WOULD BE TOO DENSE TO READ — AND THE CAPTION SAYS SO.
   * On Max (~6,700 daily bars in ~900px) the T/B/R and TD Sequential 9s and 13s fire thousands
   * of times and the price pane becomes confetti: a marker on every bar marks nothing.
   * Suppressed above roughly ONE MARKER PER 25 PIXELS of chart width.
   *
   * ⚠ 25 IS MEASURED, NOT PICKED. The first attempt used 12px and 3Y was still unreadable,
   * because 12px is narrower than a marker: an arrow plus its "13" label needs about 25px of
   * horizontal room before two of them touch. Markers fire at a steady ~0.10 per bar, so the
   * spacing follows directly from the range (counted over a 900px chart):
   *     3M    63 bars     5 markers   180 px apart
   *     6M   126           9          100
   *     1Y   252          23           39.1   readable
   *     3Y   756          78           11.5   collides
   *     5Y  1260         140            6.4
   *     Max 6700         764            1.2
   * 25px sits between the last comfortable range and the first bad one. It also fixes the real
   * reason 3Y slipped through: at width/12 the cap was 75 against 78 markers, so 3Y cleared it
   * on any chart wider than ~940px. Raising the divisor makes a wider chart show more markers
   * without ever letting a range through on width alone.
   *
   * The test is DENSITY, not the timeframe button, and the difference is not pedantry: Max with
   * MONTHLY bars is ~320 bars and perfectly legible, while 3Y with DAILY bars is ~750 and is
   * not. A rule keyed to the "Max" label would hide markers where they read fine and show them
   * where they do not. It also scales with the pane, so a wider window shows more of them.
   *
   * ⚠ AND IT IS NEVER SILENT. A chart that quietly drops signals looks identical to a name that
   * HAS no signals — the defect this repository keeps producing — so the number withheld goes
   * into the caption with what to do about it. Hiding information is allowed; hiding that you
   * hid it is not. */
  const markCap = Math.max(12, Math.round((host.clientWidth || 900) / 25));
  const marksHidden = marks.length > markCap ? marks.length : 0;
  /* A PAINTER'S MARKS GO ON THE PRICE BARS, with the markers above, in ONE call: a series takes
   * one marker set, and two calls would leave whichever came second.
   *   ICONS (no word) take the same cap as every other marker, counted over the range ON SCREEN
   *     rather than over everything fetched: the lead-in bars left of the view carry marks too,
   *     and counting those hid the marks on a six-month chart because of a year nobody was
   *     looking at.
   *   TAGS (a word) are thinned WHERE THEY WOULD OVERLAP, not by a count. Flips cluster: a name
   *     chopping around its average goes Neutral, Brakes, Neutral, Gas inside a week, and a
   *     count cap passes that chart while its words sit on top of each other. A word needs about
   *     45px, so at the current bars-per-pixel a tag is kept only if no kept tag on the SAME
   *     side of the bars is closer than that. Newest first, and major tags before minor ones (a
   *     Neutral tag sits between a Gas and a Brakes tag about half the time, and those two are
   *     the ones a reader wants).
   * What is withheld is counted in the caption, never dropped quietly — and the bar colours
   * still show every flip, which is why a hidden word costs little. */
  const lineMarksHidden = [];
  const _markFrom = lwcViewFrom(LWCP.tf);
  const onPrice = (marks.length && !marksHidden) ? marks.slice() : [];
  if(PAINT && Array.isArray(PAINT[2].marks)){
    const names = PAINT[2].markNames || ["tag", "mark"];
    const seen = (a) => a.filter(m => bars[m.i].d >= _markFrom).length;
    const mk = m => Object.assign({time: bars[m.i].d, position: m.above ? "aboveBar" : "belowBar",
      color: m.color, shape: m.shape || (m.above ? "arrowDown" : "arrowUp"), text: m.text || ""},
      m.size == null ? null : {size: m.size});
    const icons = PAINT[2].marks.filter(m => !m.tag);
    if(seen(icons) > markCap) lineMarksHidden.push(`${seen(icons)} ${PAINT[1].short || PAINT[1].label} ${names[1]}(s)`);
    else icons.forEach(m => onPrice.push(mk(m)));
    const tags = PAINT[2].marks.filter(m => m.tag);
    const inView = Math.max(1, bars.filter(b => b.d >= _markFrom).length);
    // a WORD needs about 45px before two of them touch; a single letter about 16
    const gap = Math.max(1, Math.ceil((PAINT[2].tagWidth || 45) / ((host.clientWidth || 900) / inView)));
    const kept = [];
    for(const minor of [false, true])
      tags.filter(m => !!m.minor === minor).sort((x, y) => y.i - x.i).forEach(m => {
        if(kept.every(k => k.above !== m.above || Math.abs(k.i - m.i) >= gap)) kept.push(m); });
    kept.forEach(m => onPrice.push(mk(m)));
    const dropped = seen(tags) - seen(kept);
    if(dropped) lineMarksHidden.push(`${dropped} of ${seen(tags)} ${PAINT[1].short || PAINT[1].label} ${names[0]}(s) (they would overlap)`);
  }
  if(onPrice.length) LightweightCharts.createSeriesMarkers(candles,
    onPrice.sort((a, b) => a.time < b.time ? -1 : 1));
  // marks carried by a line: same cap, counted per line
  for(const [s, ms, label] of LINEMARKS){
    const inView = ms.filter(m => bars[m.i].d >= _markFrom).length;
    if(inView > markCap){ lineMarksHidden.push(`${inView} ${label} mark(s)`); continue; }
    LightweightCharts.createSeriesMarkers(s, ms.map(m => Object.assign({
      time: bars[m.i].d, position: m.pos || (m.above ? "aboveBar" : "belowBar"), color: m.color,
      shape: m.shape || (m.above ? "arrowDown" : "arrowUp"), text: m.text || ""}, m.size == null ? null : {size: m.size}))
      .sort((a, b) => a.time < b.time ? -1 : 1));
  }

  // ── THE DATA KEY: one legend per pane, swatch + name + value at the crosshair ───────────────
  // Before this the chart said `O H L C vol` for the symbol and nothing at all for the eight
  // other lines on it, so a reader could see four overlays on the price pane and had no way to
  // learn which was SMA 50 and which was the 52-week VWAP, let alone what either one read. An
  // unlabelled line is an unreadable one.
  //
  // The overlays are positioned from the MEASURED pane rows rather than from LWC_PRICE_PX /
  // LWC_PANE_PX, even though those now govern the layout: the time axis is taken out of the
  // total before the stretch factors are applied, so the budget and the pixels differ by a few
  // each pane, and a legend drawn from the budget would sit slightly wrong in every pane but
  // the first. Measure the thing you are positioning against.
  const byDate = Object.fromEntries(bars.map(b => [b.d, b]));
  const idxOf  = Object.fromEntries(bars.map((b, i) => [b.d, i]));
  const fmt = v => v == null ? "—" : (+v).toFixed(2);
  const fmtV = v => v == null ? "—" : Math.abs(v) >= 1e4 ? (+v).toLocaleString(undefined, {maximumFractionDigits: 0}) : (+v).toFixed(2);
  const swatch = (c, dash) => `<span class="lwcsw" style="background:${dash ? "transparent" : esc(c)};`
    + `${dash ? `border-top:2px dashed ${esc(c)}` : ""}"></span>`;

  const boxes = [];

  let lastBar = bars[bars.length - 1];
  const paint = (b) => {
    if(!b) return;
    lastBar = b;
    const up = b.o != null && px(b) >= b.o;
    const prev = bars[idxOf[b.d] - 1];
    const chg = prev ? px(b) - px(prev) : null;
    const chgPct = prev && px(prev) ? 100 * chg / px(prev) : null;
    boxes.forEach((box, i) => {
      let html = "";
      if(i === 0){
        html = `<div class="lwcpl-r"><span class="lwcpl-h">${esc(tk)}</span> <span class="muted">${esc(b.d)}</span> `
             + (b.o != null
                 ? `<span class="${up ? "pos" : "neg"}">O ${fmt(b.o)} H ${fmt(b.h)} L ${fmt(b.l)} C ${fmt(px(b))}</span> `
                 : `<span class="muted">C ${fmt(px(b))}</span> `)
             + (chg == null ? "" : `<span class="${chg >= 0 ? "pos" : "neg"}">${chg >= 0 ? "+" : ""}${fmt(chg)} (${chgPct >= 0 ? "+" : ""}${fmt(chgPct)}%)</span>`)
             + `</div>`;
      }
      const mine = SER.filter(x => x.pane === i);
      html += (i === 0 && mine.length ? `<div class="lwcpl-r">` : "") + mine.map(x => {
        const v = x.map.get(b.d), bi = idxOf[b.d];
        const shown = v == null ? "—" : x.fmtVal ? x.fmtVal(v) : x.vol ? fmtV(v) : fmt(v);
        const col = x.colors && x.colors[bi] ? x.colors[bi] : x.color;
        const st  = x.states && x.states[bi] ? ` <span class="muted">${esc(x.states[bi])}</span>` : "";
        return `<span class="lwcpl-i">${swatch(col, x.dash)}${esc(x.label)}${st} `
             + `<b>${esc(shown)}</b></span>`;
      }).join("") + (i === 0 && mine.length ? `</div>` : "");
      box.innerHTML = html;
    });
  };


  // ── pane geometry ──────────────────────────────────────────────────────────────────────────
  // Apply the budget lwcHeight() just computed. Without this the library's own 2:1 default wins
  // and the price pane shrinks with every indicator added; see the constants' header.
  try {
    const nameOf = Object.fromEntries(Object.entries(paneOf).map(([name, i]) => [i, name]));
    chart.panes().forEach((pn, i) => pn.setStretchFactor(i === 0 ? LWC_PRICE_PX : (paneHeights[nameOf[i]] || LWC_PANE_PX)));
  } catch(e){
    // An older library build without setStretchFactor: keep the default 2:1 rather than fail the
    // whole chart over its proportions. Logged, not silent -- a layout that quietly reverts is
    // how this went unnoticed in the first place.
    console.warn("lwc: pane stretch factors unavailable, falling back to the library default", e);
  }

  /* ⚠ THE PANE LEGENDS ARE PLACED ON THE NEXT FRAME, AND THAT IS NOT A HEDGE — IT IS MEASURED.
   * Lightweight Charts splits the panes on its own frame, so synchronously after the series are
   * added the chart is still ONE pane: rows read [582, 28] immediately after techChart and
   * [400, 1, 91, 1, 90, 28] from the first requestAnimationFrame onward (measured 2026-11-16,
   * same probe, rAF1 / rAF2 / 60ms / 360ms all identical). Built synchronously, the filter that
   * keeps rows over 40px found the single unsplit row and produced a legend for the price pane
   * and silently none for RSI or volume — a key that labels some of the lines is the defect this
   * is meant to remove. getBoundingClientRect() forces layout but cannot run the library's own
   * frame, so forcing layout was not enough.
   * placeBoxes() is also the resize path: the rows move when the container does, and a legend
   * pinned to where a pane used to be is worse than none. */
  host.style.position = "relative";
  const placeBoxes = () => {
    host.querySelectorAll(".lwcpl").forEach(n => n.remove());
    boxes.length = 0;
    const hostTop = host.getBoundingClientRect().top;
    [...host.querySelectorAll("tr")]
      .filter(tr => tr.querySelector("canvas") && tr.getBoundingClientRect().height > 40)
      .forEach(tr => {
        const d = document.createElement("div");
        d.className = "lwcpl";
        d.style.top = Math.round(tr.getBoundingClientRect().top - hostTop + 3) + "px";
        host.appendChild(d);
        boxes.push(d);
      });
    // A pane with series but no legend box is a pane of unlabelled lines — say so rather than
    // drawing a quietly incomplete key.
    const want = new Set(SER.map(x => x.pane)).size;
    if(boxes.length < want)
      console.warn(`lwc: ${boxes.length} legend box(es) for ${want} pane(s) with series — `
                 + `some lines are unlabelled`);
    paint(lastBar);
  };
  if(marksHidden){
    const foot = el.querySelector(".lwcfoot");
    if(foot) foot.insertAdjacentHTML("afterbegin",
      `<span class="amber">${marksHidden} T/B/R and TD marker(s) hidden</span> — closer than `
    + `25px apart at this range, which is narrower than the markers themselves. Shorten the range or `
    + `widen the bar interval to see them. `);
  }
  if(lineMarksHidden.length){
    const foot = el.querySelector(".lwcfoot");
    if(foot) foot.insertAdjacentHTML("afterbegin",
      `<span class="amber">${esc(lineMarksHidden.join(", "))} hidden</span> — too dense to read at `
    + `this range; the bar colours still show every change. Shorten the range or widen the bar `
    + `interval to see them. `);
  }
  requestAnimationFrame(placeBoxes);
  chart.subscribeCrosshairMove(p => paint(p.time ? byDate[p.time] : bars[bars.length - 1]));

  // Show the timeframe that was asked for, not everything that was fetched. The lead-in bars are
  // loaded and computed on -- they are what makes SMA 200 exist at the left edge -- but they sit
  // off-screen to the left until someone scrolls there.
  const viewFrom = lwcViewFrom(LWCP.tf), lastD = bars[bars.length - 1].d;
  if(LWCP.tf === "Max" || viewFrom <= bars[0].d) chart.timeScale().fitContent();
  else {
    try { chart.timeScale().setVisibleRange({from: viewFrom, to: lastD}); }
    catch(e){ chart.timeScale().fitContent(); }   // a range outside the data throws; show it all
  }
  // LWC needs an explicit width; without this the chart keeps its initial size when the drawer or
  // the window changes and the right-hand bars fall off the edge.
  ro = new ResizeObserver(() => {
    chart.applyOptions({width: host.clientWidth, height: lwcHeight(panesUsed, paneHeights)});
    requestAnimationFrame(placeBoxes);   // the pane rows move with the container
  });
  ro.observe(host);

  } catch(err){
    // Say so, on the page, naming the thing that failed. The foot is where every other caveat
    // about this chart already is, so a failure belongs there rather than only in the console.
    const foot = el.querySelector(".lwcfoot");
    const msg = `Chart failed to draw: ${err && err.message ? err.message : err}. `
              + `The controls below still work — the series are what failed, not the page.`;
    if(foot) foot.innerHTML = `<span class="neg">${esc(msg)}</span>`;
    console.error("techChart:", err);
  } finally {

  // ── controls ───────────────────────────────────────────────────────────────────────────────
  // Wired whatever happened above. `chart`/`ro` may be null after a failure, so teardown is
  // guarded: a redraw from a broken chart must be able to replace it, which is the one action
  // most likely to recover the page.
  const redraw = async () => {
    lwcSave(LWCP);
    const b = await loadBars(tk, LWCP.tf);
    if(chart) chart.remove();
    if(ro) ro.disconnect();
    techChart(el, tk, b);
  };
  el.querySelectorAll("[data-tf]").forEach(btn => btn.onclick = () => { LWCP.tf = btn.dataset.tf; redraw(); });
  el.querySelectorAll("[data-iv]").forEach(btn => btn.onclick = () => { LWCP.iv = btn.dataset.iv; redraw(); });
  el.querySelectorAll("[data-ser]").forEach(btn => btn.onclick = () => { LWCP.ser = btn.dataset.ser; redraw(); });
  el.querySelectorAll("[data-opt]").forEach(btn => btn.onclick = () => {
    LWCP[btn.dataset.opt] = !LWCP[btn.dataset.opt]; redraw(); });
  // An entry and the entries that belong to it (`with`) go on and off together.
  const setInd = (k, on) => { LWCP.on[k] = on; ((INDICATORS[k] || {}).with || []).forEach(c => { LWCP.on[c] = on; }); };
  el.querySelectorAll("[data-ind]").forEach(btn => btn.onclick = () => {
    setInd(btn.dataset.ind, !LWCP.on[btn.dataset.ind]); redraw(); });
  el.querySelectorAll("[data-indoff]").forEach(btn => btn.onclick = () => {
    setInd(btn.dataset.indoff, false); redraw(); });
  // One menu open at a time; opening one closes the other. The open menu survives a redraw
  // (lwcMenuOpen is module state), so ticking three entries is three clicks, not three round trips.
  el.querySelectorAll("[data-menu]").forEach(btn => btn.onclick = (e) => { e.stopPropagation();
    lwcMenuOpen = lwcMenuOpen === btn.dataset.menu ? null : btn.dataset.menu;
    el.querySelectorAll("[data-menupanel]").forEach(m => { m.hidden = m.dataset.menupanel !== lwcMenuOpen; });
    el.querySelectorAll("[data-menu]").forEach(x => x.classList.toggle("on", x.dataset.menu === lwcMenuOpen)); });
  el.querySelectorAll("[data-indreset]").forEach(rst => rst.onclick = (e) => { e.preventDefault();
    for(const [k, cfg] of Object.entries(INDICATORS)) LWCP.on[k] = !!cfg.on; redraw(); });
  // Clicking inside a panel must not close it — a toggle is a click, and closing on every
  // tick would make choosing three indicators three round trips.
  el.querySelectorAll("[data-menupanel]").forEach(m => { m.onclick = e => e.stopPropagation(); });

  }   // end finally — controls are always wired
}
/* ═══ GBG MAPS — one row per series, one cell per session ══════════════════════════════════════
 *
 * Niko, 2026-11-20, from a recording of his other desk: replicate its GBG Sector Map and apply it
 * to the Markets and Universe tabs "for the entire universe and my holdings". A map answers what
 * a table of current states cannot: not "what is it now" but "how long has it been that, and what
 * was it before" — thirty, sixty or 126 sessions at a glance, one row under another.
 *
 * FOUR MAPS, ONE DRAWING FUNCTION:
 *   Sector map (Markets)         each sector fund's price RELATIVE TO SPY: is the sector gaining
 *                                on the index or losing to it. The other desk's map; on
 *                                2026-11-19 all eleven rows here matched it.
 *   Indices, factors, themes     the same question for the rotation the daily note measures.
 *   My holdings (Universe)       each holding's OWN trend, or each holding against SPY.
 *   The universe by sector       BREADTH: what share of a sector's names is in Gas, Neutral and
 *                                Brakes each session. No name's history is drawn 474 times.
 *
 * WHAT A CELL IS. One character per session from ic_gasbrakesgas.recent (db/084), aligned to a
 * session calendar served once (site_gasbrakesgas_calendar): G gas strong, g gas weak, n neutral,
 * b brakes weak, B brakes strong, "-" no bar or no reading. A "-" is drawn as an empty cell, not
 * as the colour beside it.
 *
 * ⚠ A RELATIVE READING IS NOT A PRICE READING, and the card says so under every relative map:
 * Gas on XLK/SPY means technology is gaining on the index, and it can be falling while it does.
 * ⚠ A BREADTH CELL IS A SHARE, NOT A STATE. Its colour is the balance of Gas over Brakes among the
 * names that have a reading that session, in five steps, and the tooltip gives the three shares
 * and how many names they are of. A sector with fewer than three readings has no cell.
 * ⚠ DISPLAY. Nothing here decides anything; see `run.py health` -> "GasBrakesGas readers".      */

const GBG_SECTOR_FUND = {XLK: "Technology", XLY: "Consumer Discretionary", XLC: "Communication Services",
  XLE: "Energy", XLF: "Financials", XLI: "Industrials", XLB: "Materials", XLV: "Health Care",
  XLP: "Consumer Staples", XLU: "Utilities", XLRE: "Real Estate"};
const GBG_OTHER_FUND = [
  ["QQQ", "Nasdaq 100", "Index"], ["IWM", "Russell 2000", "Index"], ["RSP", "S&P 500 equal weight", "Index"],
  ["EFA", "Developed ex-US", "Index"], ["EEM", "Emerging markets", "Index"],
  ["VLUE", "Value", "Factor"], ["MTUM", "Momentum", "Factor"], ["QUAL", "Quality", "Factor"],
  ["USMV", "Low volatility", "Factor"], ["IWF", "Growth", "Factor"],
  ["SMH", "Semiconductors", "Theme"], ["TLT", "Long Treasuries", "Theme"], ["GLD", "Gold", "Theme"]];
const GBG_CODE = {G: 2, g: 1, n: 0, b: -1, B: -2};
const GBG_REL = "SPY";

let gbgMapN = 30;
try { const v = +localStorage.getItem("ic.gbg.n"); if([30, 60, 126].includes(v)) gbgMapN = v; } catch(e){}
let gbgUniView = "holdings";
try { const v = localStorage.getItem("ic.gbg.view"); if(["holdings", "relative", "sectors"].includes(v)) gbgUniView = v; } catch(e){}

// The status rows and the session calendar. Loaded at sign-in; fetched here if a tab is opened
// before that finished or it failed then. A failure leaves gbgOk false and the card says so.
async function gbgEnsure(){
  if(!LIVE.gbg || !Object.keys(LIVE.gbg).length){
    try{
      LIVE.gbg = {}; LIVE.gbgNewest = {};
      for(const r of await qAll("site_gasbrakesgas_status")){
        (LIVE.gbg[r.ticker] ||= {})[r.timeframe] = r;
        if(!LIVE.gbgNewest[r.timeframe] || r.bar_date > LIVE.gbgNewest[r.timeframe]) LIVE.gbgNewest[r.timeframe] = r.bar_date;
      }
      LIVE.gbgOk = true;
    }catch(e){ LIVE.gbg = {}; LIVE.gbgOk = false; }
  }
  if(!LIVE.gbgCal || !LIVE.gbgCal.length){
    try{ LIVE.gbgCal = ((await qAll("site_gasbrakesgas_calendar")).find(r => r.timeframe === "D") || {}).dates || []; }
    catch(e){ LIVE.gbgCal = []; }
  }
}

// One row from a stored daily status row. `key` is the ticker the row is stored under.
function gbgRowOf(key, label, sub, pick){
  const r = ((LIVE.gbg || {})[key] || {}).D || null;
  return {label, sub, pick, recent: r && r.recent, row: r};
}

/* Breadth: one row for a group of names. For each session the share of the names WITH a reading
 * that are in Gas, Neutral and Brakes; the cell's colour is the balance, the tooltip the shares. */
function gbgBreadthRow(label, tickers, pick){
  const recents = tickers.map(t => (((LIVE.gbg || {})[t] || {}).D || {}).recent).filter(Boolean);
  const len = (LIVE.gbgCal || []).length, cells = [];
  for(let i = 0; i < len; i++){
    let g = 0, n = 0, b = 0;
    for(const s of recents){ const c = s[i]; if(c === "G" || c === "g") g++; else if(c === "n") n++; else if(c === "B" || c === "b") b++; }
    const tot = g + n + b;
    if(tot < 3){ cells.push(null); continue; }
    const net = (g - b) / tot;
    cells.push({c: net > 0.5 ? "G" : net > 0.15 ? "g" : net < -0.5 ? "B" : net < -0.15 ? "b" : "n",
                t: `Gas ${Math.round(100 * g / tot)}% · Neutral ${Math.round(100 * n / tot)}% · Brakes ${Math.round(100 * b / tot)}% of ${tot} names`,
                g: g / tot, b: b / tot, n: tot});
  }
  const last = [...cells].reverse().find(Boolean);
  return {label, sub: `${recents.length} name${recents.length === 1 ? "" : "s"}`, pick, cells,
          right: last ? `<span style="color:${GBG_TXT["2"]}">Gas ${Math.round(100 * last.g)}%</span> · `
                      + `<span style="color:${GBG_TXT["-2"]}">Brakes ${Math.round(100 * last.b)}%</span>` : ""};
}

function gbgMapHTML(rows, n){
  const cal = (LIVE.gbgCal || []), dates = cal.slice(-n);
  if(LIVE.gbgOk === false) return `<p class="amber">The GasBrakesGas rows did not load, so there is nothing to draw. This is a failed load, not an empty map.</p>`;
  if(!dates.length) return `<p class="muted">No session calendar yet: the map is filled by the nightly run.</p>`;
  const cell = (code, date, tip) => {
    const s = GBG_CODE[code];
    return s === undefined
      ? `<i class="gbgx" title="${esc(date)}: no reading"></i>`
      : `<i style="background:${GBG_COL[String(s)]}" title="${esc(date + ": " + (tip || GBG_NAME[String(s)]))}"></i>`;
  };
  const body = rows.map(r => {
    let cells;
    if(r.cells) cells = r.cells.slice(-n).map((c, i) => c ? cell(c.c, dates[i], c.t) : cell("-", dates[i]));
    else if(r.recent) cells = r.recent.slice(-n).split("").map((c, i) => cell(c, dates[i]));
    else cells = null;
    const st = r.row;
    const right = r.right != null ? r.right
      : st ? `<span style="color:${GBG_TXT[String(st.shade)]};font-weight:600">${esc(_gbgWords(st.state, st.strength))}</span> <span class="muted">since ${esc(st.since)}</span>`
      : `<span class="muted" title="Fewer than 110 finished bars, or no price series for it">no reading</span>`;
    return `<div class="gbglab"${r.pick ? ` data-gbgpick="${esc(r.pick)}" style="cursor:pointer" title="Chart ${esc(r.pick)}"` : ""}>
        <b>${esc(r.label)}</b>${r.sub ? ` <span class="muted">${esc(r.sub)}</span>` : ""}</div>
      <div class="gbgcells">${cells ? cells.join("") : `<span class="muted" style="font-size:var(--fs-xs);padding-left:6px">no reading</span>`}</div>
      <div class="gbgright">${right}</div>`;
  }).join("");
  // six date labels under the cells, evenly spaced, the last one on the newest session
  const ticks = [0, 1, 2, 3, 4, 5].map(k => Math.round(k * (dates.length - 1) / 5));
  const axis = `<div></div><div class="gbgaxis">${ticks.map(i => `<span style="left:${((i + 0.5) / dates.length * 100).toFixed(2)}%">${esc(dates[i].slice(5))}</span>`).join("")}</div><div></div>`;
  return `<div class="gbgmap">${body}${axis}</div>`;
}
const gbgLegend = (breadth) => `<div class="gbglegend">` + [["2", breadth ? "Mostly Gas" : "Gas, strong"], ["1", breadth ? "More Gas than Brakes" : "Gas, weak"],
    ["0", breadth ? "Balanced" : "Neutral"], ["-1", breadth ? "More Brakes than Gas" : "Brakes, weak"], ["-2", breadth ? "Mostly Brakes" : "Brakes, strong"]]
  .map(([k, l]) => `<span><i style="background:${GBG_COL[k]}"></i>${l}</span>`).join("") + `<span><i class="gbgx"></i>No reading</span></div>`;
const gbgNButtons = () => `<div class="tfs">` + [30, 60, 126].map(v =>
  `<button class="tfb${v === gbgMapN ? " on" : ""}" data-gbgn="${v}" title="The newest ${v} sessions">${v}</button>`).join("") + `</div>`;
const gbgSpan = () => { const d = (LIVE.gbgCal || []).slice(-gbgMapN); return d.length ? `The newest ${d.length} sessions, ${d[0]} to ${d[d.length - 1]}` : ""; };

// Wire a container holding one or more maps: the 30/60/126 buttons redraw, a row label charts it.
function gbgWire(el, redraw, onPick){
  el.querySelectorAll("[data-gbgn]").forEach(b => b.onclick = () => {
    gbgMapN = +b.dataset.gbgn; try { localStorage.setItem("ic.gbg.n", String(gbgMapN)); } catch(e){} redraw(); });
  el.querySelectorAll("[data-gbgpick]").forEach(b => b.onclick = () => onPick && onPick(b.dataset.gbgpick));
}

/* ── Markets: the sector map, and the same question for indices, factors and themes ─────────── */
async function gbgMarketsMaps(el, onPick){
  await gbgEnsure();
  const draw = () => {
    const sectors = Object.entries(GBG_SECTOR_FUND).map(([tk, name]) => gbgRowOf(`${tk}/${GBG_REL}`, `${tk} / ${GBG_REL}`, name, tk));
    const others = GBG_OTHER_FUND.map(([tk, name, kind]) => gbgRowOf(`${tk}/${GBG_REL}`, `${tk} / ${GBG_REL}`, `${name} · ${kind}`, tk));
    const rel = `A relative reading says how the fund is trending against the index, not whether its own price is rising. Select a fund to chart it. Shown for context: not tested against returns.`;
    el.innerHTML =
      card("GBG Sector Map", `<span style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <span>GasBrakesGas on each sector fund's price relative to ${GBG_REL}, one cell per session: is the sector gaining on the index, or losing to it. ${esc(gbgSpan())}; computed each night after the close.</span>${gbgNButtons()}</span>`,
        gbgMapHTML(sectors, gbgMapN) + gbgLegend(false) + `<p class="muted gbgnote">${rel}</p>`)
      + `<div style="margin-top:14px">` + card("Indices, factors and themes against " + GBG_REL,
        `The same reading for the rotation the daily note measures: size, style and three themes, each against the index.`,
        gbgMapHTML(others, gbgMapN) + gbgLegend(false) + `<p class="muted gbgnote">${rel}</p>`) + `</div>`;
    gbgWire(el, draw, onPick);
  };
  draw();
}

/* ── Universe: my holdings, my holdings against the index, and the universe by sector ───────── */
async function gbgUniverseMaps(el){
  await gbgEnsure();
  if(!LIVE.matrix){ try{ LIVE.matrix = await qAll("site_decision_matrix"); }catch(e){ LIVE.matrix = null; } }
  const draw = () => {
    const H = (D.holdings || []).slice().sort((a, b) => (b.value || 0) - (a.value || 0));
    const tot = H.reduce((s, h) => s + (h.value || 0), 0) || 1;
    let rows, lead, breadth = false;
    if(gbgUniView === "sectors"){
      breadth = true;
      const core = (LIVE.matrix || []).filter(r => r.universe_tag !== "micro");
      const by = {};
      core.forEach(r => (by[r.sector || "Unknown"] ||= []).push(r.ticker));
      rows = [gbgBreadthRow("All core names", core.map(r => r.ticker), null),
              ...Object.entries(by).sort((a, b) => b[1].length - a[1].length).map(([sec, tks]) => gbgBreadthRow(sec, tks, null))];
      lead = `Breadth: for each sector, the share of its names in Gas, Neutral and Brakes on their own daily bars, each name counted once. A cell's colour is the balance of Gas over Brakes; hover it for the shares. ${LIVE.matrix ? "" : "The universe did not load, so this is empty. "}`;
    } else if(gbgUniView === "relative"){
      rows = H.map(h => gbgRowOf(`${h.tk}/${GBG_REL}`, `${h.tk} / ${GBG_REL}`, `${(100 * (h.value || 0) / tot).toFixed(1)}%`, h.tk));
      lead = `Each holding's price relative to ${GBG_REL}: is it gaining on the index, or losing to it. A holding can be in Gas here while its own price falls. `;
    } else {
      rows = H.map(h => gbgRowOf(h.tk, h.tk, `${(100 * (h.value || 0) / tot).toFixed(1)}%`, h.tk));
      lead = `Each holding's own trend on daily bars, largest position first. `;
    }
    const views = [["holdings", "My holdings"], ["relative", "Holdings against " + GBG_REL], ["sectors", "Universe by sector"]];
    el.innerHTML = card("GasBrakesGas map",
      `<span style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
         <span class="tfs">${views.map(([v, l]) => `<button class="tfb${v === gbgUniView ? " on" : ""}" data-gbgview="${v}">${l}</button>`).join("")}</span>${gbgNButtons()}</span>`,
      `<p class="muted gbgnote" style="margin-top:0">${lead}${esc(gbgSpan())}. Select a name to open its chart.</p>`
      + gbgMapHTML(rows, gbgMapN) + gbgLegend(breadth)

/* ═══ MARKETS — the major equity indices, on the same chart as everything else ═══════════════
 *
 * Six ETFs, chosen to span the thing rather than to be six large funds: US large (SPY), US
 * large growth / tech (QQQ), US small (IWM), developed ex-US (EFA), emerging (EEM), and the
 * EQUAL-WEIGHT S&P (RSP). RSP is the one that earns its place twice — against SPY it is the
 * cleanest breadth read available here, and breadth is a weighted leg of the Market Fragility
 * Index that is otherwise measured on OUR ~410 names only (market_regime.py: "breadth measured
 * across the names WE track earns -3.6pp … asking our own universe answers that directly
 * instead of by analogy"). RSP/SPY is the market's version of the same question.
 *
 * ⚠ THESE ARE NOT UNIVERSE NAMES. None of the six is a row in `companies`, so there is no
 * decision-matrix grade, no technicals_v2, no thesis and no drawer — and that is correct, not a
 * gap: the model scores businesses, and an index fund is not one. The chart handles their
 * absence rather than inventing it (the earnings VWAP has no anchor and simply does not draw).
 * Clicking one must therefore NOT open the name drawer, which would render a card of dashes.
 *
 * Everything else is shared: the same techChart, the same indicator registry, the same menu and
 * the same D/2D/W intervals. A second chart implementation for six symbols is how two charts of
 * the same thing start disagreeing.
 */
const MARKETS = [
  ["SPY", "S&P 500"],
  ["QQQ", "Nasdaq 100"],
  ["IWM", "Russell 2000"],
  ["RSP", "S&P 500 equal weight"],
  ["EFA", "Developed ex-US"],
  ["EEM", "Emerging markets"],
];

let mktSym = "SPY";
try { mktSym = localStorage.getItem("ic.mkt") || "SPY"; } catch(e){}
/* ANY TRACKED TICKER CAN BE CHARTED HERE (Niko, 2026-11-20: the other desk's "Ticker or name").
 * The six index funds are still the buttons, but a sector fund picked from the GBG Sector Map, or
 * any ticker typed into the box, charts on the same chart with the same indicators. A symbol that
 * is not one of the six is validated by whether it HAS bars, when the tab loads: one that does
 * not falls back to SPY and the tab says which symbol had no prices, instead of blanking. */
const _mktSane = s => /^[A-Z0-9.\-^]{1,10}$/.test(s || "");
if(!_mktSane(mktSym)) mktSym = "SPY";
let mktMiss = null;

// Trailing return over n BARS, from whatever bars are loaded. Null rather than 0 when the window
// does not reach back that far — a name with 40 bars has no 252-bar return, and 0% would read as
// "flat" instead of "unknown".
function _ret(bars, n){
  if(!bars || bars.length <= n) return null;
  const a = bars[bars.length - 1 - n].c, b = bars[bars.length - 1].c;
  return a ? b / a - 1 : null;
}
// ⚠ YTD IS NULL UNLESS THE WINDOW ACTUALLY CONTAINS THE START OF THE YEAR.
// The first version took the earliest loaded bar of the current year, which on a 3-month window
// is a September bar — so the column would have read "YTD" and meant "since September", quietly,
// and only in the one place a reader cannot check it. If the loaded window BEGINS inside the
// current year then its first bar is not the year's first bar, and the honest answer is that we
// do not know. The table also loads a YTD-wide window below so this is rarely hit.
function _ytd(bars){
  if(!bars || !bars.length) return null;
  const last = bars[bars.length - 1], yr = last.d.slice(0, 4);
  if(bars[0].d.slice(0, 4) === yr) return null;      // window starts mid-year: not a YTD
  const first = bars.find(b => b.d.slice(0, 4) === yr);
  return first && first.c ? last.c / first.c - 1 : null;
}

function fundaFmt(v, kind, dp){
  if(v == null) return null;
  const n = +v;
  if(kind === "pct" || kind === "pts") return n.toFixed(dp) + (kind === "pts" ? " pts" : "%");
  if(kind === "dec") return (n * 100).toFixed(dp) + "%";
  if(kind === "x")   return n.toFixed(dp) + "×";
  return n.toFixed(dp);
}
// Step change against the previous DISTINCT value, with the date it changed — "what moved and when"
// rather than a slope through a series that is flat by construction between filings.
function fundaMove(hist, key){
  if(!hist || hist.length < 2) return null;
  const vals = hist.filter(r => r[key] != null);
  if(vals.length < 2) return null;
  const now = +vals[0][key];
  const prior = vals.find(r => +r[key] !== now);
  if(!prior) return {flat: true, since: vals[vals.length - 1].data_date};
  return {from: +prior[key], to: now, since: prior.data_date, delta: now - +prior[key]};
}
// Fetch a name's metric history the first time its drawer opens, then re-render the block in place.
// Keeps ~11,000 rows out of the boot payload while still giving every name a real track record.
async function loadFundaHist(tk){
  if(LIVE.fundaHist[tk]) return LIVE.fundaHist[tk];
  try{
    LIVE.fundaHist[tk] = await q("site_fundamentals_history",
      r => r.eq("ticker", tk).order("data_date", {ascending:false}));
  }catch(e){ LIVE.fundaHist[tk] = []; }
  const el = document.getElementById("fundaBlock");
  if(el) el.outerHTML = fundaBlock(tk);
  return LIVE.fundaHist[tk];
}
