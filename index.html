/* ═══ PERIOD RETURNS (day / MTD / QTD / YTD / since inception) ════════════ */
const PERIODS = [["mtd","MTD"],["qtd","QTD"],["ytd","YTD"],["all","Since inception"]];
let ovPeriod = "ytd";
function periodStart(key, lastDate){
  const d = new Date(lastDate + "T00:00:00Z"), y = d.getUTCFullYear();
  if(key === "mtd") return `${y}-${String(d.getUTCMonth()+1).padStart(2,"0")}-01`;
  if(key === "qtd") return `${y}-${String(Math.floor(d.getUTCMonth()/3)*3+1).padStart(2,"0")}-01`;
  if(key === "ytd") return `${y}-01-01`;
  return null;
}
// Compounds the daily series from the window start. Returns null when the window has no data yet.
function periodStats(key){
  const P = D.perf, dates = P.dates, dp = P.daily_p, db = P.daily_b;
  if(!dates || !dates.length) return null;
  const start = periodStart(key, dates[dates.length-1]);
  let i = start ? dates.findIndex(d => d >= start) : 0;
  if(i < 0) return null;
  let p = 1, b = 1, up = 0, n = 0;
  const cp = [0], cb = [0], dd = [];
  let peak = 1;
  for(let j = i; j < dates.length; j++){
    p *= 1 + (dp[j]||0); b *= 1 + (db[j]||0);
    cp.push(p-1); cb.push(b-1);
    peak = Math.max(peak, p); dd.push(p/peak - 1);
    if((dp[j]||0) > (db[j]||0)) up++;
    n++;
  }
  if(!n) return null;
  return {key, from: dates[i], to: dates[dates.length-1], days: n,
          port: p-1, spy: b-1, excess: (p-1)-(b-1), beat_days: n ? up/n : null,
          max_dd: Math.min(...dd, 0), x: [dates[i], ...dates.slice(i)], cum_p: cp, cum_b: cb};
}
// ── TODAY ────────────────────────────────────────────────────────────────────
// The grid has always computed one plain-English instruction per holding — pace(action, timing)
// in decision_matrix.py, e.g. "Accumulate · BUY NOW", "Exit Review · TRIM ON STRENGTH" — and it
// was reachable only inside the Grid table and a drawer. The answer to "what do I do today" was
// computed nightly and buried two tabs deep. site_build now carries it onto each holdings row,
// so this can sit above everything else.
//
// Ordered by what demands a decision, not by weight: exits first, then trims, then adds that are
// actually at a good price, then names the model has something against. A name appears ONCE, in
// the most urgent bucket it qualifies for.
const ACT_NOW = new Set(["EXIT", "EXIT_REVIEW", "REDUCE", "TRIM_CANDIDATE"]);
const ADD_ACT = new Set(["ACCUMULATE", "ADD_ON_WEAKNESS", "STARTER", "STARTER_ADD"]);
function flagsFor(h){
  const f = [];
  if(h.comp != null && h.comp < 6.5) f.push(`composite ${num(h.comp)}`);
  if((h.p2 != null && h.p2 < 6) || (h.p3 != null && h.p3 < 6)) f.push("pillar floor");
  if(h.bucket === "DISTRIBUTE") f.push("distribute");
  if(h.trend === "DOWNTREND") f.push("downtrend");
  if(h.eq === "EPS_ENGINEERED") f.push("engineered EPS");
  if(h.thesis_status === "BROKEN" || h.thesis_status === "REVIEW") f.push("thesis " + h.thesis_status.toLowerCase());
  if(h.range && h.range.rev) f.push("range reversed");
  return f;
}
function todayBlock(H){
  if(!H || !H.length) return "";
  const seen = new Set(), rows = [];
  const take = (test, bucket, tone) => H.filter(h => !seen.has(h.tk) && test(h))
    .sort((a, b) => (b.value || 0) - (a.value || 0))
    .forEach(h => { seen.add(h.tk); rows.push({h, bucket, tone, flags: flagsFor(h)}); });

  take(h => ACT_NOW.has(h.action), "Act", "bad");
  take(h => h.timing === "TRIM_ZONE", "Trim zone", "warn");
  take(h => ADD_ACT.has(h.action) && (h.timing === "BUY_ZONE" || h.timing === "ACCUMULATE_OK"), "Buy zone", "good");

  const n = rows.length;
  // Everything else the model has something against is the "Needs attention" card below. Including
  // it here put 26 of 29 holdings in a list whose whole job is to prioritise.
  const alsoFlagged = H.filter(h => !seen.has(h.tk) && flagsFor(h).length).length;
  const line = ({h, bucket, tone, flags}) => `<a class="li todayrow" href="#holdings/${h.tk}">
    <span style="display:flex;gap:9px;align-items:baseline;min-width:0">
      <span class="chip ${tone}">${bucket}</span>
      <span class="tk">${h.tk}</span>
      <span class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.guidance || h.action || "")}</span>
    </span>
    <span style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:baseline">
      ${flags.slice(0,3).map(x => `<span class="chip ${/floor|broken|engineered|reversed/.test(x) ? "bad" : "warn"}">${x}</span>`).join("")}
      <span class="mono muted" style="font-size:11px">${pct(h.weight, 1, false)}</span>
    </span></a>`;

  // Dry powder. Position weights are weights of INVESTED capital (db/023), so cash is shown as its
  // own figure rather than folded into them — it is an input to "what do I do today", and until
  // now it left the model entirely the moment a trim settled.
  const cashAmt = D.cash && D.cash.amount ? +D.cash.amount : 0;
  const invested = (D.book_value || 0);
  const cashChip = cashAmt > 0
    ? `<span class="chip">cash ${usd(cashAmt)} · ${pct(cashAmt / (invested + cashAmt), 1, false)} of total</span>`
    : "";

  // Book-level rules that no single name owns. Sector breach is the live one.
  const bySec = {};
  H.forEach(h => { if(h.sector) bySec[h.sector] = (bySec[h.sector] || 0) + (h.weight || 0); });
  const breach = Object.entries(bySec).filter(([, w]) => w > 0.28)
    .sort((a, b) => b[1] - a[1])
    .map(([sec, w]) => `<span class="chip bad">${esc(sec)} ${pct(w, 1, false)} &gt; 28%</span>`).join(" ");

  return `<div style="margin-top:16px">` + card("Today",
    n ? `${n} of ${H.length} holdings are at a decision point · exits first, then trims, then adds at a good price`
        + (alsoFlagged ? ` · ${alsoFlagged} more flagged below` : "")
      : "nothing in the book is at a decision point"
        + (alsoFlagged ? ` · ${alsoFlagged} flagged below` : ""),
    (breach || cashChip ? `<div class="todaybreach">${breach}${cashChip}</div>` : "") +
    (n ? `<div class="list">${rows.map(line).join("")}</div>`
       : `<div class="muted">No exits, trims or buy-zone adds today.</div>`)) + `</div>`;
}

let hFilter = {quad:"", trend:"", sector:"", thesis:"", flagged:false};

// CASH AS A ROW, pinned below the positions and never sorted into them (Niko, 2026-10-22).
// It is not a holding and it is not on the same basis: every Weight above it is a share of INVESTED
// capital, which is what the whole performance record means, while cash only has a meaning against
// the TOTAL. So the row states its own basis rather than quietly joining a column that means
// something else — the same two-bases split the sector weights carry since cash entered the cap test.
function cashRow(ncols){
  const c = (typeof D !== "undefined" && D.cash) || null;
  const amt = c && +c.amount;
  if(!amt) return "";
  const invested = D.holdings.reduce((a, h) => a + (h.value || 0), 0);
  const pctOfTotal = amt / (invested + amt) * 100;
  return `<tr class="cashrow" style="border-top:2px solid var(--line);background:rgba(106,166,248,.04)">
    <td><div class="tk">Cash</div><div class="nm">${esc(c.as_of || "")}</div></td>
    <td class="r mono" title="Share of the TOTAL portfolio. The weights above are shares of invested capital.">${pctOfTotal.toFixed(1)}%<span class="muted" style="font-size:10px"> of total</span></td>
    <td class="r mono muted">${usd(amt)}</td>
    <td colspan="${ncols - 3}" class="muted" style="font-size:11px">${esc(c.note || "")}</td></tr>`;
}
function drawHoldings(){
  // 14 headers against 13 cells until 2026-10-16: the Timing header had no <td>, so every column
  // from Implied growth rightward rendered one place to the LEFT of its own heading. What read as
  // Timing was the implied growth, and Thesis was empty. The risk range is new beside it.
  // "Value" became ambiguous the moment the factor block arrived: the position's dollar value and
  // the Value factor are different quantities and were sitting in the same table under one word.
  // The position column is the one that moves, to "Mkt value", because the factor's name is the
  // standard one and is shared with the Grid and Universe tables.
  // The size and factor block is the same one the Grid and Universe tables use, built from FAC_KEYS
  // so all three cannot disagree about how many columns there are. LIVE.suniv is loaded at boot, not
  // per tab, so Holdings needs no extra fetch for it.
  const cols = [["tk","Holding"],["weight","Weight"],["value","Mkt value"],["pl","P&L"],["_spark","12 mo"],["quad","Quad"],["comp","Composite"],
                ["align","Alignment"],["trend","Trend"],["timing","Timing"],["range_pos","Risk range"],["implied_cagr","Implied growth"],["fwd_rev","Fwd rev / EPS"],
                ["mcap","Mkt cap"], ...FACTORS.map(f => ["f_" + f.k, f.label]),
                ["next_er","Next ER"],["thesis_status","Thesis"]];
  const q = hQuery.toLowerCase(), f = hFilter;
  // "Flagged" means the model has something to say against the name: composite under the 6.5
  // eligibility line, a pillar through its 6.0 floor, a DISTRIBUTE bucket, a downtrend, engineered
  // earnings, or a thesis in review or broken. Same test the Overview's "Needs attention" list uses.
  const flagged = h => (h.comp != null && h.comp < 6.5) || (h.p2 != null && h.p2 < 6) ||
    (h.p3 != null && h.p3 < 6) || h.bucket === "DISTRIBUTE" || h.trend === "DOWNTREND" ||
    h.eq === "EPS_ENGINEERED" || h.thesis_status === "BROKEN" || h.thesis_status === "REVIEW";
  let rows = D.holdings.filter(h =>
    (!q || h.tk.toLowerCase().includes(q) || (h.name||"").toLowerCase().includes(q)) &&
    (!f.quad   || h.quad === f.quad) &&
    (!f.trend  || h.trend === f.trend) &&
    (!f.sector || h.sector === f.sector) &&
    (!f.thesis || h.thesis_status === f.thesis) &&
    (!f.flagged || flagged(h)));
  const hval = (r,k) => k === "implied_cagr"
    ? (((typeof LIVE !== "undefined" && LIVE.vdur ? LIVE.vdur[r.tk] : null)||{}).implied_fcf_cagr ?? null)
    // ordinal, not alphabetical: sorting BUY_ZONE next to AVOID_EXTENDED by first letter
    // misrepresents a field whose whole point is its order.
    : k === "timing" ? (typeof TIMING_ORD !== "undefined" ? (TIMING_ORD[r.timing] ?? 9) : r.timing)
    : k === "range_pos" ? (r.range_pos == null ? null : +r.range_pos)
    // Size and the factors live in LIVE.suniv, keyed by ticker, exactly as the Grid resolves them.
    : k === "mcap" ? (((typeof LIVE !== "undefined" && LIVE.suniv ? LIVE.suniv[r.tk] : null)||{}).market_cap ?? null)
    : k.startsWith("f_") ? (((typeof LIVE !== "undefined" && LIVE.suniv ? LIVE.suniv[r.tk] : null)||{})[k.slice(2) + "_pct"] ?? null)
    : r[k];
  rows.sort((a,b) => { const k=hSort.k, x=hval(a,k), y=hval(b,k); if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string" ? x.localeCompare(y) : x-y) * hSort.d; });
  const t = document.getElementById("ht");
  t.innerHTML = `<thead><tr>${cols.map(([k,l])=>`<th data-k="${k}" class="${['weight','value','pl','comp'].includes(k)?'r':''}">${l}${hSort.k===k?(hSort.d>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(h => {
      const floor = (h.p2!=null&&h.p2<6)||(h.p3!=null&&h.p3<6);
      return `<tr class="row" data-tk="${h.tk}">
      <td><div class="tk">${h.tk}</div><div class="nm">${esc(h.name)}</div></td>
      <td class="r mono">${pct(h.weight,1,false)}</td>
      <td class="r mono muted">${usd(h.value)}</td>
      <td class="r mono ${cls(h.pl)}">${pct(h.pl)}</td>
      <td><div class="spark" data-spark="${h.tk}"></div></td>
      <td>${qchip(h.quad)}</td>
      <td class="r mono ${h.comp!=null&&h.comp<6.5?'neg':''}">${num(h.comp)}${floor?' <span class="chip bad" title="P2 or P3 below 6.0">floor</span>':''}</td>
      <td>${alignBar(h.align)}</td>
      <td>${trendChip(h.trend)}</td>
      <td>${typeof timingChip === "function" ? timingChip(h.timing, h.range_pos) : ""}</td>
      <td>${typeof rangeBand === "function" ? rangeBand(h.trade_low, h.trade_high, h.range_pos, h.timing) : ""}</td>
      <td class="r">${typeof impliedCell === "function" ? impliedCell(h.tk) : ""}</td>
      <td class="mono muted" style="font-size:12px">${pctRaw(h.fwd_rev)} / ${pctRaw(h.fwd_eps)}</td>
      ${facCells({ticker: h.tk, universe_tag: null})}
      <td class="mono muted" style="font-size:12px">${h.next_er||"—"}</td>
      <td>${thesisChip(h.thesis_status)}</td></tr>`; }).join("") + cashRow(cols.length) + "</tbody>";
  t.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; if(k==="_spark"||k==="_timing") return;
    hSort = {k, d: hSort.k===k ? -hSort.d : (["tk","quad","trend","next_er","thesis_status"].includes(k)?1:-1)}; clearCharts(); drawHoldings(); });
  t.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { location.hash = "#holdings/" + tr.dataset.tk; });
  t.querySelectorAll("[data-spark]").forEach(el => { const h = D.holdings.find(x=>x.tk===el.dataset.spark);
    const pts = (h.px||[]).map(p=>p[1]); if(pts.length>2) sparkline(el, pts, pts[pts.length-1]>=pts[0]?C.green:C.red); });
}

/* Both book notes share one shape (daily_brief.SHAPE, imported by premarket_brief), so they share
   one renderer. The note is a set of LENSES — the book, its factor exposure, the market, the names'
   news, risks, catalysts, what's next — rather than a narrative, and it is capped hard: the evening
   note had grown to 1,217 words, of which risks alone were 453. */
const OBS_SECTIONS = [["portfolio","The book"],["factors","Factor read"],["market","Market"]];
function obsList(items){
  return (items||[]).map(x =>
    `<li><b>${esc(x.obs||x.risk||x.shift||"")}</b><div class="muted">${esc(x.note||"")}</div></li>`).join("");
}
// Notes written before 2026-10-14 used performance / movers / risks_this_week / week_ahead. The
// Holdings arrows and the Memo tab read 30 days back, so without this every historical note would
// render with only its news and catalysts — the rest silently gone.
// When a note was actually written, not just which day it is about. The pre-open note on
// 2026-10-14 was generated at 15:12 ET — five hours into the session — and read identically to one
// written before the bell. created_at ships in site_daily_brief and was never rendered.
function writtenAt(row){
  if(!row || !row.created_at) return "";
  try{
    const d = new Date(row.created_at);
    const t = d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", timeZone:"America/New_York"});
    const day = d.toLocaleDateString("en-CA", {timeZone:"America/New_York"});
    return `<span class="muted" style="font-size:11px">written ${day === row.as_of ? "" : day + " "}${t} ET</span>`;
  }catch(e){ return ""; }
}
function briefShape(b){
  if(!b) return {};
  if(b.portfolio || b.factors || b.market) return b;
  const movers = (b.movers || []).map(m => ({obs: m.ticker, note: m.note}));
  // the old EVENING keys were performance / risks_this_week / week_ahead; the old MORNING ones were
  // overnight / before_the_bell / watch_at_open. Both shapes are still in the 30-day window.
  const lede = b.performance || b.overnight;
  return Object.assign({}, b, {
    portfolio: (lede ? [{obs: b.performance ? "Performance" : "Overnight", note: lede}] : []).concat(movers),
    risks: b.risks_this_week || [],
    catalysts: b.catalysts || (b.before_the_bell || []).map(x => ({when: "", what: x.what, note: x.note})),
    watching: b.watching || b.week_ahead || b.watch_at_open || "",
  });
}
const memoPointer = what => `<div class="note" style="margin:12px 0 0">The ${what} now lives on
  <a href="#memo">Memo</a>, with all three notes for a day on one screen. It used to be repeated on

  b = briefShape(b);
  const sec = (label, inner) => inner ? `<div><h4>${label}</h4><ul class="blist">${inner}</ul></div>` : "";
  const news = (b.news||[]).map(n => {

    return `<li><a href="#holdings/${n.ticker}" class="tk" style="text-decoration:none">${n.ticker}</a> ${
      n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" style="color:inherit">${txt}</a>` : txt}</li>`;
  }).join("");
  const cats = (b.catalysts||[]).map(c =>
    `<li>${c.when ? `<span class="mono amber" style="font-size:12px">${esc(c.when)}</span> ` : ""}<b>${esc(c.what)}</b>${

  return `<div class="bgrid">
      ${OBS_SECTIONS.map(([k,label]) => sec(label, obsList(b[k]))).join("")}

}

function ema(a, n){ const k=2/(n+1); let e=null; return a.map(v=>{ e = e==null ? v : v*k + e*(1-k); return e; }); }
function sma(a, n){ return a.map((_,i)=> i<n-1 ? null : a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n); }

/* ═══ UNIVERSE ═══════════════════════════════════════════════════════════ */
let uFilter = "all";
// ONE predicate for the scatter, the table and their counts, so the two cannot disagree about who is in.
const uKeep = u => uFilter==="all" || (uFilter==="held"&&u.held) || (uFilter==="watch"&&u.watch) || (uFilter==="accum"&&u.bucket==="ACCUMULATE");
const uPlotted = u => u.x!=null && u.y!=null && !!u.quad;      // what the scatter can draw

/* ── Universe table: every tracked name, sortable by size and by the six factors ──────────────
   Sits below the scatter. Size and factors come from site_universe (LIVE.suniv); the rest of each row is
   the nightly payload the scatter already uses. Blanks sink on every key, in either direction. */
let uSort = {k:"mcap", d:1}, uQuery = "";                      // smallest first: the question that prompted it
const U_COLS = [
  {k:"tk",     label:"Ticker",         str:true},
  {k:"sector", label:"Sector",         str:true},
  {k:"mcap",   label:"Mkt cap",        tip:"Market capitalisation. Click once for largest first, again for smallest first", cls:"fac fb0"},
  ...FACTORS.map(f => ({k:"f_" + f.k, label:f.label, tip:f.label + " percentile, 0-100 · " + f.tip, cls:"fac"})),
  {k:"profile",label:"Factor profile", str:true, tip:"The one or two factors the name loads at +1 sigma or more"},
  {k:"quad",   label:"Quad",           str:true},
  {k:"comp",   label:"Composite"},
  {k:"align",  label:"Alignment"},
];
// The size/factor row for a name: the live table, else (if it failed to load) a market-cap-only row built
// from the payload, so the table degrades to dashes with a stated reason instead of failing.
function uSu(u){
  const L = typeof LIVE !== "undefined" ? LIVE : null;
  return (L && L.suniv && L.suniv[u.tk]) || (u.mcap != null ? sunivNorm({market_cap: u.mcap}) : null);
}
function uVal(u, k){
  if(k === "tk") return u.tk;
  if(k === "sector") return u.sector || null;
  if(k === "quad") return u.quad || null;
  if(k === "comp") return u.comp;
  if(k === "align") return u.align;
  const su = uSu(u);
  if(!su) return null;
  if(k === "mcap") return su.market_cap;
  if(k === "profile") return su.factor_profile || null;
  return su[k.slice(2) + "_pct"];                                // f_<factor>
}
function drawUniverseTable(){
  const t = document.getElementById("uTbl"); if(!t) return;
  try{
    const U = D.universe, q = uQuery.trim().toLowerCase();
    const kept = U.filter(uKeep);
    const rows = kept.filter(u => !q || u.tk.toLowerCase().includes(q) || (u.name||"").toLowerCase().includes(q));
    rows.sort((a, b) => {
      const x = uVal(a, uSort.k), y = uVal(b, uSort.k);
      if(x == null && y == null) return a.tk.localeCompare(b.tk);
      if(x == null) return 1;                                    // blanks sink whichever way it is sorted
      if(y == null) return -1;
      const c = typeof x === "string" ? x.localeCompare(y) : x - y;
      return c ? c * uSort.d : a.tk.localeCompare(b.tk);
    });
    t.innerHTML = `<thead><tr>${U_COLS.map(c => {
      const on = uSort.k === c.k;
      return `<th data-k="${c.k}" class="${(c.cls||"")}${on?" sorted":""}" style="cursor:pointer;white-space:nowrap"
        title="${esc(c.tip || "Sort by " + c.label)}">${c.label}${on ? (uSort.d > 0 ? " ↑" : " ↓") : ""}</th>`; }).join("")}</tr></thead><tbody>` +
      rows.map(u => { const su = uSu(u); return `<tr data-open="${esc(u.tk)}" style="cursor:pointer">
        <td style="white-space:nowrap"><div class="tk">${esc(u.tk)}${u.held ? ' <span class="pill">held</span>' : ""}</div><div class="nm">${esc(u.name)}</div></td>
        <td class="muted">${esc(u.sector || "—")}</td>
        <td class="fac fb0">${capCell(su, null)}</td>
        ${FACTORS.map(f => `<td class="fac">${facCell(su, f, null)}</td>`).join("")}
        <td class="muted" style="font-size:12px"${su && su.mcap_bad != null ? ` title="${esc("Profile withheld: it was scored using a market cap that is a units defect")}"` : ""}>${esc(profileLabel(su && su.factor_profile))}</td>
        <td>${qchip(u.quad)}</td>
        <td class="mono ${u.comp!=null&&u.comp<6.5?'neg':''}">${num(u.comp)}</td>
        <td style="white-space:nowrap">${alignBar(u.align)}</td></tr>`; }).join("") +
      (rows.length ? "" : `<tr><td colspan="${U_COLS.length}" class="muted">No names match.</td></tr>`) + "</tbody>";
    // The scatter can only draw a name with both axes and a quad. Say how many of the table's names that leaves
    // off, so "N names here, M dots there" is explained on the page rather than discovered.
    const off = kept.filter(u => !uPlotted(u)).length;
    const sub = document.getElementById("uTblSub");
    if(sub) sub.textContent = rows.length + (q ? " of " + kept.length : "") + " names"
      + (off ? ` · ${off} ${off === 1 ? "has" : "have"} no quad, so ${off === 1 ? "is" : "are"} not on the map` : "")
      + " · click a header to sort, a row for the chart";
    t.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
      const k = th.dataset.k, c = U_COLS.find(x => x.k === k);
      // a new numeric column opens highest-first; text opens A-Z; a repeat click flips
      uSort = {k, d: uSort.k === k ? -uSort.d : (c.str ? 1 : -1)};
      drawUniverseTable();
    });
    t.querySelectorAll("tr[data-open]").forEach(tr => tr.onclick = async () => {
      const tk = tr.dataset.open;
      // the drawer reads LIVE.matrix for grade / quad / guidance, and only the Grid tab loads it
      if(typeof LIVE !== "undefined" && !LIVE.matrix && typeof qAll === "function"){
        try{ LIVE.matrix = await qAll("site_decision_matrix"); }catch(e){}
      }
      if(typeof openName === "function") openName(tk);
      else if(D.holdings.some(h => h.tk === tk)) location.hash = "#holdings/" + tk;
    });
  }catch(e){
    console.error("universe table", e);
    t.innerHTML = `<tbody><tr><td class="muted">The table could not be drawn: ${esc(e.message || e)}</td></tr></tbody>`;
  }
}

  document.getElementById("uTop").innerHTML = top.map(u=>`<div class="li"><span><span class="tk">${u.tk}</span> <span class="nm">${esc(u.name)}</span></span>
    <span style="display:flex;gap:8px;align-items:center">${qchip(u.quad)} ${alignBar(u.align)}</span></div>`).join("");
  const secs = [...new Set(U.map(u=>u.sector||"Other"))].sort((a,b)=>U.filter(u=>(u.sector||"Other")===b).length-U.filter(u=>(u.sector||"Other")===a).length).slice(0,11).reverse();
  mk(document.getElementById("uSec"), {
    grid:{left:150,right:14,top:24,bottom:20}, legend:{top:0,right:0,textStyle:{color:C.muted},itemWidth:10,itemHeight:8},
    xAxis:axY({type:"value"}), yAxis:axX({type:"category",data:secs,axisLabel:{color:C.muted,fontSize:11}}),
    tooltip:{trigger:"axis"},
    series:["Q1","Q2","Q3","Q4"].map(q=>({name:q,type:"bar",stack:"s",barWidth:"62%",itemStyle:{color:C.q[q]},
      data:secs.map(s=>U.filter(u=>(u.sector||"Other")===s&&u.quad===q).length)}))
  });
  const drawInd = () => {
    const nWanted = +(document.getElementById("uIndN")?.value || 14);
    const byQ1 = document.getElementById("uIndQ1")?.checked;
    const names = [...new Set(U.map(u=>u.industry||"Unclassified"))];
    const cnt = i => U.filter(u=>(u.industry||"Unclassified")===i).length;
    const q1share = i => { const n = cnt(i); return n ? U.filter(u=>(u.industry||"Unclassified")===i&&u.quad==="Q1").length/n : 0; };
    let inds = names.filter(i => cnt(i) >= 2).sort((a,b)=>cnt(b)-cnt(a)).slice(0, nWanted);
    inds = inds.sort((a,b)=> byQ1 ? q1share(a)-q1share(b) : cnt(a)-cnt(b));
    const el2 = document.getElementById("uInd");
    if(el2) el2.style.height = Math.max(260, inds.length*26 + 60) + "px";
    mk(el2, {
      grid:{left:210,right:14,top:24,bottom:20}, legend:{top:0,right:0,textStyle:{color:C.muted},itemWidth:10,itemHeight:8},
      xAxis:axY({type:"value"}),
      yAxis:axX({type:"category",data:inds,axisLabel:{color:C.muted,fontSize:10,width:200,overflow:"truncate"}}),
      tooltip:{trigger:"axis", formatter:p => { const i = p[0].axisValue;
        return `<b>${esc(i)}</b><br>` + p.map(x=>`${x.marker}${x.seriesName} ${x.value}`).join("<br>")
             + `<br><span style="opacity:.7">${cnt(i)} names · Q1 ${(q1share(i)*100).toFixed(0)}%</span>`; }},
      series:["Q1","Q2","Q3","Q4"].map(q=>({name:q,type:"bar",stack:"s",barWidth:"62%",itemStyle:{color:C.q[q]},
        data:inds.map(i=>U.filter(u=>(u.industry||"Unclassified")===i&&u.quad===q).length)}))
    });
  };
  drawInd();
  const nSel = document.getElementById("uIndN"), q1c = document.getElementById("uIndQ1");
  if(nSel) nSel.onchange = drawInd;
  if(q1c) q1c.onchange = drawInd;
}

/* ═══ SIGNALS ════════════════════════════════════════════════════════════ */
function signals(el){
  const S = D.signals, H = D.holdings;
  const label = f => ({trend_status:"Trend",extension_flag:"Extension",reversal_setup:"Reversal setup",quadrant:"Quad"}[f]||f);
  el.innerHTML = head("Daily signal engine", "Signals & earnings", `<span class="muted">last 14 days · ${S.length} changes</span>`) +
  `<div class="grid g-2-1">
    ${card("Holdings — signal changes", "trend, extension, reversal and quad changes on names we own", `<div class="scroll"><table class="t" id="sH"></table></div>`)}
    ${card("Earnings calendar", "holdings", `<div class="chart" id="sCal" style="height:420px"></div>`)}
  </div>
  <div style="margin-top:16px">${card("Universe — signal changes", "", `<div class="filters" id="sf" style="margin-bottom:10px"></div><div class="scroll" style="max-height:520px;overflow-y:auto"><table class="t" id="sU"></table></div>`)}</div>`;
  const rowHtml = x => `<tr><td class="mono muted" style="font-size:12px">${x.d}</td><td class="tk">${x.tk}</td><td class="muted">${label(x.field)}</td>
    <td class="mono" style="font-size:12px"><span class="muted">${esc(x.old)}</span> → <b style="color:${/UPTREND|OVERSOLD|True|Q1/.test(x.new)?C.green:/DOWNTREND|OVEREXTENDED|Q3|Q4/.test(x.new)?C.red:C.text}">${esc(x.new)}</b></td></tr>`;
  const hdr = `<thead><tr><th>Date</th><th>Ticker</th><th>Signal</th><th>Change</th></tr></thead>`;
  const held = S.filter(x=>x.held);
  document.getElementById("sH").innerHTML = hdr + "<tbody>" + (held.map(rowHtml).join("") || `<tr><td colspan="4" class="muted">No holding signal changes.</td></tr>`) + "</tbody>";
  let sfv = "all";
  const drawU = () => { const rows = S.filter(x=>!x.held && (sfv==="all"||x.field===sfv));
    document.getElementById("sU").innerHTML = hdr + "<tbody>" + rows.slice(0,300).map(rowHtml).join("") + "</tbody>";
    document.getElementById("sf").innerHTML = [["all","All"],["trend_status","Trend"],["extension_flag","Extension"],["reversal_setup","Reversal"],["quadrant","Quad"]]
      .map(([k,l])=>`<button class="fbtn ${sfv===k?'on':''}" data-f="${k}">${l}</button>`).join("");
    document.querySelectorAll("#sf .fbtn").forEach(b=>b.onclick=()=>{sfv=b.dataset.f;drawU();}); };
  drawU();
  const er = H.filter(h=>h.next_er).sort((a,b)=>a.next_er.localeCompare(b.next_er));
  const today = new Date(); today.setHours(0,0,0,0);
  mk(document.getElementById("sCal"), {
    grid:{left:52,right:60,top:10,bottom:26},
    xAxis:axY({type:"value",axisLabel:{color:C.dim,fontSize:10.5,formatter:v=>v+"d"},name:"days away",nameLocation:"middle",nameGap:22,nameTextStyle:{color:C.dim}}),
    yAxis:axX({type:"category",data:er.map(h=>h.tk),inverse:true,axisLabel:{color:C.muted,fontSize:10.5}}),
    tooltip:{trigger:"item",formatter:p=>`<b>${er[p.dataIndex].tk}</b> reports ${er[p.dataIndex].next_er}`},
    series:[{type:"bar",barWidth:"55%",data:er.map(h=>{const dd=Math.round((new Date(h.next_er)-today)/864e5);
      return {value:dd,itemStyle:{color:dd<=7?C.amber:dd<=21?C.accent:"rgba(106,166,248,.45)",borderRadius:[0,3,3,0]}};}),
      label:{show:true,position:"right",color:C.dim,fontSize:10,formatter:p=>er[p.dataIndex].next_er.slice(5)}}]
  }).on("click", p => location.hash = "#holdings/" + er[p.dataIndex].tk);
}

/* ═══ FACTORS ════════════════════════════════════════════════════════════ */
function factors(el){
  const F = D.factor_snapshot || {}, FS = D.factor_scores, H = D.holdings;
  el.innerHTML = sectionHead("Factors & concentration", `<span class="muted">${F.snapshot_date?"snapshot "+F.snapshot_date:""}</span>`) +
  `<div class="kpis">
    ${kpi("IT sector", pct((F.it_sector_pct||0)/100,1,false), "cap 28%", (F.it_sector_pct||0)>28?"neg":"")}
    ${kpi("Effective N", num(F.effective_n,1), `${H.length} positions`)}
    ${kpi("Avg pairwise corr.", num(F.avg_pairwise_correlation), "limit 0.65", (F.avg_pairwise_correlation||0)>.65?"neg":"")}
    ${kpi("Wtd beta", num(F.wtd_avg_beta), "")}
    ${kpi("Wtd ROIC", F.wtd_avg_roic!=null?num(F.wtd_avg_roic,1)+"%":"—", "")}
    ${kpi("Top-5 weight", F.top5_concentration_pct!=null?num(F.top5_concentration_pct,1)+"%":"—", "")}
  </div>
  <div class="grid g-2-1">
    ${card("Factor fingerprint by holding", "universe percentile per factor (0 = lowest, 100 = highest)", `<div class="chart" id="fHeat" style="height:${Math.max(420, FS.length*22+60)}px"></div>`)}
    <div class="grid" style="gap:16px">
      ${card("Portfolio factor tilt", "average percentile across holdings", `<div class="chart" id="fRadar" style="height:300px"></div>`)}
      ${card("Sector weights", "dotted line = 28% cap", `<div class="chart" id="fSec" style="height:${Math.max(260,new Set(H.map(h=>h.sector)).size*26+40)}px"></div>`)}
    </div>
  </div>
  <div style="margin-top:16px">${card("Portfolio averages", "weighted", `<div class="mtab" style="grid-template-columns:repeat(6,1fr)">${[
      ["Fwd rev growth", F.wtd_avg_fwd_revenue_growth!=null?num(F.wtd_avg_fwd_revenue_growth,1)+"%":"—"],["Momentum 3m", F.wtd_avg_momentum_3m!=null?num(F.wtd_avg_momentum_3m,1)+"%":"—"],
      ["Momentum 12m", F.wtd_avg_momentum_12m!=null?num(F.wtd_avg_momentum_12m,1)+"%":"—"],["Gross margin", F.wtd_avg_gross_margin!=null?num(F.wtd_avg_gross_margin,1)+"%":"—"],
      ["FCF margin", F.wtd_avg_fcf_margin!=null?num(F.wtd_avg_fcf_margin,1)+"%":"—"],["FCF yield", F.wtd_avg_fcf_yield_current!=null?num(F.wtd_avg_fcf_yield_current,2)+"%":"—"],
      ["Fwd P/E", num(F.wtd_avg_pe_forward,1)],["EV / EBITDA", num(F.wtd_avg_ev_ebitda,1)],["Net debt / EBITDA", num(F.wtd_avg_net_debt_ebitda,2)],
      ["Buyback yield", F.wtd_avg_buyback_yield!=null?num(F.wtd_avg_buyback_yield,2)+"%":"—"],["Earnings beats (TTM)", F.pct_earnings_beats_ttm!=null?num(F.pct_earnings_beats_ttm,0)+"%":"—"],
      ["Positive revisions", F.pct_positive_revisions!=null?num(F.pct_positive_revisions,0)+"%":"—"]
    ].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("")}</div>`)}</div>`;
  const facs = ["Value","Momentum","Quality","Low Vol","Size","Growth"];
  const rows = [...FS].sort((a,b)=>a.tk.localeCompare(b.tk)).reverse();
  const data = []; rows.forEach((r,i)=>facs.forEach((f,j)=>{ if(r[f]!=null) data.push([j,i,Math.round(r[f])]); }));
  mk(document.getElementById("fHeat"), {
    grid:{left:56,right:14,top:10,bottom:60},
    xAxis:axX({type:"category",data:facs,position:"top",axisLabel:{color:C.muted,fontSize:11}}),
    yAxis:axX({type:"category",data:rows.map(r=>r.tk),axisLabel:{color:C.muted,fontSize:10.5}}),
    visualMap:{min:0,max:100,orient:"horizontal",left:"center",bottom:6,itemWidth:12,itemHeight:180,textStyle:{color:C.dim},
      inRange:{color:["#b23b3b","#3b2430","#161b24","#233a5c","#6aa6f8"]}},
    tooltip:{trigger:"item",formatter:p=>`<b>${rows[p.data[1]].tk}</b> · ${facs[p.data[0]]}: ${p.data[2]}th pct<br>${esc(rows[p.data[1]].profile||"")}`},
    series:[{type:"heatmap",data,label:{show:true,color:"rgba(255,255,255,.75)",fontSize:10},itemStyle:{borderColor:"#0a0d12",borderWidth:2,borderRadius:3}}]
  });
  const avg = facs.map(f=>{const v=FS.map(r=>r[f]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/(v.length||1);});
  mk(document.getElementById("fRadar"), {
    tooltip:{trigger:"item"},
    radar:{indicator:facs.map(f=>({name:f,max:100})),radius:"66%",axisName:{color:C.muted,fontSize:11},splitLine:{lineStyle:{color:C.line}},splitArea:{show:false},axisLine:{lineStyle:{color:C.line}}},
    series:[{type:"radar",data:[{value:avg.map(v=>Math.round(v)),name:"Portfolio",areaStyle:{color:"rgba(106,166,248,.25)"},lineStyle:{color:C.accent,width:2},itemStyle:{color:C.accent}},
                               {value:facs.map(()=>50),name:"Universe median",lineStyle:{color:C.dim,type:"dashed"},itemStyle:{color:C.dim},symbol:"none"}]}]
  });
  const sw = {}; H.forEach(h=>{const s=h.sector||"Other"; sw[s]=(sw[s]||0)+(h.weight||0);});
  const se = Object.entries(sw).sort((a,b)=>a[1]-b[1]);
  mk(document.getElementById("fSec"), {
    grid:{left:150,right:44,top:8,bottom:22},
    xAxis:axY({type:"value",max:Math.max(.35,Math.max(...se.map(s=>s[1]))+.03),axisLabel:{color:C.dim,fontSize:10,formatter:v=>(v*100).toFixed(0)+"%"}}),
    yAxis:axX({type:"category",data:se.map(s=>s[0]),axisLabel:{color:C.muted,fontSize:11}}),
    tooltip:{trigger:"axis",valueFormatter:v=>pct(v,1,false)},
    series:[{type:"bar",barWidth:"60%",data:se.map(s=>({value:s[1],itemStyle:{color:s[1]>.28?C.red:C.accent,borderRadius:[0,3,3,0]}})),
      label:{show:true,position:"right",color:C.dim,fontSize:10,formatter:p=>pct(p.value,1,false)},
      markLine:{silent:true,symbol:"none",lineStyle:{color:C.gold,type:"dotted"},label:{show:false},data:[{xAxis:.28}]}}]
  });
}

/* ═══ HISTORY ════════════════════════════════════════════════════════════ */
function history(el){
  const HH = D.holdings_history, TR = D.trades;
  const dates = [...new Set(HH.map(x=>x.d))].sort();
  const names = [...new Set(HH.map(x=>x.tk))];
  const lastW = {}; HH.forEach(x=>{ lastW[x.tk] = x.d; });
  names.sort((a,b)=> (lastW[b]||"").localeCompare(lastW[a]||"") || a.localeCompare(b));
  el.innerHTML = `<div class="sub" style="margin:-8px 0 14px">${dates.length} allocation snapshots · ${names.length} names ever held</div>` +
  `${card("Holdings through time", "each cell = weight at that allocation snapshot", `<div class="scroll"><div class="chart" id="hHeat" style="height:${Math.max(420,names.length*17+80)}px;min-width:${Math.max(700,dates.length*44+140)}px"></div></div>`)}
  <div class="grid g-2-1" style="margin-top:16px">
    ${card("Trade log", "most recent 60", `<div class="scroll" style="max-height:560px;overflow-y:auto"><table class="t" id="hT"></table></div>`)}
    ${card("Turnover by snapshot", "names added / removed vs the prior snapshot", `<div class="chart" id="hTurn" style="height:360px"></div>`)}
  </div>`;
  const byD = {}; HH.forEach(x=>{ (byD[x.d]=byD[x.d]||{})[x.tk] = x.w; });
  const data = []; dates.forEach((d,i)=>names.forEach((tk,j)=>{ const w = byD[d][tk]; if(w!=null && w>0) data.push([i,j,+(w>1?w/100:w).toFixed(4)]); }));
  const maxW = Math.max(...data.map(x=>x[2]), .05);
  mk(document.getElementById("hHeat"), {
    grid:{left:60,right:14,top:10,bottom:60},
    xAxis:axX({type:"category",data:dates,axisLabel:{color:C.dim,fontSize:10,rotate:45}}),
    yAxis:axX({type:"category",data:names,axisLabel:{color:C.muted,fontSize:10}}),
    visualMap:{min:0,max:maxW,show:false,inRange:{color:["#1b2a44","#6aa6f8"]}},
    tooltip:{trigger:"item",formatter:p=>`<b>${names[p.data[1]]}</b> · ${dates[p.data[0]]}<br>weight ${pct(p.data[2],1,false)}`},
    series:[{type:"heatmap",data,itemStyle:{borderColor:"#0a0d12",borderWidth:1.5,borderRadius:2}}]
  });
  const add=[], rem=[];
  dates.forEach((d,i)=>{ if(!i){add.push(Object.keys(byD[d]).length);rem.push(0);return;}
    const a=new Set(Object.keys(byD[dates[i-1]])), b=new Set(Object.keys(byD[d]));
    add.push([...b].filter(x=>!a.has(x)).length); rem.push(-[...a].filter(x=>!b.has(x)).length); });
  mk(document.getElementById("hTurn"), {
    grid:{left:36,right:10,top:24,bottom:50}, legend:{top:0,right:0,textStyle:{color:C.muted},itemWidth:10,itemHeight:8},
    xAxis:axX({type:"category",data:dates,axisLabel:{color:C.dim,fontSize:10,rotate:45}}), yAxis:axY({type:"value"}),
    tooltip:{trigger:"axis",valueFormatter:v=>Math.abs(v)},
    series:[{name:"Added",type:"bar",stack:"t",data:add,itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},
            {name:"Removed",type:"bar",stack:"t",data:rem,itemStyle:{color:C.red,borderRadius:[0,0,3,3]}}]
  });
  document.getElementById("hT").innerHTML = `<thead><tr><th>Date</th><th>Action</th><th>Ticker</th><th class="r">Shares</th><th class="r">Price</th><th class="r">Amount</th><th>Rationale</th></tr></thead><tbody>` +
    TR.map(t=>`<tr><td class="mono muted" style="font-size:12px">${t.d}</td><td><span class="chip ${t.action==='BUY'?'ok':t.action==='SELL'?'bad':''}">${t.action}</span></td>
      <td class="tk">${t.tk}</td><td class="r mono">${num(t.shares,2)}</td><td class="r mono">${usd(t.price,2)}</td><td class="r mono">${usd(t.amount)}</td>
      <td class="muted" style="white-space:normal;min-width:260px;font-size:12.5px">${esc(t.why)}</td></tr>`).join("") + "</tbody>";
}
</script>
